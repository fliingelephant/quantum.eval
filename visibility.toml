# Named visibility levels: schema section -> location.
#   workspace = worker reads it directly (materialized into the workspace)
#   dialogue  = sim-user knows it, reveals only if asked
#   judge     = never crosses the seam
# Every section is listed explicitly — no implicit defaults. Graded runs
# require truth = "judge" (lint rule at materialization, not a hardwired
# special case). A task in the eval pack references one level by name;
# any new kind or degree of blindness is a new named map here.

[open]
problem = "workspace"
method = "workspace"
method_params = "workspace"
software = "workspace"
software_params = "workspace"
anchors = "workspace"
truth = "judge"

[results-blind]
problem = "workspace"
method = "workspace"
method_params = "workspace"
software = "workspace"
software_params = "workspace"
anchors = "dialogue"
truth = "judge"

# The supervisor headline experiment: eliminate method information;
# persona knows the problem and the paper's claims, nothing about methods.
[methods-blind]
problem = "workspace"
method = "judge"
method_params = "judge"
software = "judge"
software_params = "judge"
anchors = "dialogue"
truth = "judge"
