# Named visibility levels: schema section -> location.
#   workspace = worker reads it directly (materialized into the workspace)
#   dialogue  = sim-user knows it, reveals only if asked
#   judge     = never crosses the seam
# Every section is listed explicitly — no implicit defaults. truth's
# location controls only whether the PAPER'S stated results stay readable
# to the worker; the judge always receives the [truth] answer key for
# grading, regardless of any map. A task in the eval pack references one
# level by name; any new kind or degree of blindness is a new named map.

[open]
problem = "workspace"
method = "workspace"
method_params = "workspace"
software = "workspace"
software_params = "workspace"
anchors = "workspace"
truth = "workspace"

[results-blind]
problem = "workspace"
method = "workspace"
method_params = "workspace"
software = "workspace"
software_params = "workspace"
anchors = "dialogue"
truth = "judge"

# The supervisor headline experiment: eliminate METHOD information only;
# the problem and the paper's claims (results) stay readable.
[methods-blind]
problem = "workspace"
method = "judge"
method_params = "judge"
software = "judge"
software_params = "judge"
anchors = "dialogue"
truth = "workspace"
