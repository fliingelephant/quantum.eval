[candidate_notes]
model = "perturbed Z4 quantum-double model (maps to two coupled quantum Ising models), square lattice; C4v-symmetric iPEPS + CTMRG via automatic differentiation, (D,chi)=(4-7, 100-160)"
headline = "continuous toric-code <-> double-semion transition, XY* universality; order parameter + correlation length; exact TC/DS wavefunctions + anyon-deconfinement theory"
compute = "headline physics established at D<=6, chi<=100: minutes-to-hours per point on CPU. Per-target tier: highest-precision exponent (D=7, chi=160) is beyond light -- select D<=6 targets"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "Perturbed Z4 quantum double model on the square lattice, combining the fixed-point Z4 QD Hamiltonian, the fixed-point DS construction, and perturbations proportional to h_x, h_z, and h_w."
model_provenance = "Literal papers/2508.08376/2508.08376_continuous-topological-phase-transition-between-mathbb-z-2-t.md:66-91"
convention = "Z4 qudits live on edges; X shifts the qudit and Z supplies its phase, with vertex and plaquette operators A_v and B_p. Electric charges and magnetic fluxes are labeled by e^n and m^k, and dyons by e^n m^k."
convention_provenance = "Literal papers/2508.08376/2508.08376_continuous-topological-phase-transition-between-mathbb-z-2-t.md:66-72"
dimension = "(2 + 1)D quantum model"
dimension_provenance = "Literal papers/2508.08376/2508.08376_continuous-topological-phase-transition-between-mathbb-z-2-t.md:26,62"
lattice = "Square lattice, with primal and dual lattices used for the string and loop operators."
lattice_provenance = "Literal papers/2508.08376/2508.08376_continuous-topological-phase-transition-between-mathbb-z-2-t.md:66,84,96"
instance = "Infinite-lattice ground-state calculations are organized as phase-diagram scans and one-dimensional paths in (h_x,h_z,h_w): the main numerical study uses h_x = -1, the symmetry line h_w = h_z, and the transverse line h_w = 2.980 - h_z; supplemental scans include h_x = 0.5, h_x = 0, and (h_x,h_z) = (0.5,0.1)."
instance_provenance = "Literal papers/2508.08376/2508.08376_continuous-topological-phase-transition-between-mathbb-z-2-t.md:124,140,148,557-573"
observables = "Condensation string order parameters for e^2, e^2 m^2, and m^2, plus Wilson-loop area-law coefficients alpha(e), alpha(em), and alpha(m), with phase labels and critical exponents extracted from their scans."
