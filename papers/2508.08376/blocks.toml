[[blocks]]
sections = ["anchors"]
lines = "625"
text = "We can classify the fields in the O(2) ϕ[4] model in terms of irreps of O(2) group, which includes the one-dimensional trivial irrep **0** , the one-dimensional sign irrep **0**[−] and two-dimensional irreps _**q**_ = _q_ ⊕ (− _q_ ), where the integer _q_ are the O(2) charges. Some fields transform under the irreps of O(2) and their scaling dimensions at the Wilson-Fisher fixed point are shown in Tab. S3. "

[[blocks]]
sections = ["anchors"]
lines = "627"
text = "Let us first consider the Z4 QD-trivial phase transition along the line (i): _hw_ = _hz_ , _hx_ = −1. In the corresponding twocoupled Ising model, the lattice operator that derives this transition is −[�] ⟨ _i_ , _j_ ⟩ � _hw_ τ _[z] i_[τ] _[z] j_[σ] _i[x]_[σ] _[x] j_[+] _[ h][z]_[τ] _[z] i_[τ] _[z] j_ �, which is symmetric under the Z2 × Z2 symmetry. So, we expect that the corresponding field is ϕ[2] 0[+][ ϕ] 1[2][,][because][it][is][also][invariant][under][the][Z][2][×][ Z][2] symmetry: ϕ0 ↔−ϕ0 and ϕ1 ↔−ϕ1. Since the scaling dimension of ϕ[2] 0[+][ ϕ] 1[2][is][∆] **[0]**[=][1][.][51136(22),][the][correlation][length] critical exponent is ν **0** = 1/(3 − ∆ **0** ) = 0.67175(1). Because the quantity α[·]ξ[2] is dimensionless [34], the critical exponent of all area law coefficients is 2ν **0** . Moreover, considering that the local order parameters ⟨τ _[z] i_[⟩][and][⟨][τ] _[z] i_[σ] _i[x]_[⟩][correspond][to][the][fields] ϕ0, ϕ1 with the scaling dimension ∆ **1** = 0.519088(22) , we know ⟨σ _i[x]_[⟩][corresponds to the field][ ϕ][0][ϕ][1][with the scaling dimension] ∆ **2** = 1.23629(11). So the critical exponent of ⟨τ _[z] i_[⟩][and][ ⟨][τ] _[z] i_[σ] _i[x]_[⟩][is][ β][−][=][∆] **[1]**[ν] **[0]**[=][0][.][34870(7), and the critical exponent of][ ⟨][σ] _i[x]_[⟩][is] βϕ = ∆ **2** ν **0** = 0.83048(2). Notice that the critical exponent η of correlation functions can be obtained from scaling dimensions ∆ via η = 2∆ − _d_ + 2, where _d_ = 3 is the spacetime dimension. From ∆ **1** and ∆ **2** , we obtain η **1** ≈ 0.04 and η **2** ≈ 1.47, respectively. Previous work claims that in the XY theory η = η **1** and in the XY* theories η = η **2** [31, 35]. Actually, if we take both local and non-local order parameters into consideration, both η **1** and η **2** can be obtained from the XY or XY* theory. Mapping the local order parameters of the two-coupled quantum Ising model back to the condensation order parameters of the perturbed Z4 QD model, we know the critical exponents of ⟨ _**e**_[2] ⟩ and ⟨ _**e**_[2] _**m**_[2] ⟩ are β−, and the critical exponent of ⟨ _**m**_[2] ⟩ is βϕ. "

[[blocks]]
sections = ["anchors"]
lines = "629"
text = "Then, we consider the transition between the TC and DS phases along the line (ii): _hx_ = −1, _hw_ = 2 _hc_ − _hz_ . When perturbing away from the critical point along this line, the Z2 symmetry exchanging _hz_ and _hw_ is broken. This corresponds to breaking the Z2 symmetry ϕ0 ↔ ϕ1 in the field theory. Thus, the field ϕ[2] 0[−][ϕ][2] 1[with][the][scaling][dimension][is][∆] **[2]**[=][1][.][23629(11)][is][a] candidate relevant field perturbing from the multi-critical point towards TC or DS phases. Therefore, the correlation length critical exponent ν **2** = 1/(3 − ∆ **2** ) = 0.56699(4) determining the critical exponent of the area law coefficients is different from that of the transition between the Z4 QD and the trivial phases. Because in the two-coupled quantum Ising model, ⟨τ _[z] i_[σ] _i[x]_[⟩][and] ⟨τ _[z] i_[⟩][correspond][to][ϕ][0][and][ϕ][1][with][the][scaling][dimension][∆] **[1]**[=][0][.][519088(22),][the][critical][exponent][of][⟨][τ] _[z] i_[σ] _i[x]_[⟩][is][β][′] ϕ[=][∆] **[1]**[ν] **[2]**[=] 0.519088(22) × 0.56699(4) = 0.29432(3). Mapping the local order parameters of the two-coupled Ising model back to the condensation order parameters of the perturbed Z4 QD model, we know the critical exponents of ⟨ _**e**_[2] ⟩ and ⟨ _**e**_[2] _**m**_[2] ⟩ are β[′] ϕ[.] "

[[blocks]]
sections = ["anchors"]
lines = "631"
text = "Next, we discuss the stability of the continuous TC-DS transition under varying _hx_ . The term _hx_ �⟨ _i_ , _j_ ⟩[σ] _i[x]_[σ] _[x] j_[is invariant under] the Z2 × Z2 spin-flip symmetry and the Z2 symmetry exchanging _hz_ and _hw_ . Considering σ _i[x]_[corresponds to the field][ ϕ][2] 0[ϕ] 1[2][[][31][],] we expect that σ _i[x]_[σ] _[x] j_[corresponds to the field][ ϕ][2] 0[ϕ] 1[2][, which is a basis of the O(2) irrep ] **[4]**[ with a scaling dimension 3][.][14(2)][ >][ 3 [][33][],] so it is an irrelevant perturbation and the continuous TC-DS transition point is stable under varying _hx_ . "

[[blocks]]
sections = ["anchors"]
lines = "633"
text = "Finally, since it is also proposed that the O(2) ϕ[4] theory can describe the topological multi-critical point of the standard Z2 TC model in a tilted field [36], let us compare the multi-critical point of the Z2 TC model in a tilted field and that of the perturbed Z4 QD model. The Z2 TC model in a tilted field has phase transitions from the TC phase to the trivial phase by condensing either Z2 charge excitations or Z2 flux excitations. Along the self-dual line, the duality symmetry swaps the Z2 charge and flux excitations, and there is a topological multi-critical point separating the TC phase and a first-order line where the duality symmetry is broken spontaneously [37–39]. Although it is proposed that the O(2) ϕ[4] model can describe the topological multi-critical point of the Z2 TC model in a tilted field [36], the non-trivial mutual statistics between the Z2 charge and the flux excitations of the TC model are not included in the O(2) ϕ[4] model because the two fields ϕ0 and ϕ1 commute with each other. Therefore, it is argued that the multi-critical point of the standard TC might not be the XY* universality class [40]. In contrast, there is no such problem at the multi-critical point of the perturbed Z4 QD model, because the mutual statistics between _**e**_[2] and _**e**_[2] _**m**_[2] are bosonic. "

