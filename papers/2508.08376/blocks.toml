[[blocks]]
sections = ["truth"]
lines = "559"
text = "We show the phase diagrams of the perturbed Z4 QD model on various _hx_ planes in Fig. S2, which exhibit three distinct types of structures. The phase diagrams for 0.1 < _hx_ < 1.0 resemble Fig. S2a, where the TC and DS phases are not directly connected and the Z4 QD and trivial phases are separated by a first-order transition line. As _hx_ decreases into the range −0.2 < _hx_ < 0.1, the first-order line gradually shrinks into a single first-order transition point, such that the four gapped phases meet together, as depicted in Fig. S2b. For −0.8 < _hx_ < −0.2, numerical results suggest the meeting point of the four phases is associated with a continuous phase transition, but we find that its critical exponents may vary continuously with decreasing _hx_ . Previous studies of the 3D classical AT model suggest that there are several possibilities: weakly first-order [22], a wide crossover [23], or continuous but non-universal [24, 25]. So the meeting point in the range −0.8 < _hx_ < −0.2 needs further investigation. Moreover, in the range −1.0 ≤ _hx_ < −0.8, the multi-critical point falls within the XY* universality class, and the shape of the phase diagram is simialr to that of _hx_ = −1 plane, as shown in Fig. S2c. Finally, when _hx_ < −1, corresponding to a strong antiferromagnetic coupling in the two-coupled Ising model, the perturbed Z4 QD model may exhibit a rich phase diagram, as a mixed-order phase is known to emerge in the 3D classical AT model [26, 27], which could imply the existence of a phase in the perturbed Z4 QD model where the Z2 topological orders of TC and DS coexist. "

