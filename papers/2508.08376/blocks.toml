[[blocks]]
sections = ["anchors"]
lines = "391"
text = "Then we consider anyon condensation in the Z4 topological order. The basic rules for Abelian anyon condensation are [1–4]: "

[[blocks]]
sections = ["anchors"]
lines = "393"
text = "- Only bosonic anyons whose topological spins are 1 can condense. "

[[blocks]]
sections = ["anchors"]
lines = "395"
text = "- Anyons whose mutual braiding phase factors with the condensed anyons are not 1 are confined. "

[[blocks]]
sections = ["anchors"]
lines = "397"
text = "- Two anyons that differ by a condensed anyon via the fusion rules become identical. "

[[blocks]]
sections = ["anchors"]
lines = "399"
text = "Based on these rules, we can find that by condensing _**e**_[2] , the remaining anyons are { **1** , _**e**_ , _**m**_[2] , _**em**_[2] }, which are exactly the anyons of the toric code, as shown in Tab. S1. A different toric code can be obtained by condensing _**m**_[2] such that the remaining anyons are { **1** , _**m**_ , _**e**_[2] , _**e**_[2] _**m**_ }. Moreover, there is a bosonic dyon _**e**_[2] _**m**_[2] in the Z4 topological order. By condensing _**e**_[2] _**m**_[2] , the remaining anyons are { **1** , _**em**_ , _**em**_[3] , _**e**_[2] }, also in Tab. S1. These anyons are exactly the anyons { **1** , _**s**_ , ¯ _**s**_ , _**b**_ = _**ss**_ ¯} of the DS, where _**s**_ denotes the semion. "

