lines = "519"
text = "where γ( _e_ ), γˆ( _e_ ) taking values 1 or 3 depends on the direction of the edge _e_ , see Figs. S1d-f. The symbol _aC_ ( _aC_ ˆ) is the set of plaquettes (vertices) surrounded by _C_ ( _C_[ˆ] ). _R_ denotes the set of sites surround by the loop _C_ ( _C_[ˆ] ) after shifting the dual lattice to the primal lattice. The derivation takes advantage of the fact that the ground states of the perturbed Z4 QD model satisfy _A_[2] _v_[=] _[B]_[2] _p_[=][ 1.] There is a small subtly when evaluating the duality transformed order parameters. When the two coupled Ising model _H_ dual is in a symmetry-breaking phase, the even sector projectors enforce the ground states to be the symmetric cat states. Because of the relation lim| _p_ − _p_[′] |→∞ |⟨[�] _e_ ∈ _S_[ˆ] ( _p_ , _p_[′] ) _[X] e_[2][⟩|][1][/][2][=][lim][|] _[i]_[−] _[j]_[|→∞][|⟨][σ] _i[x]_[σ] _[x] j_[⟩][cat][|][1][/][2][=][lim][|] _[i]_[−] _[j]_[|→∞][|⟨][σ] _i[x]_[σ] _[x] j_[⟩|][1][/][2][=][|⟨][σ] _i[x]_[⟩|][ (similar for][ τ] _[z]_[),][where] the string operator is evaluated using a ground state of the perturbed Z4 QD model and the Z2 Pauli operators are evaluated using a ground state of the two-coupled Ising model (“cat” denotes the symmetrized ground state in the even sectors of two Z2 symmetries), it is still valid to evaluate the string order parameter of the perturbed Z4 QD model using the symmetry breaking iPEPS of the two-coupled Ising model. Moreover, from Eq. (S11), the Wilson loop operators of the perturbed Z4 quantum double model are mapped to the disorder operators of the two-coupled Ising model, and it can be checked that ⟨[�] _i_ ∈ _R_[σ] _[z] i_[⟩][cat][=][ ⟨][�] _i_ ∈ _R_[σ] _[z] i_[⟩] (similar for τ _[x]_ ), so it does not matter if we use the symmetric cat states or symmetry breaking states. Since the duality transformation maps between two sets of order parameters related to the spontaneous 1-form symmetry breaking and the spontaneous 0-form symmetry breaking, separately, we can know the mapping between the 1-form symmetry breaking patterns and the 0-form symmetry breaking patterns. Specifically, the Z4 QD model has a Z[(1)] 2[×][ Z] 2[′][(1)] 1-form symmetry (the superscripts denote the form of the symmetry), which has different spontaneous symmetry breaking patterns in different topologically ordered phases, as shown in Tab. S2. After the duality transformation, the two-coupled quantum Ising model has a Z[(0)] 2 × Z[′] 2[(0)] 0-form symmetry, and the spontaneous symmetry breaking patterns in different phases are also summarized in Tab. S2. "

[[blocks]]
sections = ["method"]
lines = "521"
text = "## **C. The underlying physics of the duality transformation** "

[[blocks]]
sections = ["method", "anchors"]
lines = "523"
text = "An interesting question regarding the duality transformation is: How can we explicitly construct the operator that implements the duality transformation? We can think about this question from the fact that two categories Vec(Z4) and Vec[ω][II] (Z2 × Z2) are Morita equivalent [9, 10], where ωII is a type-II cocycle of the Z2 × Z2 group. Specifically, we can apply a finite depth quantum circuit (FDQC) to transform the perturbed Z4 QD model to a perturbed type-II cocycle twisted Z2 × Z2 QD model [11]. Then, applying the tensor product of two Wegner duality (duality[⊗][2] ) transformations on the perturbed but untwisted Z2 × Z2 quantum double model, we get a perturbed model for a non-trivial Z2 × Z2 symmetry-protected topological (SPT) phase. Finally, via another FDQC, we can transform the perturbed non-trivial SPT model to the two-coupled Ising model. The effect of applying these transformations on the fixed point Z4 QD model can be summarized as: "

[[blocks]]
sections = ["method"]
lines = "526"
text = "![](.figures/arxiv__2508.08376/2508.08376.pdf-0011-08.png)"

[[blocks]]
sections = ["method", "anchors"]
lines = "529"
text = "and the transformation for the perturbed Z4 QD model is the same one. We notice that the DS phase suffers from the intrinsic sign problem [12–14], whereas the duality transformation maps it to a paramagnetic phase without the intrinsic sign problem. This indicates that the duality transformation we propose is distinct from the well-known Wegner duality between the Z2 lattice "

[[blocks]]
sections = ["method", "anchors"]
lines = "533"
text = "gauge theory and the Ising model [15], which relates two models both without the intrinsic sign problem. Our duality can instead be understood as a combination of the Wegner duality and finite-depth quantum circuits, which together remove the intrinsic sign problem. It would be interesting to explicitly work out the transformations shown in Eq. (S12) in the future. "

[[blocks]]
sections = ["anchors", "problem"]
lines = "535"
