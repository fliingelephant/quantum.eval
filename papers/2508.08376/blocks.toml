text = "We validate the duality transformation by comparing the energy spectra of the perturbed Z4 QD model _H_ QD and the dual model _H_ dual using exact diagonalization. The agreement between the spectra of the two models confirms the correctness of the duality mapping. "

[[blocks]]
sections = ["method", "anchors"]
lines = "447"
text = "In certain special limits, the two-coupled quantum Ising model in Eq. (S6) can be further simplified. When _hx_ = _hw_ = 0, the degrees of freedom of {σ _[z] i_[}][are][fixed][to][1.][The][model][reduces][to][a][single][(2][ +][ 1)D][transverse-field][Ising][model][(TFIM)][:] _H_ = −4[�] _i_[τ] _i[x]_[−] _[h][z]_ �⟨ _ij_ ⟩[τ] _[z] i_[τ] _[z] j_[.][This][yields][the][critical][point][at] _[h][z]_[=][4][/] _[h]_[TFIM] _c_ , where _h_[TFIM] _c_ = 3.044 330(6) is the known critical field of the TFIM [5]. When _hx_ = 0, _hw_ → +∞, there are constraints τ _[z] i_[τ] _[z] j_[=][σ] _i[x]_[σ] _[x] j_[=][1][,][ ∀⟨] _[i]_[,] _[j]_[⟩][.] _[H]_[dual][reduces to another TFIM:] _H_ = −2[�] _i[s] i[x]_[−] _[h][z]_ �⟨ _ij_ ⟩ _[s][z] i[s][z] j_[, where] _[ s] i[z]_[=][ τ] _[z] i_[and] _[ s] i[x]_[=][ τ] _i[x]_[σ] _[z] i_[.][Similarly, when] _[ h][x]_[=] _[ h][z]_[=][ 0 and] _[ h][x]_[=][ 0][,] _[h][z]_[→][+][∞][,] _[ H]_[dual][ also reduces] to the TFIM. "

[[blocks]]
sections = ["method", "anchors"]
lines = "449"
text = "Our duality transformation at these special limits are almost the Wegner duality transformation, which is a non-invertible transformation, and it does not preserve the locality of operators that are not 1-form symmetric. The Wegner duality exactly transforms the Z2 toric code model in a transverse/longitudinal field on a torus to the direct sum of the even sector TFIM with the periodic boundary condition and the even sector TFIM with the anti-periodic boundary condition [6]. To show our duality transformation does not change the critical behavior of the order parameters we studied in the main text, we check how our duality transforms the symmetry sectors and the boundary conditions between the perturbed Z4 QD model and the two-coupled Ising model. "

[[blocks]]
sections = ["method", "problem"]
lines = "451"
text = "Let us first consider the symmetry sectors. From Eqs. (S1) and (S4), we know σ _[z] i_[and][τ] _i[x]_[of][the][two-coupled][Ising][model] correspond to _B_[2] _p_[and] _[ A]_[2] _v_[of the perturbed][ Z][4][QD model.][When putting the system on a torus, the][ Z][2][×][ Z][2][symmetry operators of] the two-coupled Ising model satisfy[�] _i_[σ] _[z] i_[=][�] _p[B]_[2] _p_[=][�] _i_[τ] _i[x]_[=][�] _v[A]_[2] _v_[=][1, therefore, the perturbed][ Z][4][QD model maps only to] the even sectors of the two Z2 symmetries. "

