text = "Using the duality transformation, the condensation order parameter and Wilson loop order parameters associated with the 1-form symmetries of the Z4 QD model can be mapped to the order and disorder parameters of the two-coupled Ising model with the Z2 × Z2 0-form symmetries, respectively. Specifically, using the relations _Xe_[2][→][σ] _[x] p_ ( _e_ )[σ] _[x] p_[′] ( _e_ )[,] _[Z] e_[2][→][τ] _[z] v_ ( _e_ )[τ] _v[z]_[′] ( _e_ )[, where] _[p]_[(] _[e]_[)] "

