[[blocks]]
sections = ["method"]
lines = "545"
text = "## **SIII. SUPPLEMENTAL NUMERICAL RESULTS** "

[[blocks]]
sections = ["method", "method_params"]
lines = "547"
text = "In this work, the ground states of the two-coupled (2 + 1)D quantum Ising model are approximated by _C_ 4 _v_ -symmetric iPEPS [16, 17] with various bond dimensions _D_ , using the automatic differentiation technique [18]. The contraction of the squared norm of iPEPS is performed approximately using the _C_ 4 _v_ symmetric corner transfer matrix renormalization group (CTMRG) algorithm [19–21], with environment bond dimensions χ. After evaluating the order parameters and the disorder parameters of the two-coupled quantum Ising model, we map them back to the condensation order parameters and the area law coefficients of the perturbed Z4 QD model. "

