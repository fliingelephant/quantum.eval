[[blocks]]
sections = ["anchors"]
lines = "593"
text = "## **SIV. ANALYSIS THE CRITICAL EXPONENT AT THE TC-DS TRANSITION POINT USING** _O_ (2) **FIELD THEORY** "

[[blocks]]
sections = ["anchors"]
lines = "595"
text = "In this section, we show how to predict the critical exponents of the condensation order parameters and the area law coefficients at the TC-DS transition point, i.e. the multi-critical point where four phases meet. A natural candidate for effective GinzburgLandau field theory at the multi-critical point of the two-coupled Ising model is the O(2) ϕ[4] model described by the Lagrangian: "

[[blocks]]
sections = ["anchors"]
lines = "598"
text = "![](.figures/arxiv__2508.08376/2508.08376.pdf-0014-04.png)"

[[blocks]]
sections = ["anchors"]
lines = "601"
text = "where _m_ is the mass and _g_ is the coupling strength, and **ϕ** = (ϕ0, ϕ1) is a two-component order parameter field corresponding respectively to the two local order parameters ⟨τ _[z]_ σ _[x]_ ⟩ and ⟨τ _[z]_ ⟩. The Wilson-Fisher fixed point of the O(2) ϕ[4] model belongs to the XY universality class [29, 30]. However, when the O(2) ϕ[4] model serves as an effective theory for continuous topological phase transitions, people usually say the universality class is the XY*. Next, let us first discuss the detailed distinctions between XY and XY* theories and then we proceed to analysis of the critical exponents. "

[[blocks]]
sections = ["anchors"]
lines = "603"
text = "## **A. Di** ff **erence between XY and XY* theories** "

[[blocks]]
sections = ["anchors"]
lines = "605"
text = "The XY and XY* theory can be distinguished from the field theory perspective. In the XY* theory, ϕ0 can only be created in pairs, and ϕ0 and −ϕ0 are indistinguishable, so that both periodic and anti-periodic boundary conditions have to be considered. Namely the Z2 symmetry of ϕ0 field is gauged by orbifolding the ϕ0 field. Notice that the ϕ1 field remains unchanged. The example of the XY universality class is the transition from the paramagnetic phase to the complete Z2 × Z2 symmetry-breaking phase in the quantum Ashkin-Teller model or in our two-coupled Ising model. The example of the XY* universality class is the transition from the Z2 symmetry enriched topological phase to the trivial Z2 symmetry breaking phase in a Z2 toric code Ising model, which is obtained by gauging one of the Z2 symmetries of the quantum Ashkin-Teller model [31]. In summary, if the phase transition is a conventional Landau type, it corresponds to the XY universality class; if the phase transition involves symmetry-enriched topological phases with symmetry fractionalization, it is called the XY* universality class. "

[[blocks]]
sections = ["anchors"]
lines = "607"
text = "So, strictly speaking, the TC-DS transition is distinct from the XY* theory in Ref. [31] because the perturbed Z4 quantum double model is obtained by gauging _both_ two Z2 symmetries of the two-coupled Ising model [up to 3-cocycle twist, see Eq. (S12)], so there is no 0-form Z2 global symmetry and symmetry enriched topological phases. Therefore, when describing the TC-DS transition using the O(2) ϕ[4] theory, the Z2 symmetry of both ϕ0 and ϕ1 is gauged. In this work, we ignore the distinction between our multi-critical point and the symmetry-enriched topological phase transition in Ref. [31], because roughly speaking, the universality class of conventional phase transitions is the non-starred version and the universality class of topological transitions is the starred version. For instance, people say the Ising transition for the transverse field Ising model and the Ising* transition for the Z2 toric code model in a field [6]. "

[[blocks]]
sections = ["anchors"]
lines = "609"
text = "We also would like to emphasize that although orbifolding ϕ0 and ϕ1 fields will project out the fields with odd parity, we can nevertheless find that their dual objects are the symmetry defects (anti-periodic boundary conditions), whose corresponding lattice operators are non-local semi-infinite string operators. A simple example is the periodic boundary critical Ising chain in the even sector, where the primary field σ with the scaling dimension 1/8 disappears, but its dual primary field µ with the scaling dimension 1/8 appears in the even sector of the anti-periodic critical Ising chain [32], and the corresponding lattice operator is the non-local disorder parameter [8]. Therefore, if we do not restrict to local order parameters and take the non-local order parameters into consideration, it can be found that the local order parameters in the ungauged theory or model and the non-local order parameters in the gauged theory or model are in one-to-one correspondence. Next, we will discuss these order parameters and their critical exponents. "

[[blocks]]
sections = ["anchors"]
lines = "613"
text = "TABLE S3. Classifying fields in the O(2) ϕ[4] model using irreps of the O(2), and the scaling dimensions of the fields are also shown. "

