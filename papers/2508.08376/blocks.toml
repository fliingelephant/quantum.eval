[[blocks]]
sections = ["anchors"]
lines = "376"
text = "## **SI. ANYON CONDENSATION THEORY OF THE** Z4 **QUANTUM DEOUBLE MODEL** "

[[blocks]]
sections = ["anchors"]
lines = "378"
text = "In this section, we review the properties of anyons in the Z4 topological order, and apply the anyon condensation theory to the Z4 topological order. There are three types of anyons in the Z4 topological phase. The electric charges { _**e**_ , _**e**_[2] , _**e**_[3] } correspond to eigenvalues {i, −1, −i} of _Av_ , while the magnetic fluxes { _**m**_ , _**m**_[2] , _**m**_[3] } correspond to the same eigenvalues of _Bp_ . Their composites, _**e**[n]_ _**m**[k]_ ( _n_ , _k_ ∈{1, 2, 3}), are known as dyons. As an Abelian topological order, all anyons of the Z4 topological order are Abelian anyons with the quantum dimension 1. The topological spins of the charges and the fluxes are 1. The topological spins of the dyon _**e**[n]_ _**m**[k]_ are determined by the mutual braiding phase factor i _[nk]_ between _**e**[n]_ and _**m**[k]_ . The mutual braiding of the anyons _**e**[n]_ _**m**[k]_ and _**e**[q]_ _**m**[r]_ ( _n_ , _k_ , _q_ , _r_ ∈{0, 1, 2, 3}) gives rise to the phase factor i _[nr]_[−] _[kq]_ . The properties of these anyons are summarized in Tab. S1. "

[[blocks]]
sections = ["anchors"]
lines = "380"
text = "TABLE S1. Anyons of the Z4 topological order and condensation patterns in the TC and DS phases. The abbreviation “conf.” denotes confinement, and “cond.” denotes condensation. "

