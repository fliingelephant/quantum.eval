chars = "1-354"
text = "Here, we briefly summarize the properties of the noninteracting limit of the 1D BHZ model [35] (always assuming _t >_ 0 and _M ≥_ 0). In presence of periodicboundary conditions, the model (2) can be diagonalized by a Fourier transformation, where the Block Hamiltonian is written in terms of Pauli matrices in the spin _**σ**_ and orbital _**τ**_ spaces:"

[[blocks]]
sections = ["problem", "anchors"]
lines = "148"
text = "![](.figures/arxiv__2412.05975/2412.05975.pdf-0003-17.png)"

[[blocks]]
sections = ["problem", "anchors"]
lines = "151"
chars = "1-587"
text = "where _σ_ 0 denotes the 2 _×_ 2 identity matrix. The Hamiltonian consists of two diagonal blocks in spin space, leading to two spin-degenerate copies of the bands _Ek_ = _±_ [2 _t_ cos( _k_ ) + _M_ ][2] + [2 _λ_ sin( _k_ )][2] . At half filling (e.g., 2 electrons per site on average), trivial and topological phases are obtained for _M/t >_ 2 and _M/t <_ 2, respectively. These two cases can be distinguished by the spinresolved Zak phase _ϕσ_ (the time-reversal symmetry implies that the full Zak phase is always vanishing), as obtained by the eigenstates of either the spin up or down"

[[blocks]]
