text = "We explore the ground-state properties of a one-dimensional model with two orbitals per site"

[[blocks]]
sections = ["method"]
lines = "27"
chars = "277-454"
text = "Our results are primarily based on a Jastrow-Slater wave function and variational Monte Carlo methods, but also corroborated by density-matrix renormalization group calculations."

[[blocks]]
sections = ["anchors"]
lines = "27"
chars = "456-570"
text = "In the non-interacting limit, when varying $M>0$, a gapless point separates a trivial phase from a topological one."

[[blocks]]
sections = ["truth"]
lines = "27"
chars = "572-883"
text = "The inclusion of a finite Hubbard-$U$ repulsion does not give rise to any phase transition within the topological region, inducing a smooth crossover into a Haldane (spin gapped) insulator; notably, the string-order parameter, which characterizes the latter phase, is already finite in the non-interacting limit."

[[blocks]]
sections = ["truth"]
lines = "27"
chars = "885-1112"
text = "Most importantly, at finite values of $U$, the transition between the trivial and topological states is not direct, since an emergent insulator, which shows evidence of sustaining gapless spin excitations, intrudes between them."

[[blocks]]
sections = ["truth"]
lines = "27"
chars = "1114-1383"
text = "A small $V$ interaction further stabilizes the intermediate insulator, while a sufficiently large value of this nearest-neighbor repulsion gives rise to two different charge-density wave insulators, one fully gapped and another still supporting gapless spin excitations."

