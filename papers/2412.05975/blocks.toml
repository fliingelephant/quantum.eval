text = "In particular, for the non-interacting model, it is possible to show that _zσ_ = ( _−_ 1) _[L][−]_[1] _e[iϕ][σ]_ , where _ϕσ_ is the spin-resolved Zak phase; here, transition at _M/t_ = 2 can be detected by a jump in the phase of _zσ_ (from 0 to _π_ ). In general, for a fully gapped insulator that conserves the _z_ component of the total spin, the modulus of this quantity converges to 1 in the thermodynamic limit. As long as either the _η_ -PH or the I+ _η_ sign symmetry [see Eqs. (8) and (11)] is preserved, a _real_ value of _zσ_ is guaranteed, allowing us to discriminate between topological and trivial states according to its sign. By contrast, whenever the aforementioned symmetries are simultaneously broken, the many-body marker may become complex valued."

