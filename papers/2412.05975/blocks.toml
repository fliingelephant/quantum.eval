[[blocks]]
sections = ["problem", "anchors"]
lines = "161"
chars = "1-645"
text = "Figure 2. Phase diagram in the atomic limit, with _t_ = _λ_ = 0. The Uniform and Trivial phases have two electrons on each site; in the former, electrons occupy different orbitals (with an arbitrary spin configuration), while in the latter they reside in the same orbital (the one with the lowest on-site energy). The other two phases (CDW4 _−_ 0 and CDW3 _−_ 1) have non-uniform density patterns; within the CDW4 _−_ 0, sites with 4 electrons alternate with empty sites, and in the CDW3 _−_ 1 there is an alternation between sites with 1 and 3 electrons (and an arbitrary spin configuration). In this case, all transition lines are first-order."

[[blocks]]
sections = ["problem", "anchors"]
lines = "163"
chars = "1-657"
text = "blocks of _H_ 0( _k_ ) [38]. Then, _ϕσ_ = 0 characterizes the trivial region, while the topological phase has _ϕσ_ = _π_ . We mention that, in the presence of open-boundary conditions, edge states appear in the topological phase. In close analogy with the Su-Schrieffer-Heeger model, four zero-energy states (two for each spin value) are present for _M/t <_ 2. This is exact on any cluster taking _M_ = 0 and _λ_ = _t_ . At half filling, these four levels must be filled with 2 electrons, leading to six many-body wave functions. We remark that two of them have both electrons on the same edge, while the other four have the two electrons on opposite edges."

[[blocks]]
sections = ["problem", "anchors"]
lines = "167"
chars = "1-803"
text = "It is instructive to consider the “atomic” limit of the 1D BHZ model, i.e., the case with no hopping terms ( _t_ = _λ_ = 0). The phase diagram for the half-filled case can be easily worked out; see Fig. 2. Here four distinct states are obtained: two of them have uniform density (i.e., two electrons on each site), while the other two have density disproportionations. For moderate values of _V_ and large on-site energy _M_ , a trivial insulator is stabilized, with two electrons in the same orbital (the one having a negative on-site energy). When _M_ is small, the ground state has one electron on each orbital, thus having an exponentially large degeneracy (e.g., 2[2] _[L]_ ) due to the spin component of each electron. Between these two cases, the CDW3 _−_ 1 state is stabilized; also here a large"

[[blocks]]
sections = ["problem", "anchors"]
lines = "171"
chars = "1-334"
text = "degeneracy is present (e.g., 2 _×_ 2 _[L]_ ), due to the singly occupied orbitals and the two-fold degeneracy due to translations. Finally, for large _V_ interactions, the CDW4 _−_ 0 state becomes the lowest-energy configuration; this state is fully gapped, while being two-fold degenerate due to the breaking of translation symmetry."

[[blocks]]
sections = ["method", "anchors"]
