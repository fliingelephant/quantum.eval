text = "The ground-state phase diagram in the ( _M, U_ ) plane is shown in Fig. 3 and contains three different phases. The first one is a trivial insulator, which can be connected to both the non-interacting limit with _M/t >_ 2 and the Trivial state described within the atomic limit. The second one is a topological insulator, connected to the non-interacting state obtained for _M/t <_ 2 and the Uniform state described in the atomic limit. Unexpectedly, we find evidence for a third uniform phase, which intrudes in a narrow region between trivial and topological ones for _U >_ 0. Here our numerical calculations give evidence for gapless spin excitations at _q_ = 0 (while they are gapped at _q_ = _π_ ), even though we cannot exclude the presence of a tiny gap. By contrast, density excitations are gapped, indicating an insulating character. In addition, this phase highlights the breaking of both _η_ - PH and I+ _η_ sign symmetries of Eqs. (8) and (11), while preserving the translational invariance. Let us describe"

