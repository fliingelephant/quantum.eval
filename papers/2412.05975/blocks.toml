text = "the spin structure factor _S_ ( _q_ ) acquires singularities at _q_ = 0 and _π_ , thus signaling the existence of gapless modes"

[[blocks]]
sections = ["truth"]
lines = "399"
chars = "1005-1089"
text = "The presence of a huge peak in the density structure factor at _q_ = _π_ is the hall-"

[[blocks]]
sections = ["truth"]
lines = "401"
