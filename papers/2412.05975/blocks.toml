text = "Finally, our variational Monte Carlo results are compared to DMRG calculations in which we take a matrixproduct state (which has no translational symmetry, although the Hamiltonian is always defined with periodicboundary conditions) and optimize it by means of the algorithm implemented in the ITensor library [41] up to a bond dimension _χ_ = 1600; the accuracy of the calculations is verified by evaluating the variance of the total energy, which is always below 0 _._ 0025 _t_[2] ."

[[blocks]]
