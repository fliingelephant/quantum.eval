lines = "211"
chars = "1-866"
text = "The ground state of this model can be easily figured out in the classical limit, where the alignment of the two spins on different orbitals at the same site is energetically favored, suggesting the picture of an effective spin-1 model governing the low-energy behavior of the system. This conclusion can be made rigorous along the special line _λ_ = _t_ ~~�~~ 1 _−_ ( _U_ 4 _−MV_[2] )[2][,][following][the][argument][detailed][in] Ref. [39]. In this case, the amplitudes of the two terms in Eq. (16) coincide, the total spin on each site **S**[ˆ] _j_ commutes with _HU_ and the ground state belongs to the subspace where the two spins form a triplet on each site. This implies that, in the low-energy sector, the Hamiltonian _HU_ maps into a spin-1 Heisenberg chain, whose ground state is known to exhibit string order and gapped excitation spectrum (Haldane phase)."

[[blocks]]
