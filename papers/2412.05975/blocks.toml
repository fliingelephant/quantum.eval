lines = "397"
chars = "1-426"
text = "For the values of _U/t_ considered here, the transition between the topological insulator and the fully gapped CDW is continuous, see Fig. 9. By contrast, a first-order transition (with a jump in _m_ cdw) is clearly detected when the intra-orbital Hubbard interaction is increased further, e.g., _U/t_ = 14 (not shown). This result is in agreement with DMRG calculations (on chains with open-boundary conditions) of Ref. [35]."

[[blocks]]
sections = ["method", "truth"]
lines = "399"
chars = "1-1089"
text = "For _U/t_ = 6, the intermediate region (where the manybody marker is complex) is characterized by a vanishingly small CDW order parameter up to moderate values of _V_ . For this value of the on-site repulsion, no sign of the CDW3 _−_ 1 is detected. Then, by increasing further the nearest-neighbor interaction, a continuous transition to a fully gapped CDW is observed; see Fig. 9. Furthermore, the transition between the trivial and the CDW4 _−_ 0 insulator is most likely first-order (see Fig. 9). The situation changes for _U/t_ = 10, where the CDW3 _−_ 1 phase appears in a rather wide region of the phase diagram, in between the intermediate insulating phase and the CDW4 _−_ 0 one; see Fig. 8. The presence of the CDW3 _−_ 1 phase can be detected from _m_ cdw, which shows a “step-like” behavior when increasing _V_ , as shown in Fig. 9. Most importantly, the spin structure factor _S_ ( _q_ ) acquires singularities at _q_ = 0 and _π_ , thus signaling the existence of gapless modes, see Fig. 10. The presence of a huge peak in the density structure factor at _q_ = _π_ is the hall-"

[[blocks]]
sections = ["truth"]
lines = "401"
chars = "1-100"
text = "mark of the insurgence of charge disproportionation [i.e., _N_ ( _π_ ) _≈ m_ cdw _L_ ], see Fig. 10."

[[blocks]]
sections = ["truth"]
lines = "401"
chars = "102-1126"
text = "From our variational calculations, the transition between the intermediate state and the CDW3 _−_ 1 one is most likely continuous, as deduced from the smooth behavior of _m_ cdw in Fig. 9; instead, the transition from gapless to gapped CDW phases looks first-order, with a sudden jump in _m_ cdw (from our data, however, we cannot exclude a second-order transition, with a small critical exponent). Remarkably, within the CDW3 _−_ 1 the value of _m_ cdw is always smaller than the “saturation” limit (i.e., _m_ cdw = 2). We emphasize that the latter quantity cannot be used to distinguish between CDW3 _−_ 1 and CDW4 _−_ 0, which also show qualitatively similar (smooth) density-density structure factors _N_ ( _q_ ), compare Figs. 10 and 11. By contrast, these two CDW phases can be distinguished by the presence of singularities in _S_ ( _q_ ): while the fully gapped CDW4 _−_ 0 has a smooth spin-spin structure factor, the gapless CDW3 _−_ 1 displays singularities for both _q_ = 0 and _q_ = _π_ , compare Figs. 10 and 11."

[[blocks]]
sections = ["method", "method_params", "truth"]
lines = "403"
chars = "1-423"
text = "We conclude by mentioning that in both CDW3 _−_ 1 and CDW4 _−_ 0 regions, the optimized variational wave function is constructed from the auxiliary Hamiltonian containing, besides on-site and hopping parameters, a sizable CDW parameter ∆, see Eq. (24). In addition, the quasilong range order in the spin sector is triggered by the fictitious magnetic field _h_ in Eq. (25) and the spin-spin Jastrow factor in Eq. (20) [49]."

