chars = "1-388"
text = "In order to fully specify the strong-coupling phase diagram, we have to assess the spin state in the two regions (Uniform and CDW3 _−_ 1) where an exponential degeneracy is present at _t_ = _λ_ = 0. This goal can be accomplished by using second-order perturbation theory in the hopping amplitudes _t_ and _λ_ , giving rise to Heisenberglike models, written in terms of the spin operators:"

