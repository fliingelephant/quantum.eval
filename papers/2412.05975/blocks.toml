chars = "1-862"
text = "Let us begin with the CDW3 _−_ 1 phase, defined by the inequalities _|U −_ 2 _M | <_ 2 _V_ and _U_ +2 _M >_ 6 _V_ , where each site _j_ hosts a spin _S_ = 1 _/_ 2. The ground-state energy per site at _t_ = _λ_ = 0 is _E_ 0 = 3 _V_ + _[U]_ 2 _[−][M]_[.][Virtual][hoppings] of amplitude _t_ , which do not modify the global orbital occupancy, are always possible, giving a constant contribution to the energy per site ∆ _Et_ = _−_[2] 3 _[t] V_[2][.][Analogously] an inter-orbital hopping of amplitude _isσλ_ from a doubly occupied site to an empty site gives a constant energy per site ∆ _Eλ_ = _−_ 3 _V −_ 2 _Uλ_ +2[2] _M_[.][Instead,][the][inter-orbital][hop-] ping of the same amplitude _isσλ_ between singly occupied sites favors antiferromagnetic ordering and gives a term in the effective spin Hamiltonian reproducing the usual spin-1 _/_ 2 Heisenberg model:"

