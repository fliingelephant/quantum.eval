[[blocks]]
sections = ["problem", "method", "truth", "anchors"]
lines = "419"
chars = "1-1560"
text = "In this work, we studied a 1D electronic model that, in the non-interacting limit, features topological and trivial insulating phases, separated by a continuous transition, where the band gap closes. By including electronelectron repulsion, a rich phase diagram is obtained. In presence of the on-site (intra-orbital) Hubbard- _U_ , the topological insulator is adiabatically connected to the Haldane (spin-1 gapped) insulator. Interestingly, the transition from the trivial to the topological phase is no longer direct, but an intermediate phase intrudes in a small region between them. This intermediate phase (still insulating) is characterized by gapless spin excitations at _q_ = 0 and a complex many-body marker (28), which indicates that both _η_ -PH and I+ _η_ sign symmetries of Eqs. (8) and (11) are broken. By adding the nearest-neighbor _V_ interaction [35], two additional phases emerge, breaking translational symmetries. One of these phases (CDW4 _−_ 0) is stabilized for large-enough values of _V_ and is fully gapped. The other one (CDW3 _−_ 1) appears when _U_ and _V_ have comparable values and sustains gapless spin excitations at both _q_ = 0 and _q_ = _π_ . Among all the phases obtained here, the intermediate one does not have a simple representation in the weak- or strong-coupling limit. Still, our numerical calculations, based on both Jastrow-Slater variational wave functions and DMRG approaches, strongly suggest that the intermediate gapless phase is a genuine state of the system. Further investigations, potentially including a"

[[blocks]]
sections = ["anchors"]
lines = "421"
chars = "56-98"
text = "the gapless non-interacting point _M/t_ = 2"

[[blocks]]
sections = ["method", "method_params", "problem"]
lines = "429"
chars = "1-512"
text = "Here we briefly sketch the effect of time-reversal and lattice symmetries on the parameters that enter the auxiliary Hamiltonian in Eq. (22), used to define the variational wave function. Indeed, while the intra-orbital hoppings are chosen to respect all the symmetries of the physical Hamiltonian, possible (spontaneous) breaking of these symmetries are encoded into the inter-orbital hoppings and/or the fictitious magnetic field _h_ and CDW ∆ parameters, see Eq. (25) and Eq. (24), respectively. We have that:"

[[blocks]]
sections = ["method", "method_params", "anchors"]
lines = "432"
text = "![](.figures/arxiv__2412.05975/2412.05975.pdf-0010-10.png)"

[[blocks]]
sections = ["method", "method_params", "anchors"]
lines = "436"
text = "![](.figures/arxiv__2412.05975/2412.05975.pdf-0010-11.png)"

[[blocks]]
sections = ["method", "method_params", "anchors"]
lines = "440"
text = "![](.figures/arxiv__2412.05975/2412.05975.pdf-0010-12.png)"

[[blocks]]
sections = ["method_params", "anchors"]
lines = "443"
chars = "1-188"
text = "When˜ preserving˜ all these symmetry, we obtain that _λ_ 0 _,σ_ = 0 and _λk,η,σ_ = _isσλk_ (with _λk_ real), as in the 1D BHZ Hamiltonian in Eq. (2) (which only contains the _k_ = 1 term)."

[[blocks]]
sections = ["method_params", "problem"]
lines = "445"
chars = "1-334"
text = "Finally, when the projector _P{Sz_ =0 _}_ is present, as shown in Eq. (19), the _h_ term does not break any of the three local symmetries (TR, SF+ _η_ sign, and _η_ -PH) or the lattice symmetries (I+ _η_ sign and the translational one). On the other hand, the CDW term explicitly breaks _η_ -PH and T, while preserving all the others."

[[blocks]]
