text = "cannot be used to distinguish between CDW3 _−_ 1 and CDW4 _−_ 0"

[[blocks]]
sections = ["truth"]
lines = "401"
chars = "949-1099"
text = "while the fully gapped CDW4 _−_ 0 has a smooth spin-spin structure factor, the gapless CDW3 _−_ 1 displays singularities for both _q_ = 0 and _q_ = _π_"

[[blocks]]
