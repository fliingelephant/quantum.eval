[[blocks]]
sections = ["problem", "truth"]
lines = "363"
chars = "1-1038"
text = "Let us move to the case with _V >_ 0. For that, we consider two values of the intra-orbital interaction _U/t_ = 6 and _U/t_ = 10 and show the phase diagram in the ( _M, V_ ) plane, see Figs. 7 and 8. The first observation is that a (not too large) nearest-neighbor repulsion _V_ enlarges the stability region of the intermediate phase. Most importantly, two additional phases settle down. The first one is a fully gapped CDW, which appears for sufficiently large values of _V_ ; it breaks the translational symmetry by one lattice spacing and is adiabatically connected to the CDW4 _−_ 0 that has been discussed in section II. The second one is an insulating CDW, still breaking the translational symmetry but sustaining gapless spin excitations, connected to the CDW3 _−_ 1 presented in section II. Although the local densities are non-integer for finite values of _U_ and _V_ , we refer to these insulators as CDW4 _−_ 0 and CDW3 _−_ 1. In all cases, the presence of a density disproportionation is marked by the (local) order parameter"

