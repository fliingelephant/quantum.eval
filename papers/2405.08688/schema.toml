[candidate_notes]
model = "spatially anisotropic spin-1/2 square-lattice Heisenberg AFM (coupled chains, lambda=J'/J); SSE, sign-free + continuous-similarity-transformation magnon expansion"
headline = "E/N, staggered magnetization, spin gap, transverse correlation length vs anisotropy; SSE and semi-analytic magnon expansion agree; analytic dispersion<->correlation-length relation"
compute = "moderate-anisotropy curves at L<=32, beta~2L: laptop, minutes-to-hour. CAVEAT: small-lambda high-precision extrapolations are NOT laptop -- target the moderate-lambda sub-results"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "Spin-1/2 easy-axis anisotropic Heisenberg (XXZ) antiferromagnet on the square lattice, with H = J sum over nearest-neighbor bonds of [lambda/2 (S_i^+ S_j^- + S_i^- S_j^+) + S_i^z S_j^z]."
model_provenance = "Literal papers/2405.08688/2405.08688_quantitative-description-of-long-range-order-in-the-mml-math.md:91-94"
convention = "J is the antiferromagnetic exchange scale; lambda = J_xy/J_z is the easy-axis anisotropy, 0 <= lambda <= 1; energies are reported in units of J; the staggered magnetization is chosen positive."
convention_provenance = "Literal papers/2405.08688/2405.08688_quantitative-description-of-long-range-order-in-the-mml-math.md:91-99"
dimension = 2
dimension_provenance = "Literal papers/2405.08688/2405.08688_quantitative-description-of-long-range-order-in-the-mml-math.md:55,153"
