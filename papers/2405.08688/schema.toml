parameter_range = "lambda in [0, 1], from the Ising limit to the isotropic Heisenberg point."
parameter_range_provenance = "Literal papers/2405.08688/2405.08688_quantitative-description-of-long-range-order-in-the-mml-math.md:91,97,315"
qmc_boundary_conditions = "Periodic boundary conditions, N = L^2 sites; campaigns use L = 48, 64, 72 for energy and magnetization, L up to 384 for the gap near lambda = 1, and L up to 100 for the correlation length."
