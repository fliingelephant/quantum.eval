[[anchors.items]]
name = "Heisenberg-point gap"
value = "Delta = 0 at lambda = 1 when SU(2) symmetry is restored"
provenance = "Literal papers/2405.08688/2405.08688_quantitative-description-of-long-range-order-in-the-mml-math.md:97"

[[anchors.items]]
name = "Dispersion to correlation length"
value = "1/xi = Im(k0), where the analytically continued one-particle dispersion satisfies omega(k0) = 0"
provenance = "Literal papers/2405.08688/2405.08688_quantitative-description-of-long-range-order-in-the-mml-math.md:417,453"

[[anchors.items]]
name = "Long-range correlation asymptotic"
value = "In d spatial dimensions, G_r is proportional to exp(-r/xi) / r^(d/2); in two dimensions this is exp(-r/xi)/r"
provenance = "Literal papers/2405.08688/2405.08688_quantitative-description-of-long-range-order-in-the-mml-math.md:371,439-453"

[[anchors.items]]
name = "Second-moment prefactors"
value = "For the 1/r^(d/2) asymptotic in d = 1, 2, 3, the analytic prefactors are sqrt(8/3), sqrt(2), and sqrt(4/3), respectively"
provenance = "Literal papers/2405.08688/2405.08688_quantitative-description-of-long-range-order-in-the-mml-math.md:473-479"

[[anchors.items]]
