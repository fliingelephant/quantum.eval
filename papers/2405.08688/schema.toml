[method]
chosen = [
  { family = "qmc", algorithm = "stochastic series expansion (SSE) with directed-loop updates", provenance = "Literal papers/2405.08688/2405.08688_quantitative-description-of-long-range-order-in-the-mml-math.md:81,105-141" },
  { family = "semi-analytic flow", algorithm = "continuous similarity transformation (CST) in a Dyson-Maleev bosonic representation, with self-consistent Bogoliubov transformation", provenance = "Literal papers/2405.08688/2405.08688_quantitative-description-of-long-range-order-in-the-mml-math.md:211-237" }
]
