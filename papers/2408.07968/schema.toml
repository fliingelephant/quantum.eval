  { panel = "fig7b", quantity = "site-resolved ⟨S^α_i⟩ under field h = 2e-4 along (0,1,0), U4 frame, at ϕ = 0.36π", instance = "L = 96, periodic boundary conditions", tier = "light", truth_source = "figure digitization (Inferred) + coincidence statement (Literal md:587)" },
