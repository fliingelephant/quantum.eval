[method]
family = "mps (Inferred — DMRG is the matrix-product-state route; the paper names the algorithm, not the family)"
algorithm = "DMRG, finite-chain ground-state calculations (Literal md:55 — 'density matrix renormalization group (DMRG)'; refs 37-39 at md:1385-1389). Open chains for entanglement-entropy/central-charge fits (Literal md:67,563); periodic chains for correlation functions, field-response patterns, energy-field scans, and excitation gaps (Literal md:575,587,635,675). Ground states computed in the U4 (four-sublattice-rotated) frame (Literal md:527,763). The Fig. 9 excitation gap requires the lowest excited state at fixed L — excited-state protocol not stated (Inferred — standard multi-state/orthogonalized DMRG)."
valid_alternatives_algorithm = [
  "finite-chain DMRG (the paper's route)",
  "imaginary-time TEBD or TDVP on finite MPS — same ground-state targets, slower convergence at m ~ 1000",
  "iDMRG/VUMPS — bulk order parameters and correlation exponents, but cannot produce the stated finite-L c(L) drifts, finite-chain entropy fits, or the 1/L gap ladder",
]
valid_alternatives_family = [
  "ed — only the smallest instances (the L = 24 gap point; L ≲ 20 cross-checks); the L ≥ 48 targets are out of dense/sparse-ED reach (Inferred)",
  "vmc/nqs — variational checks of energies and order patterns; uncontrolled for entanglement-entropy c(L) fits (Inferred)",
  "qmc — frustrated anisotropic exchange, no known sign-free formulation for these targets (Inferred)",
]

[method_params]
bond_dimension_truncation = "m = 1000 with ϵ = 1e-9 (fig2, Literal md:67); m = 1000 with ϵ = 1e-11 (fig5, Literal md:563); m = 1200 with ϵ = 1e-10 (fig6 md:575, fig7 md:587, fig9 md:675, fig10 md:797, fig11 md:807 — all Literal); m = 1200 with ϵ = 1e-11 (fig8, Literal md:635)"
sizes = "L = 48, 100, 256 OBC (fig2, Literal md:67); L = 256 OBC (fig5, Literal md:563); L = 96 PBC (fig6/fig7/fig10, Literal md:575,587,797); L = 48, 96 PBC (fig8/fig11, Literal md:635,807); L = 24, 48, 72, 96 PBC (fig9, Literal md:675)"
central_charge_fit = "fit S_L(x) to the CFT form Eq. (59) against (1/6)ln[sin(πx/L)] with λ = 1/2 for OBC; the entropy oscillates, so the two branches are fitted separately and the central charge is taken as the average of the two fitted slopes (Literal md:539,563)"
gap_extrapolation = "linear fit of the excitation gap vs 1/L over L = 24, 48, 72, 96, extrapolated to L → ∞ (Literal md:655,675)"
correlation_fit = "power-law exponents from log-log slope of ⟨S^α_1 S^α_x⟩ vs sin(πx/L) (conformal distance) at L = 96 PBC (Literal md:575)"
probe_field_protocol = "symmetry-breaking detection: pin with uniform field h = 2e-4 along (1,1,0) or (0,1,0) in the U4 frame and read the site-resolved pattern (Literal md:587,769); order confirmation: E0/L scanned over field strengths 0 to 8e-4 checking linearity and comparing ΔE_xy vs ΔE_y (Literal md:625,635; scan range Inferred — Fig. 8/11 axes)"
size_trend_protocol = "phase discrimination via the size-dependence of the fitted c: ordered side flows down, gapless side flows up with L (Literal md:541)"

