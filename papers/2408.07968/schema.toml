[problem]
model = "Spin-1/2 Kitaev-Heisenberg chain: H0 = Σ_{⟨ij⟩ ∈ γ bond} [ K S^γ_i S^γ_j + J S⃗_i·S⃗_j ], nearest-neighbor bonds carrying alternating Kitaev component γ = x, y along the chain (Literal md:73-83, Eq. (1) image at md:80). Extension: Kitaev-Heisenberg-Gamma chain H1 = Σ_{⟨ij⟩ ∈ γ bond} [ K S^γ_i S^γ_j + J S⃗_i·S⃗_j + Γ (S^α_i S^β_j + S^β_i S^α_j) ], α ≠ β the two spin directions other than γ (Literal md:113-123, Eq. (5) image at md:116)."
convention = "Kitaev-Heisenberg parametrization K = −sin(ϕ), J = cos(ϕ), ϕ ∈ [0, 2π] (Literal md:86-89, Eq. (2)); studied region ϕ ∈ (arctan 2, π/2), i.e. K < 0, J > 0 (Literal md:55). Kitaev-Heisenberg-Gamma parametrization J = cos(θ), K = sin(θ)cos(ϕ), Γ = sin(θ)sin(ϕ), θ ∈ [0, π], ϕ ∈ [0, 2π] (Literal md:760-763, Eq. (76)); Γ > 0 without loss of generality (Literal md:129). All numerics are performed in the four-sublattice-rotated (U4) frame, and the plotted spin patterns/correlators are U4-frame quantities (Literal md:527,763). Bond-alternation pattern is defined by Fig. 3(a), whose image did not survive rendering — γ = x on one bond sublattice, γ = y on the other (Inferred — standard 1D Kitaev chain convention; Literal md:83 cites Fig. 3(a))."
instance = "1D open or periodic chains; sizes, boundary conditions, couplings, and probe fields are per-target (see targets). Probe fields for order detection: H_xy = −(1/√2) h_xy Σ_i (S'^x_i + S'^y_i), H_y = −h_y Σ_i S'^y_i in the U4 frame (Literal md:591-594, Eq. (60))."
targets = [
  { panel = "fig2", quantity = "central charge c(ϕ) from entanglement-entropy fits, across ϕ ∈ (arctan 2, π/2)", instance = "L = 48, 100, 256; open boundary conditions; U4 frame", tier = "light", truth_source = "text-stated trends only — the Fig. 2 plot image was not extracted by the renderer (Literal md:67 caption; md:541-543 trends)" },
  { panel = "fig5a", quantity = "fitted central charge at ϕ = 0.38π (two entropy branches + average)", instance = "L = 256, open boundary conditions", tier = "light", truth_source = "picture text (Literal md:560) + figure image" },
