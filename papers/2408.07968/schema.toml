[software_params]
stated = "none — the paper reports no implementation-level settings (no eigensolver/Krylov tolerances, noise terms, sweep schedules, subspace-expansion toggles, or threading); the only software-layer fact is the ITensor package itself (see [software])"

[anchors]
hidden_su2_points = "U4 maps (K, J) → (K + 2J, −J); the points K = −2J < 0 (ϕ = arctan 2, called FM′) and K = −2J > 0 are hidden-SU(2) points equivalent to the FM and AFM Heisenberg chains respectively (Literal md:51,105,111,221). Cross-check: at ϕ = arctan(2) the U4-frame Hamiltonian is the isotropic FM Heisenberg chain."
u4_duality = "spectra at ϕ and its U4-dual must coincide; the region ϕ ∈ (arctan 2, π/2) is unitarily equivalent to ϕ ∈ (π/2, π) (Literal md:105,221). Analytic consistency check for any computed observable."
fm_kitaev_point = "ϕ = π/2 (pure FM Kitaev chain) is exactly solvable with ground-state degeneracy 2^{L/2} for L sites (Literal md:229, refs 40-41). Anchors the difficulty/degeneracy structure approaching ϕ → π/2."
gamma_sign_equivalence = "Γ → −Γ under global spin rotation by π about z with K, J unchanged, so Γ > 0 suffices (Literal md:123-129, Eq. (6))."
cft_entropy_formula = "S_L(x) = λ (c/3) ln[(L/π) sin(πx/L)] + …, λ = 1 (PBC) or 1/2 (OBC) (Literal md:531-537, Eq. (59) image at md:534, refs 42-44)."
cft_central_charges = "Luttinger liquid ⇒ c = 1; smallest unitary value c = 0.5 (Ising) (Literal md:537). Benchmarks for fitted c."
luttinger_exponent_product = "in a Luttinger liquid the transverse exponent is 1/(2κ) and the longitudinal exponent is 2κ, so their product equals 1 (Literal md:547); free-fermion point has transverse exponent 0.5 (Literal md:551)."
field_response_ratio = "for order along (0,1,0), equal-strength fields give ΔE_xy = ΔE_y/√2 (Literal md:639-651, Eqs. (63)-(64)); analytic expectation for the Fig. 8/11 comparison."
xxz_kappa_divergence = "in the U4 frame H decomposes into an easy-plane XXZ chain (δ = K + 2J < 0) plus a four-site-periodic perturbation; the Luttinger parameter κ diverges as Δ → −1 (δ → 0⁻), and cos(4√π θ) has scaling dimension 4/κ (Literal md:267,293,347,389)."
classical_degeneracy = "classical (large-S) analysis gives a U(1)-degenerate in-plane FM manifold in the U4 frame — degeneracy an artifact of neglected quantum fluctuations (Literal md:267-269)."

