chars = "1-343"
text = "The spin ordering has a four-site periodicity in the LLRR phase in the original frame, aligning along _x_ ˆ, _x_ ˆ, ˆ ˆ ˆ ˆ ˆ ˆ _−x_ , _−x_ or _y_ , _y_ , _−y_ , _−y_ directions in a four-site unit cell, hence the name LLRR (left-left-right-right for short). We note that the LLRR phase was erroneously identified as a spiral phase in Ref. 21."

