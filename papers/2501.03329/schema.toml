  {name = "transverse-field exact solution", value = "For h = (0, 0, hz), the Majorana spectrum is Eq. (2); at hz = 0 two bands are flat and vanish, giving 2^Nc degeneracy.", provenance = "Literal papers/2501.03329/2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:71,74,77"},
  {name = "decoupled-cell threshold", value = "At Ky = 0, hx = Kx/2 is the special point; hx > Kx/2 gives the polarized-cell ground state and hx < Kx/2 gives the 2^Nc low-energy degeneracy.", provenance = "Literal papers/2501.03329/2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:159,163,187"},
  {name = "zero-field degeneracy", value = "The 2^Nc-fold degeneracy is not lifted at any perturbative order at zero field.", provenance = "Literal papers/2501.03329/2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:207"},
  {name = "classical M instability", value = "hx,c1 = S(Kx - Ky), Kx >= Ky; it vanishes at Kx = Ky.", provenance = "Literal papers/2501.03329/2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:245,248,251"},
  {name = "polarized-state instability", value = "hx,uc = S(Kx + Ky).", provenance = "Literal papers/2501.03329/2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:283,286"},
  {name = "low-field effective transition", value = "phi_xy,c approximately arctan[Ky/(4 sqrt(Kx)(Kx - Ky))].", provenance = "Literal papers/2501.03329/2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:297,300"},
  {name = "exactly solvable longitudinal points", value = "(hx*, hy*) = (Kx/2, Ky/2), equivalently (h*, phi_xy*) = (K/2, alpha), with two-fold degenerate ground states and E0 = -Nc(Kx + Ky)/4.", provenance = "Literal papers/2501.03329/2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:391,394,381"},
  {name = "fourth-order ANNNI threshold", value = "The fourth-order effective model has nearest- and next-nearest-neighbor Ising couplings; hx,c2 is given by Eq. (34), and the competing phase carries 8-site periodicity analytically.", provenance = "Literal papers/2501.03329/2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:397,400,409,429,432"},
