# Searcher notes; superseded by [problem]/[truth] sections after paper-to-schemas.
[candidate_notes]
model = "anisotropic spin-1/2 Kitaev chain in a field; ground-state DMRG"
headline = "field angle/magnitude phase diagram: four-site and larger-unit-cell orders + six-site uniform-chirality phase; degenerate perturbation theory derives the effective couplings selecting each phase"
compute = "spin-1/2 chain, gapped ordered phases, chi ~ 1e2; laptop, minutes-to-hour"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "An anisotropic spin-1/2 Kitaev chain with x-bond Kx, y-bond Ky, and a magnetic field coupled to the two spins in every unit cell."
model_provenance = "Literal 2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:68-71"
hamiltonian_convention = "H = sum_j [Kx/4 sigma^x_{j,A} sigma^x_{j,B} + Ky/4 sigma^y_{j,B} sigma^y_{j+1,A} + h dot (sigma_{j,A}+sigma_{j,B})/2]."
hamiltonian_convention_provenance = "Literal 2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:68"
dimension_and_unit_cell = "One-dimensional chain; Nc unit cells, each with two sublattice sites A and B, so N = 2Nc physical sites."
dimension_and_unit_cell_provenance = "Literal 2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:71,91"
bond_parameterization = "Kx = K cos(alpha), Ky = K sin(alpha), K = sqrt(2), Kx >= Ky >= 0, and 0 <= alpha <= 45 degrees; the isotropic point is alpha = 45 degrees."
bond_parameterization_provenance = "Literal 2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:87"
field_parameterization = "For the longitudinal field, (hx, hy) = h (cos(phi_xy), sin(phi_xy)) in the upper-right quadrant; the transverse field is (0, 0, hz)."
field_parameterization_provenance = "Literal 2501.03329_field-induced-ordered-phases-in-anisotropic-spin-mml-math-xm.md:71,79,89"
boundary_conditions = "PBCs are the default for phase diagrams; OBCs are used for on-site magnetizations and unit-cell correlators."
