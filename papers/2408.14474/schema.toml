numerical_route = { value = "DMRG ground-state calculations followed by gap, entropy/central-charge, fidelity-susceptibility, and entanglement-spectrum measurements", provenance = "Literal 2408.14474_phases-and-phase-transitions-in-a-dimerized-spin-mathbf-frac.md:334-436; 856-908" }
