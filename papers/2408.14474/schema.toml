[method]
chosen = "Finite-system density-matrix renormalization group (DMRG) using a matrix-product-state (MPS) ansatz, applied to the hard-core-boson representation of the chain."
chosen_provenance = "Literal 2408.14474_phases-and-phase-transitions-in-a-dimerized-spin-mathbf-frac.md:592,610,854"
route = "Ground-state DMRG followed by charge/neutral-gap calculations, entanglement-entropy fits for c, fidelity susceptibility, and entanglement-spectrum analysis."
route_provenance = "Literal 2408.14474_phases-and-phase-transitions-in-a-dimerized-spin-mathbf-frac.md:334-436,856-908"
central_charge_estimator = "For OBC, c is obtained from Cardy-Calabrese fits of the von Neumann entropy, with an alternative two-point entropy-difference estimate."
