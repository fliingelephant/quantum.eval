chars = "1-618"
text = "We perform the numerical simulations by using the density matrix renormalization group (DMRG) method [60, 61] based on matrix product states (MPS) ansatz [62–64], which is a sophisticated numerical technique to efficiently solve low dimensional quantum manybody systems. In order to ensure sufficient accuracy of this method, we run the algorithm with 10 number of sweeps and a maximum of 500 bond dimensions. We consider a fixed number of particles at density _ρ_ = _N/L_ = 1 _/_ 2 with systems consisting of up to _L_ = 1000 lattice sites. Unless otherwise explicitly mentioned, we consider open boundary conditions."

