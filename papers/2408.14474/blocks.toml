lines = "23"
chars = "666-748"
text = "numerical calculations using the density-matrix renormalization group (DMRG) method"

[[blocks]]
sections = ["truth"]
lines = "23"
chars = "751-913"
text = "The phase diagram consists of two Ising paramagnetic phases called IPM$_0$ and IPM$_\\pi$, and a phase with Ising Neel order called IN; all these phases are gapped."

[[blocks]]
sections = ["truth"]
lines = "23"
chars = "915-1102"
text = "The phases IPM$_0$ and IPM$_\\pi$ are separated by a gapless phase transition line given by $0 \\le J_a = J_b \\le 1$ which is described by a conformal field theory with central charge $c=1$."

[[blocks]]
sections = ["truth"]
lines = "23"
chars = "1104-1310"
text = "There are two gapless phase transition lines separating IPM$_0$ from IN and IPM$_\\pi$ from IN; these are described by conformal field theories with $c=\\frac{1}{2}$ corresponding to quantum Ising transitions."

[[blocks]]
sections = ["truth"]
lines = "23"
chars = "1312-1475"
text = "The $c=1$ line bifurcates into the two $c=\\frac{1}{2}$ lines at the point $J_a = J_b = 1$; the shape of the bifurcation is found analytically using RG calculations."

[[blocks]]
sections = ["truth"]
lines = "23"
chars = "1477-1691"
text = "A symmetry analysis shows that IPM$_0$ is a topologically trivial phase while IPM$_\\pi$ is a time-reversal symmetry-protected topological phase (SPT) with spin-$\\frac{1}{2}$ states at the two ends of an open system."

