lines = "191"
text = "## **B. Wormhole updates for retarded interactions** "

[[blocks]]
sections = ["method"]
lines = "193"
text = "In the following, we want to discuss how the coupling to a bath that exchanges particles with the system, as defined in Sec. II B, can be simulated with the worm algorithm. If the system only couples to one bath mode, Eq. (4) is just another hopping term that can be treated as described before. If the bath modes approach a continuum, it is not a priori clear how to choose the weights correctly to hop into the right mode. One way to simulate an Ohmic bath is to couple each site to an independent one-dimensional chain [13] which then has to be simulated together with the system. A convenient way to simulate quantum dissipative interactions is to use retarded interactions, as the one in Eq. (6). So far, the worm algorithm could only deal with diagonal retarded interactions [12], but recently the novel wormhole updates [40] have been introduced in the framework of the directed-loop algorithm which can also simulate off-diagonal retardation efficiently. Here we show how to implement the wormhole updates within the worm algorithm. "

[[blocks]]
sections = ["method"]
lines = "195"
text = "To treat the spin-boson interaction in the interaction picture, we include _Hb_ in the unperturbed part _H_ 0 and _Hsb_ in the perturbation _V_ . Then, the Dyson expansion can be performed as in Eq. (8) and we obtain separate traces over the system and bath degrees of freedom. As has been described in detail in "

