[[blocks]]
sections = ["method"]
lines = "207"
text = "Ref. [40], the quadratic bath modes can be traced out exactly using Wick’s theorem. After reorganizing the perturbation expansion, this results in an effective retarded interaction of the form given in Eq. (6). Alternatively, one can use the coherentstate path integral to integrate out the bath, perform the Dyson expansion, and map everything back to an operator formalism [43]. "

[[blocks]]
