chars = "45-71"
text = "numerically exact QMC study"

[[blocks]]
sections = ["truth"]
lines = "531"
chars = "452-650"
text = "The principal finding is that, for an Ohmic bath, the quasi-superfluid or Luttinger liquid phase is unstable to the presence of infinitesimal bath coupling leading to a long-range ordered superfluid."

[[blocks]]
sections = ["truth"]
lines = "531"
chars = "1078-1269"
text = "Whereas the Mott phase survives in some form (zero superfluid stiffness and small correlation length), the coupling to a gapless bath generates an infinite compressibility at zero temperature."

[[blocks]]
sections = ["truth"]
lines = "533"
chars = "144-357"
text = "we find results consistent with the presence of a renormalized Luttinger liquid over the range of bath couplings explored (α ≤ 0.25) with a Luttinger parameter that steadily decreases as the bath coupling increases"

[[blocks]]
sections = ["anchors"]
lines = "533"
chars = "389-550"
text = "power counting predicts three regimes: the Mott[∗] phase, a dissipative Luttinger liquid and, for sufficiently large _t_ / _U_ , the long-range ordered superfluid"

[[blocks]]
sections = ["truth"]
lines = "533"
chars = "553-910"
text = "Our QMC results for this case are much less compelling than our previous results. In particular, for _t_ / _U_ = 0.2 in the regime where the dissipative Luttinger liquid is expected for small bath couplings, they fairly clearly indicate long-range order for larger α while for smaller α they are merely consistent with finite α stability of the liquid phase."

[[blocks]]
sections = ["truth"]
lines = "535"
chars = "539-684"
text = "Our finding of a Mott phase with diverging compressibility is in accordance with results on the dissipative charge-densitywave phase in Ref. [13]."

[[blocks]]
sections = ["anchors", "truth"]
lines = "535"
chars = "1018-1126"
text = "consistent with the expected _z_ = 2 exponent for an Ohmic bath deep within the dissipative superfluid regime"

[[blocks]]
sections = ["method"]
lines = "539"
chars = "1-381"
text = "The QMC technique, with wormhole updates, can be of use to study a number of dissipative quantum many-particle systems [40]. Our extension to the worm algorithm can be of advantage in the presence of large onsite interactions, as is the case for the Bose-Hubbard model in the Mott phase. Our formulation can also be applied to Dicke-type light-matter interactions in cavities [40]."

