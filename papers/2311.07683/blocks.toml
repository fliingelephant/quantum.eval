text = "At dissipation strengths beyond α ≈ 0.05, ⟨ _b_[†] _i[b][ j]_[⟩] gets enhanced and starts to bend upwards and deviate from the power-law towards a behavior that is consistent with longrange order."

[[blocks]]
sections = ["truth"]
lines = "525"
chars = "1-164"
text = "All in all, we find numerical evidence for long-range order even at _s_ = 1.75 and a weak-coupling behavior that is consistent with a stable Luttinger-liquid phase."

[[blocks]]
sections = ["method"]
