[[blocks]]
sections = ["method"]
lines = "277"
text = "The wormhole updates can be easily included in an existing implementation of the worm algorithm. The biggest algorithmic change concerns the linking of the vertices. In the original formulation, only connections between the different kinks need to be considered while the worm head traverses the world-line configuration. In the presence of the wormholes, we also need to include nonlocal connections in time, which makes it necessary to find appropriate positions in the operator sequence. As a result, the formal computational cost of the wormholes will be slightly slower than linear in β. The calculation of observables in the system’s degrees of freedom is as usual, whereas bath observables are not accessible directly, but can be recovered from the distribution of retarded vertices using generating functionals [44]. For example, the average expansion order of retarded vertices, ⟨ _m_ ret⟩ = −β ⟨ _Hsb_ ⟩/2, is directly related to the spin-boson interaction energy. "

