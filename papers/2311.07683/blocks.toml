text = "t / U  ≈0.195 t / U  ≈0.24<br>Mott * Dissipative Luttinger  Dissipative<br>ad liquid Superfluid t / U<br>**----- End of picture text -----**<br>"

[[blocks]]
sections = ["anchors"]
lines = "507"
chars = "224-602"
text = "For _t_ / _U_ ≲ 0.195, the Mott phase leads to a dissipative insulating phase with infinite compressibility, as discussed in Sec. IV C 2. For _t_ / _U_ ≳ 0.24, the bath is a relevant perturbation and we expect to find a longrange ordered phase, as in the Ohmic case of Sec. IV C 1. In between, power counting suggests that the Luttinger liquid remains stable for small couplings."

[[blocks]]
sections = ["truth"]
lines = "509"
chars = "380-599"
text = "At strong α, we find a clear separation between data sets of ξ/ _L_ at different lattice sizes which slowly increases with _L_ . This behavior is reminiscent of the emergence of long-range order found for the Ohmic case."

[[blocks]]
sections = ["truth"]
lines = "509"
chars = "728-944"
text = "At weak coupling, ξ/ _L_ shows no visible deviations between _L_ = 80 and _L_ = 160 for α < 0.05. In accordance with our results at _s_ = 2.5, this can be interpreted as a signature of a stable Luttinger-liquid phase."

[[blocks]]
sections = ["anchors"]
