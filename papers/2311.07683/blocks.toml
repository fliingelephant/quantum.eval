text = "QMC"

[[blocks]]
sections = ["truth"]
lines = "541"
chars = "15-419"
text = "Upon completion of this work, we became aware of Ref. [51] where signatures of the dissipation-induced long-range ordered phase have been detected for the hard core boson model of Ref. [13] at temperatures β ∝ _L_ using analytical predictions based on the theory for incoherent transverse quantum fluids. This is consistent with our direct numerical evidence of the superfluid phase for Ohmic dissipation."

