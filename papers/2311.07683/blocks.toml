[[blocks]]
sections = ["truth"]
lines = "415"
chars = "1-274"
text = "that α[∗] ( _L_ ) tends to zero as 1/ _L_ → 0. This finite-size scaling result indicates that the Luttinger liquid is destabilized for any finite bath coupling in agreement with the power-counting argument. The resulting phase appears to be long-range ordered for any α > 0."

[[blocks]]
sections = ["anchors"]
lines = "417"
chars = "414-542"
text = "In field theory, the free propagator is proportional to 1/( _k_[2] + _c_ 1 ω[2] + _c_ 2 ω _[s]_ ) suggesting _z_ = 2 for _s_ = 1."

[[blocks]]
sections = ["truth"]
lines = "417"
chars = "544-728"
text = "At large dissipation strengths, the temperature convergence discussed in Appendix B is consistent with this scenario, but not precise enough to allow us to draw a definitive conclusion."

[[blocks]]
sections = ["truth"]
lines = "419"
chars = "1-144"
text = "The summary of this part is that the Luttinger liquid phase of the Bose-Hubbard model in one dimension is unstable to coupling to an Ohmic bath."

