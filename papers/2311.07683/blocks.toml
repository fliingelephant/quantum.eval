lines = "133"
text = "## **III. QUANTUM MONTE CARLO METHOD** "

[[blocks]]
sections = ["method"]
lines = "135"
text = "For our simulations, we developed a continuous-time QMC method with wormhole updates, which have been introduced recently in the context of the directed-loop algorithm [40]. In the following, we will show how the wormhole updates can be implemented in the worm algorithm [39], which has advantages in the presence of strong diagonal interactions, as is the case for the Bose-Hubbard model for large _U_ / _t_ . "

[[blocks]]
sections = ["method"]
lines = "139"
text = "## **A. Interaction representation and worm algorithm** "

[[blocks]]
sections = ["method"]
lines = "147"
text = "In the interaction picture, we split the Hamiltonian _H_ = _H_ 0 − _V_ into an unperturbed part _H_ 0 that is diagonal in the real-space occupation-number basis and an off-diagonal perturbation _V_ , such that the Dyson expansion of the partition function becomes "

[[blocks]]
sections = ["method"]
lines = "150"
text = "![](.figures/arxiv__2311.07683/2311.07683.pdf-0003-27.png)"

[[blocks]]
sections = ["method"]
lines = "155"
text = "Here, we have defined _V_ (τ) = _e_[τ] _[H]_[0] _Ve_[−][τ] _[H]_[0] . Because the operator sequence _V_ (τ _m_ ) . . . _V_ (τ1) is time-ordered for a given expansion order _m_ , it can be interpreted as performing an imaginary-time evolution of an initial state |α0⟩, for which each operator _V_ (τℓ) propagates the state from |αℓ−1⟩ to |αℓ⟩. The states |αℓ⟩ are many-body eigenstates of _H_ 0 in the occupation-number basis with eigenenergies _E_ ℓ[0][so][that][only] the application of _V_ can change the state. We assume that the operators _V_ are non-branching, i.e., each initial state is mapped to exactly one final state. Then, the trace over all states |{α}⟩ reduces to a sum over the initial state |α0⟩, as the trace requires |α _m_ ⟩ = |α0⟩. As a result, the partition function has become a sum over world-line configurations that describe the propagation of a set of particles in imaginary time. "

[[blocks]]
sections = ["method"]
lines = "157"
text = "Path-integral QMC methods provide an efficient way to sample the sum over all world-line configurations. A Monte Carlo configuration is described by the set C = {α0, _m_ , C _m_ } for which all vertex labels are contained in C _m_ = {ν1, . . . , ν _m_ }. Eventually, the partition function becomes "

[[blocks]]
sections = ["method"]
lines = "160"
text = "![](.figures/arxiv__2311.07683/2311.07683.pdf-0004-03.png)"

[[blocks]]
sections = ["method"]
lines = "163"
text = "In particular, _W_ (C) factorizes into a product of vertex weights _W_ νℓ = ⟨αℓ| _V_ νℓ |αℓ−1⟩. Each vertex is characterized by a set of variables ν = {Γ, ˜ν}, where Γ distinguishes different types of vertices and ν˜ contains the internal variables of each vertex. For example, for the isolated Bose-Hubbard model in Eq. (1), _V_ is given by the hopping term, such that we set the label Γ = ”hop” and have ν˜ = { _i_ , τ}. The vertex weights become "

[[blocks]]
sections = ["method"]
lines = "165"
chars = "1-272"
text = "which have to be incorporated appropriately in the product of all weights. In the following, we will briefly summarize the ideas of the worm algorithm, but omit to describe the algorithmic details, which can be found in the standard literature on this method [39, 41, 42]."

[[blocks]]
sections = ["software"]
lines = "165"
chars = "274-358"
text = "Our Julia implementation closely follows the open-source code described in Ref. [42]."

[[blocks]]
sections = ["method"]
lines = "167"
text = "We now summarize the basic updates using the notation of Ref. [42]. To switch from the partition function to the Green’s function sector, we use an update called INSERTWORM, which inserts a pair of creation and annihilation operators right after each other at a random position. We choose one of the two operators as the worm head which can now perform a random walk through space and time. To this end, we can apply the MOVEWORM update, which moves the worm by some distance ∆τ that is determined by the diagonal energies in the exponential factors. Moreover, the worm has the option to insert a new kink and hop to its neighboring site via the INSERTKINK update, but also to delete an existing kink via a reverse process described by the DELETEKINK update. For the Bose-Hubbard model with local occupation numbers larger than one, a situation can occur where a kink cannot be deleted; then we use the PASSINTERACTION update, in which the worm head moves straight through the kink. Once the worm head returns to its tail, we can use the GLUEWORM update to remove the world-line discontinuities and return to the partition function sector. Each of the individual updates are local moves that scale as O(β[0] _L_[0] ). As the average expansion order ⟨ _m_ ⟩∝ _L_ β, the worm algorithm scales linearly in the system parameters in order to generate statistically independent Monte Carlo configurations. For further details, see Ref. [42]. "

