[[blocks]]
sections = ["truth"]
lines = "395"
chars = "712-999"
text = "The overall impression is that, at least at strong dissipation, the Luttinger liquid does not survive the introduction of a bath coupling and that there is instead a tendency to long-range order reflected in the long distance plateau for distances much less than the finite system cutoff."

[[blocks]]
