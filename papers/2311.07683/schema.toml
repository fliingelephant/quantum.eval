[method]
family = "qmc"
algorithm = """
Continuous-time path-integral worm algorithm (Prokof'ev-Svistunov-Tupitsyn
formulation) extended with novel "wormhole" updates that let the worm head
jump nonlocally in imaginary time, sampling the bath-induced retarded
interaction directly as a new off-diagonal vertex type -- adapting the
directed-loop-algorithm wormhole formalism (Weber, PRB 105, 165129 (2022))
into the worm-algorithm / continuous-time framework. Standard worm moves
(INSERTWORM, MOVEWORM, INSERTKINK, DELETEKINK, PASSINTERACTION, GLUEWORM)
are supplemented with INSERTWORMHOLE / REMOVEWORMHOLE / PASSWORMHOLE moves;
the bath is traced out exactly (Wick's theorem) giving a "ret" vertex whose
two imaginary-time legs are sampled by inverse-transform sampling of the
spectral function J(omega) and the bath propagator's time-difference
distribution P(omega,tau-tau').
"""
route_indications_provenance = "Literal 2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:133-277 (Sec. III, whole section)"

valid_alternatives = """
Family level: any sign-free QMC capable of non-Markovian (imaginary-time
nonlocal), off-diagonal interactions. Classical Monte Carlo is a valid
family only for the corresponding CLASSICAL (quantum-rotor) analogue of
dissipative order, not for this quantum bosonic model.
Algorithm level, all producing a strict subset of this paper's targets:
  (a) directed-loop algorithm with wormhole updates in its original
      SSE-like formulation (Weber, PRB 105, 165129 (2022), ref [40]) --
      the source formalism this paper adapts into worm/continuous-time form;
  (b) worm algorithm restricted to DIAGONAL retarded interactions only
      (Cai, Schollwoeck & Pollet, PRL 113, 260403 (2014), ref [12]) --
      cannot reach this paper's off-diagonal single-particle bath coupling;
  (c) explicit simulation of an auxiliary finite 1D bath chain coupled to
      each site (Yan et al., PRB 97, 035148 (2018), ref [13]) -- a
      physically different implementation that does not scale to a
      continuum bath;
  (d) coherent-state path-integral route to integrate out the bath (Weber,
      Assaad & Hohenadler, PRL 119, 097401 (2017), ref [43]) instead of the
      operator / Wick's-theorem route used here.
DMRG (density-matrix renormalization group, ref [38]) is a valid alternative
ONLY for the closed-chain (alpha=0) sub-targets (fig1a_tc, fig1a_K_half,
fig4d_xi_over_L at alpha=0) -- it is not demonstrated in this paper for the
dissipative retarded-interaction model itself.
"""
valid_alternatives_provenance = "Literal 2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:59-63,77,193,207,311,325"

[method_params]
notes = """
- beta (inverse temperature): the ground-state PROJECTION parameter (target
  physical limit is T=0); tuned per L and per phase/coupling until xi/L (the
  main convergence-tracked observable) plateaus. Stated converged values:
  beta*U=1280 for the closed chain at L=80 (Appendix A); up to beta*U=2560
  (Luttinger-liquid side, alpha=0.02) and beta*U=1280 (alpha=0.07) in
  Appendix B; up to beta*U=5120 (Mott side, alpha=0.04) and beta*U=20480
  (L=80 only, alpha=0.0625, near the Mott*-superfluid transition).
- boson occupation cutoff n_i<=10: needed ONLY for the closed (alpha=0)
  simulations; not needed once the bath is coupled, because the retarded
  interaction is treated exactly (no local Fock-space truncation of the
  bath itself is required either, since the bath is integrated out
  analytically, not simulated as explicit degrees of freedom).
- the Eq.28 compressibility estimator kappa=(beta/L)(<N^2>-<N>^2) is itself
  method-level content (a grand-canonical fluctuation estimator, see
  [method]); which beta/L it is evaluated at is the method_params choice.
"""
notes_provenance = "Literal 2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:327,371-375,549-601"

[software]
paper_software = """
Unpublished, unnamed custom Julia implementation ("Our Julia implementation
closely follows the open-source code described in Ref. [42]"). Ref [42] is
an existing open-source continuous-time worm-type-update path-integral QMC
code for Bose-Hubbard and XXZ models (N. Sadoune and L. Pollet, SciPost
Phys. Codebases 9 (2022)); the paper's own code is not itself released or
named beyond "our Julia implementation" -- it implements the paper's new
wormhole-update extension on top of that algorithmic lineage.
"""
paper_software_provenance = "Literal 2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:165"

valid_tool_set = """
Any continuous-time worm-algorithm QMC implementation extensible with a
custom vertex type (the "ret" retarded-interaction vertex) -- e.g. a
from-scratch implementation (as the authors did) or an extension of an
existing worm/directed-loop QMC codebase such as ref [42]'s. The harness's
using-sse skill targets stochastic series expansion, a related but
DIFFERENT QMC flavor (discrete-imaginary-time SSE vs. this paper's
continuous-time worm algorithm with a custom retarded vertex) -- not a
drop-in match; routing needs either a continuous-time worm-QMC package with
custom-vertex support or a from-scratch implementation.
"""

[software_params]
notes = "Not stated: the paper gives no explicit Monte Carlo sweep/bin counts, thermalization length, RNG seed, or solver-tolerance values."

[anchors]
scaling_dimension = """
Delta = 2 - s - K/2 (Eq.23): power-counting scaling dimension of the
retarded-interaction perturbation to the Luttinger liquid (dynamical
exponent z=1 assumed for the LL fixed point); Delta<0 (bath irrelevant) for
s>s_marg, Delta>0 (bath relevant) for s<s_marg.
"""
scaling_dimension_provenance = "Literal 2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:286"

marginal_exponent = """
s_marg = (4-K)/2 (Eq.24): closed-form marginal bath exponent (Delta=0) as a
function of the Luttinger parameter K. Combined with the universal
Luttinger-liquid transition values K=1 (generic point on the Mott-to-quasi-
superfluid boundary) and K=1/2 (at the BKT cusp), this gives s_marg=1.5
(K=1) and s_marg=1.75 (K=1/2).
"""
marginal_exponent_provenance = "Literal 2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:302,307"

dynamical_exponent_prediction = """
Field-theory expectation z=2 for an Ohmic bath (s=1): the free retarded
propagator ~1/(k^2 + c1*omega^2 + c2*omega^s) suggests z=2 for s=1, used as
the cross-check target for the temperature-convergence analysis of the
dissipative long-range-ordered phase (Appendix B).
"""
dynamical_exponent_prediction_provenance = "Literal 2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:417"

