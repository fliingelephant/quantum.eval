[problem]
model = "One-dimensional Bose-Hubbard chain with nearest-neighbor hopping, onsite repulsion, and chemical potential, coupled at every site by single-particle exchange to an independent non-interacting bosonic oscillator bath."
model_provenance = "Literal papers/2311.07683/2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:65,87-93,105-117"
hamiltonian = "Hs = -t Σ_i (b†_i b_{i+1} + h.c.) + (U/2) Σ_i b†_i b†_i b_i b_i - μ Σ_i b†_i b_i; Hb = Σ_iq ω_q a†_iq a_iq; Hsb = Σ_iq λ_q (b†_i a_iq + h.c.)."
hamiltonian_provenance = "Literal papers/2311.07683/2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:87-90,141-144"
convention = "The phase diagram is parameterized by t/U and μ/U. The bath spectral function is J(ω) = 2πα ω_c^(1-s) ω^s for 0 < ω ≤ ω_c; s = 1 is Ohmic and s > 1 is super-Ohmic. The coupling preserves translation and total system-plus-bath U(1) boson-number symmetry, and integrating out the bath gives an off-diagonal retarded interaction with periodic D(τ + β) = D(τ)."
convention_provenance = "Literal papers/2311.07683/2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:105-131"
instance = "One spatial dimension, periodic boundary conditions, zero-temperature/ground-state limit obtained by large β, main line μ/U = 0.3, bath cutoff ω_c/U = 1, and local occupation cutoff n_i ≤ 10 for the isolated-chain calculations. The principal scans use L = 20, 40, 80, 160, 320 where shown, t/U = 0.25 in the Luttinger-liquid phase, t/U = 0.1 in the Mott phase, and super-Ohmic points (μ/U,t/U,s) = (0.5,0.16,2.5) and (0.3,0.2,1.75)."
instance_provenance = "Literal papers/2311.07683/2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:311-327,369-375,483,507-521,561,575,595"
