# ============================================================ extraction (paper-to-schemas)

[problem]
model = """
One-dimensional Bose-Hubbard chain H_s (Eq.1: hopping amplitude -t between
nearest neighbors, onsite repulsion (U/2) n_i(n_i-1), chemical potential
-mu n_i), with each site i linearly coupled by single-particle exchange
(H_sb, Eq.4) to its own independent, mutually non-interacting bosonic bath
H_b (Eq.3) of oscillators a_iq; total system H = H_s + H_b + H_sb. The bath
spectral function is power-law, J(omega) = 2*pi*alpha*omega_c^(1-s)*omega^s
for 0 < omega <= omega_c (Eq.5): s=1 is an Ohmic bath, s>1 super-Ohmic.
Because H_sb is linear in the bath operators, the bath can be integrated
out exactly, giving an effective retarded single-particle interaction
S_ret = -int int b_i^dagger(tau) D(tau-tau') b_i(tau') (Eq.6) mediated by
the bath propagator D(tau) (Eq.7), which decays as ~1/tau^(1+s) for large
omega_c*tau. This coupling preserves lattice translation symmetry and the
combined U(1) boson-number symmetry of system+bath (system-only N is not
conserved once alpha>0).
"""
model_provenance = "Literal 2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:87-131,141"

convention = """
Sign/normalization exactly as in Eq.1 (hopping term carries -t, interaction
+U/2, chemical potential -mu n); H_sb = sum_iq lambda_q (b_i^dagger a_iq +
h.c.) (Eq.4); bath spectral function normalized J(omega) =
2*pi*alpha*omega_c^(1-s)*omega^s (Eq.5) with alpha the dimensionless
dissipation-strength coupling (not a lattice spacing) and omega_c a hard
cutoff frequency (J=0 for omega>omega_c). Energies/couplings reported in
units of U (t/U, mu/U, omega_c/U). Luttinger-liquid correlator convention
<b_i^dagger b_j> ~ |i-j|^(-K/2) (Eq.2, defines K).
"""
convention_provenance = "Literal 2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:97-117"

instance = """
1D chain, periodic boundary conditions, system sizes L in {20,40,80,160,320}
(figure-dependent). First Mott lobe (onsite filling n_i=1) region, explored
mainly along the mu/U=0.3 cut (Ohmic and s=1.75 studies) and additionally at
mu/U=0.5 (s=2.5 study). Closed-chain baseline sweeps t/U in roughly
[0.05,0.30] at mu/U=0.3 (locates the Mott-to-quasi-superfluid boundary at
t_c/U approx 0.195). Dissipative sweeps hold t/U fixed and scan the bath
coupling alpha: t/U=0.25 (Luttinger-liquid side, Ohmic bath, alpha in
[0,0.1]), t/U=0.1 (Mott side, Ohmic bath, alpha in [0,0.08]), t/U=0.16
(super-Ohmic s=2.5, mu/U=0.5, alpha in [0,0.25]), t/U=0.2 (s=1.75, mu/U=0.3,
alpha in [0,0.25]). Bath exponent s in {1 (Ohmic), 1.75, 2.5 (super-Ohmic)};
bath cutoff frequency omega_c/U=1 fixed throughout (paper notes this shifts
precise critical-coupling values but not qualitative/critical behavior).
Target physical limit is T=0 (ground state); QMC is finite-temperature and
approaches T=0 via inverse temperature beta (a numerical projection knob,
see [method_params], not itself a physical-temperature axis under study).
"""
instance_provenance = "Literal 2311.07683_dissipation-induced-long-range-order-in-the-one-dimensional.md:325-331,371-379,433-437,483-489,507-509"

