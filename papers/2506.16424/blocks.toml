[[blocks]]
sections = ["method"]
lines = "349"
text = "## **Replica shift update for** _N >_ 2 "

[[blocks]]
sections = ["method", "problem"]
lines = "351"
text = "As discussed in the main text, for _N >_ 2, the ground state is in the dimerized phase. For a periodic chain, two kinds of dimer coverings are possible and standard RSSE loop updates suffer ergodicity problems while transitioning from one type of dimer covering to another. To solve this problem, during the nonequilibrium work measurement, additional to the standard RSSE loop updates, we use an extra update termed as “replica shift update” where we shift all the bond-operators in the operatorstring by one lattice unit, either to the left or to the right (with equal probability), and we accept this move with a probability depending on the weight ratio. When we shift the operator-string by one lattice unit, total number of loops in a configurations may change, as a result the weight of the configuration also changes. "

[[blocks]]
sections = ["method"]
lines = "353"
text = "We will now outline the algorithm for the replica shift. In what follows, we assume that we are computing the free energy difference _−_ log( _ZA_ 2 _/ZA_ 1), where _A_ 2 and _A_ 1 are arbitrary sets of lattice sites. we first equilibrate the system in the _ZA_ 1 ensemble of configurations (i.e. at _λ_ = 0). To compute the nonequilibrium work done in transitioning from the _ZA_ 1 ensemble to the _ZA_ 2 ensemble the parameter _λ_ is incrementally increased from 0 to 1. After each increment of _λ_ , an additional “replica shift "

