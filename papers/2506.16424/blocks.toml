[[blocks]]
sections = ["method"]
lines = "389"
text = "In the resummed stochastic series expansion (RSSE)QMC the partition functions have a loop decomposition that is expressed as a sum over loop configurations: _Z_ =[�] _c[w][c][N][ ℓ][c]_[, where the weight factor] _[ w][c]_[only depends] on the expansion order and _N[ℓ][c]_ is the spin degeneracy which depends on the total number of loops in configuration [24]. In other words, each loop configuration in the RSSE corresponds to _N[ℓ][c]_ spin configurations in the SSE. This means that RSSE can sample spin configurations more efficiently than SSE, as demonstrated by the shorter autocorrelation times observed in RSSEQMC compared to conventional SSE-QMC [24]. This motivates the expectation that a nonequilibrium work method based on RSSE will outperform the SSE-based "

