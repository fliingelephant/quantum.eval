[method]
route = "Continuous-N loop quantum Monte Carlo in the resummed stochastic series expansion (RSSE), using a nonequilibrium-work/Jarzynski protocol for S_2 and a replica-shift update in the dimerized regime."
route_provenance = "Literal 2506.16424_pseudocriticality-in-antiferromagnetic-spin-chains.md:63,77,91,93-103,107,349-377"
family = "quantum Monte Carlo"
family_provenance = "Literal 2506.16424_pseudocriticality-in-antiferromagnetic-spin-chains.md:63,77"
algorithm = "RSSE loop representation with loop degeneracy weights; interpolate between generalized partition-function ensembles and measure work along independent nonequilibrium trajectories."
algorithm_provenance = "Literal 2506.16424_pseudocriticality-in-antiferromagnetic-spin-chains.md:79-103"
updates = "Replica-shift update translates the bond-operator string by one lattice unit during the nonequilibrium work measurement to address dimer-covering ergodicity."
updates_provenance = "Literal 2506.16424_pseudocriticality-in-antiferromagnetic-spin-chains.md:349-377"
valid_families = ["quantum Monte Carlo", "exact diagonalization for the L=8 benchmark"]
