[paper]
id = "2407.03046"
title = "Insulating and metallic phases in the one-dimensional Hubbard-Su-Schrieffer-Heeger model: insights from a backflow-inspired variational wave function"
authors = "D. Piccioni, F. Ferrari, M. Fabrizio, F. Becca"
journal = "Phys. Rev. B 111, 045125 (2025)"
family = "vmc"
tier = "light"
kind = "physics"
status = "rendered"
doi = "10.1103/PhysRevB.111.045125"
arxiv_version = "2407.03046v3"
md_sha256 = "b61e22cb0035d3995b836dc691902f89487413ceafb745b153a39b4d33ecd157"

[candidate_notes]
model = "1D Hubbard chain + SSH coupling to optical phonons, half-filled and doped; classic VMC with backflow-inspired Jastrow-Slater pair-product (BCS) ansatz"
headline = "phase diagram: Mott vs Peierls insulator at half filling; doped spin-gapped metal (gapless charge, gapped spin, two Fermi points) on L~50-100 chains; bosonization-level identification"
compute = "1D polynomial-cost VMC, few-to-hundreds of parameters: minutes-to-hours on CPU"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "One-dimensional Hubbard-Su-Schrieffer-Heeger electron-phonon chain: nearest-neighbor hopping modulated by optical-phonon displacements, onsite Hubbard repulsion U, and one harmonic oscillator per lattice site."
model_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:73; Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:76"
convention = "The hopping t is the energy scale; the dimensionless electron-phonon coupling is lambda = t alpha^2/(m omega^2) = t alpha_tilde^2/(hbar omega), and calculations fix hbar omega/t = 1."
convention_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:115-121"
instance = "One spatial dimension, L-site periodic chains, total spin projection sum_i S_i^z = 0, half filling N_e = L and hole doping N_e < L with delta = 1 - N_e/L; the reported campaigns use L = 40, 50, 80, and 120."
instance_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:203; Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:297; Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:337"
observables = "Relative variational-energy error epsilon, density N(q), spin S(q), bond B(q) structure factors, and half-filled and doped phase labels inferred from dimerization and structure-factor singularities."
observables_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:107; Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:215; Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:323"

