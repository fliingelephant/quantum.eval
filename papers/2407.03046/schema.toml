[anchors]
items = [
  { name = "dimensionless coupling", relation = "λ = tα²/(mω²) = t̃α̃²/(ℏω)", provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:115-118" },
  { name = "limiting phases", relation = "λ = 0 gives the Mott limit and U = 0 gives the Peierls limit", provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:251" },
  { name = "transition class", relation = "The Mott–Peierls transition is Kosterlitz–Thouless", provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:59,251" },
  { name = "doped momentum", relation = "kF = π(1 − δ)/2 and the structure-factor singularity is at 2kF", provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:297" },
  { name = "correlation diagnostic", relation = "Power-law correlations produce momentum-space cusps and gapless excitations; exponential decay produces smooth structure factors and gaps", provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:275,289" },
  { name = "insulator diagnostic", relation = "N(q) ∝ q² at small q indicates a charge gap; a linear small-q S(q) and logarithmically growing S(π) indicate gapless spin excitations", provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:291-293" },
  { name = "dimerization scaling", relation = "A true dimerization makes B(π) diverge with L", provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:291" },
]

