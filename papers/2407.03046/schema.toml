[method]
family = "Variational Monte Carlo (VMC)"
family_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:27,63"
algorithm = "Metropolis Markov-chain sampling over joint electron and phonon configurations, with a generalized Jastrow–Slater wave function whose electronic pair-product/BCS state depends on phonon coordinates through backflow-inspired correlations."
algorithm_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:125-145,147-171"
optimization = "Stochastic reconfiguration of the variational parameters."
optimization_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:203"
valid_alternatives = ["MPS / DMRG"]
valid_alternatives_provenance = "Inferred: DMRG is explicitly used by the paper to obtain the same energies and structure factors for comparison (Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:221,241,309)."

[method_params]
wavefunction = "Product of electron–electron, phonon–phonon, and electron–phonon Jastrow factors; a phonon condensate with one variational staggered-displacement parameter z; and a phonon-dependent auxiliary BCS/pair-product electronic state with hopping, pairing, chemical-potential, and backflow parameters."
wavefunction_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:125-130,153-179,183-201"
sampling = "Joint electron/phonon Metropolis updates: single or double nearest-neighbor electron hops and local Xj → Xj + Δ phonon moves with Δ uniform on [−Δmax, Δmax]."
sampling_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:139-145"
optimization = "All variational parameters are optimized by stochastic reconfiguration; the Markov estimator uses M sampled configurations."
optimization_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:139-145,203"
cluster_and_boundary = "Periodic clusters; L = 50 for the main calculations and L = 40, 80, 120 for the size-scaling calculation."
cluster_and_boundary_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:193,203,337"
dmrg_reference_setup = "For the DMRG comparison, the phonon occupancy is truncated to at most 10 bosons per site, the MPS bond dimension is χ ≥ 1200 and reaches χ = 2400, and the MPS has no translational symmetry."
dmrg_reference_setup_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:221"
convergence = "DMRG total-energy variance is below 0.007 t² at half filling and below 0.09 t² in the doped case. No VMC sample count, iteration count, or numerical stopping tolerance is stated."
convergence_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:221,311; Inferred: absence of a VMC stopping value after reading the rendered paper."
phase_diagnostic = "Half-filled phase identification uses the staggered displacement/bond order and the small-q or q = 2kF structure-factor singularity/smoothness criteria; the doped phase diagram is constructed from singularities in S(q)."
phase_diagnostic_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:229,243,255-275,325"

