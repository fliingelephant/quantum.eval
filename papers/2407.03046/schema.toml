[method]
family = "Variational Monte Carlo (VMC)"
family_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:27"
algorithm = "Generalized Jastrow-Slater wave function: phonon condensate times phonon-dependent pair-product/BCS electronic state times electron-electron, phonon-phonon, and electron-phonon Jastrow factors; Metropolis sampling and stochastic-reconfiguration optimization."
algorithm_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:63-65; Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:125-145; Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:203"
valid_families = ["variational Monte Carlo", "matrix-product-state / DMRG"]
valid_families_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:221"
valid_algorithms = ["phonon-dependent backflow VMC", "standard Jastrow-Slater / BCS VMC", "DMRG with an MPS"]
valid_algorithms_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:147-171; Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:221"

[method_params]
sampler = "Metropolis Markov chain over electron and phonon configurations; electron proposals are single or double nearest-neighbor hops and phonon proposals are X_j -> X_j + Delta with Delta uniform on [-Delta_max, Delta_max]."
sampler_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:139-145"
samples = "The Monte Carlo estimate averages M sampled configurations; the paper does not state a numerical M."
samples_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:139-142"
phonon_cutoff = "DMRG benchmark truncates the local phonon Hilbert space at 10 bosons per site."
phonon_cutoff_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:221"
bond_dimension = "DMRG MPS bond dimension is above chi = 1200 and reaches chi = 2400 in some cases."
bond_dimension_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:221"
energy_variance = "The DMRG total-energy variance is below 0.007 t^2 at half filling and below 0.09 t^2 in the doped calculations."
energy_variance_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:221; Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:311"

