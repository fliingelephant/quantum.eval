dmrg_translation_setting_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:221"
parallelism = "The VMC implementation runs on parallel CPUs through mpi4jax."
parallelism_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:203"

[anchors]
zero_coupling_limits = "At lambda = 0 the model is the Mott-insulating limit with no electron-phonon coupling; at U = 0 the half-filled limit is Peierls insulating."
zero_coupling_limits_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:251"
fermi_momentum = "For hole doping delta, k_F = pi(1 - delta)/2 and the correlation singularities occur at 2 k_F."
fermi_momentum_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:297"
structure_factor_diagnostics = "Power-law real-space correlations give momentum-space cusps and gapless excitations; exponential decay gives smooth structure factors and gapped excitations; N(q) proportional to q^2 at small q diagnoses a charge gap."
structure_factor_diagnostics_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:275; Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:289-293"
transition_class = "The Mott-Peierls transition is expected to be Kosterlitz-Thouless, with an exponentially small Peierls spin gap near the transition."
transition_class_provenance = "Literal 2407.03046_insulating-and-metallic-phases-in-the-one-dimensional-hubbar.md:251"

