[method]
paper_route = "MPS-family time-dependent DMRG (t-DMRG) for the longitudinal DSF, with one-site DMRG ground-state preparation, first-order Trotterized real-time evolution, Fourier transformation, and a single-mode approximation for magnon/domain-wall/spinon dispersions and continua."
paper_route_provenance = "Literal 2501.13059_bound-states-and-deconfined-spinons-in-the-dynamical-structu.md:65; 79-99; 137-179; 183-189"
valid_alternatives = ["MPS + TDVP time evolution", "MPS + higher-order TEBD/Trotter evolution", "Krylov/Lanczos time evolution in an MPS representation", "exact diagonalization for reduced-size targets", "variational/quasiparticle ansatz for the transition-point dispersion"]
valid_alternatives_provenance = "Inferred from the target observables and the paper's stated MPS/t-DMRG/SMA decision chain; the rendered paper does not enumerate alternatives."

[method_params]
ground_state = "N = 200 primary chain; MPS bond dimension 250; one-site DMRG; variance per site 1e-8 for J2/J1 < 0.6, relaxed to 1e-5 or less at larger J2."
ground_state_provenance = "Literal 2501.13059_bound-states-and-deconfined-spinons-in-the-dynamical-structu.md:83"
time_evolution = "First-order Trotter gates with dt = 0.02/J1 for J2/J1 < 0.8 and dt = 0.01/J1 for larger J2; target bond dimension 250."
time_evolution_provenance = "Literal 2501.13059_bound-states-and-deconfined-spinons-in-the-dynamical-structu.md:85"
finite_time = "Evolution stops before correlations reach the open-chain boundaries; final time depends on J2 and is approximately N/(2v)."
finite_time_provenance = "Literal 2501.13059_bound-states-and-deconfined-spinons-in-the-dynamical-structu.md:87-93; 595-597"
postprocessing = "Continuous momenta from open boundaries; Gaussian convolution of time correlations with sigma = 0.276 tf to suppress ringing; numerical SMA fits use up to four cosine terms for the fitted spinon dispersion."
postprocessing_provenance = "Literal 2501.13059_bound-states-and-deconfined-spinons-in-the-dynamical-structu.md:93; 265-275"
valid_alternatives = ["larger bond dimension", "two-site or variational ground-state optimization", "smaller Trotter step or higher-order integrator", "different controlled window/filter with resolution tracked", "direct spectral/continued-fraction evaluation"]
valid_alternatives_provenance = "Inferred from the numerical convergence knobs and criteria stated in the rendered paper."

