[candidate_notes]
model = "spin-1 J1-J2 Heisenberg chain near the first-order transition at J2 ~= 0.76 J1; time-dependent DMRG for S(q,omega)"
headline = "S(q,omega): spinon confinement into bound states evolving into magnon modes, incommensurate dispersion; single-mode-approximation + confinement picture"
compute = "spin-1 chain, short-ranged correlations keep chi modest; tDMRG + FT, a few hours on laptop"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "Spin-1 antiferromagnetic J1-J2 chain with H = J1 sum_i S_i · S_{i+1} + J2 sum_i S_i · S_{i+2}."
