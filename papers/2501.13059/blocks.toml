text = "FIG. 9: (a - e) DSF of the _J_ 1 _− J_ 2 spin-1 chain about the phase transition point. Section cuts of the DSF with (f) _J_ 2 _≤_ 0 _._ 75 _J_ 1, and (g) _J_ 2 _≥_ 0 _._ 76 _J_ 1 at _k_ = _π_ . The lower energy boundary of the two-spinon continuum at _J_ 2 = 0 _._ 76 _J_ 1 is indicated by dashed line. One notes that the number of separate modes lying outside of the continua increases before and after the transition. These are magnon excitations on the domains constituting the groundstate at the phase transitions. Similarly, we show the section-cuts of the DSF with (h) _J_ 2 _≤_ 0 _._ 75 _J_ 1, and (i) _J_ 2 _≥_ 0 _._ 76 _J_ 1 at _k_ = _k_ min, where _k_ min is the wavevector corresponding to the global minimum of the continua. It shows multiple modes beyond the main peak, which are interpreted to be bound states of the spinons. They arise due to the confinement potential two spinons experience, because slightly away from the transition point one of the competing groundstates has lower energy-density than the other. Therefore, spreading the domain walls costs energy and thus the continua then proliferates into bound states of the spinons. However, the energy levels of these states are so close to each other that it becomes very difficult to resolve the two states in the numerical DSF, except for the low-lying bound states of spinons where the difference is larger. "

[[blocks]]
sections = ["truth", "method"]
lines = "377"
text = "domain walls and can be visualized as a confining potential (i.e. _V_ ( _x_ ) _∝_ (( _J_ 2 _− J_ 2 _,t_ ) _/J_ 1) _x_ , where _J_ 2 _,t_ is the phase transition point) for the otherwise free spinons. The competition between the lowering of kinetic energy due to the propagation of spinons and the energy cost due to the effective confining potential results in two-spinon bound states. Note that we could only unambiguously resolve the lowest one. It could be that with a better resolution it might be possible to identify other bound states. However, since the two-spinon continuum is also expected to have a minimum at _k_ = 0 in addition to that visible in the DSF at _k_ = 0 _._ 6129 _π_ , the higher bound states might overlap with the continuum built by pairs of low-energy bound states with wave-vectors close to _k_ = 0 and _k_ = 0 _._ 6129 _π_ respectively, turning the higher-energy bound states into resonances. "

