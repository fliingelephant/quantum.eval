text = "ing from the mathematical form of the SMA dispersion on the VBS state, one can modify the coefficients such that the resulting spinon dispersion accurately covers the low energy features of the continua in the DSF. Since the quasi-particle ansatz determines the lowest excitation accurately, one can compare the position of the minimum and the slope of the dispersion with respect to the wavevector _k_ with the SMA’s analytical form given by "

