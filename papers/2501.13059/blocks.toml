text = "single magnon mode, which is the lowest-lying excitation."

[[blocks]]
sections = ["method", "truth"]
lines = "189"
chars = "1-73"
text = "dispersion of the magnon one can create the continua of multiple magnons."

[[blocks]]
sections = ["method", "truth"]
lines = "191"
text = "At _J_ 2 = 0, one finds a well-defined gapped magnon mode. The dispersion of the mode is also correctly described by SMA; however, at _k ≈_ 0 _._ 33 _π_ , the mode enters the two-magnon continuum [24]. Therefore, although the SMA gives a description of the mode beyond the entry point into the continuum, this cannot be trusted: The excitation exists as a well-defined mode for a range of wave-vectors _k_ , and it gives rise to the non-interacting continuum of two or three magnons. In this way, one has a consistent description of the full spectra found in the DSF. "

[[blocks]]
sections = ["truth"]
