[[blocks]]
sections = ["method", "truth"]
lines = "225"
text = "FIG. 5: Multi-magnon continua on top of DSF. The single magnon mode is shown with dark-blue dots. The two-magnon continuum obtained by taking two individual single magnons is shown in green. Similarly a three-magnon continuum is created from the single magnon mode and is shown in red. The multi-magnon continua can be generated from the single magnon (described in the main text). For _J_ 2 _<_ 0 _._ 5 _J_ 1, one finds good agreement between the SMA dispersion computed on the groundstate obtained from DMRG, and the magnon dispersion obtained from the AKLT state at low energies. This indicates that the AKLT state is a good approximation to the groundstate of the spin-1 chain for small values of _J_ 2. "

[[blocks]]
