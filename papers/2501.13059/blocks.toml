[[blocks]]
sections = ["method"]
lines = "559"
text = "Generating a state encoding a single domain wall between the AKLT and the NNN AKLT state at the _j_ - th site involves constructing the AKLT state up to _j_ -th site and then continuing the construction with the NNN AKLT state from _j_ +1- th site until the end of the chain. This generates the spinon-state shown in the Fig.7b in the main text. It leaves one spin-1 _/_ 2 degree of freedom at the _j_ -th site free. "

