lines = "275"
text = "A minimum of four cosine terms is needed to obtain a good fit with the low-lying energy dispersion from the quasi-particle ansatz. There is a further constraint on the amplitude of the spinon dispersion such that the lower bound of the resulting continuum lies on the plausible location of the continua in the DSF. We extracted this amplitude directly from the DSF for _J_ 2 = 0 _._ 76 _J_ 1 by generating the two-spinon continuum for a range of amplitudes and comparing its lower bound with the inflection point just below the highest spectral peak at _k_ = _π_ (the method is described in detail in Appendix D). The upper bound of the two-spinon continuum comes out to be just below _ω ∼_ 5 _J_ 1 by which _∼_ 99 _._ 5% of the spectral weight of the DSF has been exhausted. Thus, with this determination of the spinon dispersion, the continuum spans almost the full range of the DSF. The plot of the resulting spinon dispersion is compared with other determinations discussed earlier in Fig. 7(c). The two-spinon continuum generated from the newly fitted spinon dispersion compares very well with the DSF for _J_ 2 = 0 _._ 76 _J_ 1(see Fig. 7f). "

