[[blocks]]
sections = ["method"]
lines = "171"
text = "In the _J_ 1 _− J_ 2 spin-1 chain, there are two possibilities to obtain a single mode dispersion from an excitation on the groundstate: "

[[blocks]]
sections = ["method"]
lines = "173"
text = "1. _A local on-site or on-bond excitation_ : One can generate a well-defined momentum state by applying _S−[z] k_[on][the][ground][state.][The][ground][state][of] the spin-1 Hamiltonian can be best pictured as an AKLT or NNN AKLT type VBS state when _J_ 2 is small or large, respectively. It is readily verified that the magnon dispersion is obtained by exciting one of the singlet bonds to a triplet bond (see Fig.3). The traveling bond-flip state with a welldefined momentum describes the magnon mode. The application of _S−[z] k_[on the VBS state generates] a linear combination of the triplet bonds [19, 30]. Therefore, the single spin operator with a given momentum can also determine the magnon dispersion. We have used the groundstate obtained from "

[[blocks]]
sections = ["method"]
lines = "177"
text = "DMRG and acted the _S−[z] k_[operator][to][describe][an] approximate magnon state. The energy of such a mode is computed directly by taking the expectation value of the Hamiltonian. "

[[blocks]]
sections = ["method", "truth"]
lines = "179"
text = "2. _A local domain-wall excitation_ : Consider the real space configuration of a wavefunction such that one part is described by the AKLT state while the other is described by the NNN AKLT state. The domain wall, separating these two parts, is an excitation which can disperse in the chain. In order to generate such an excitation, a non-local operator needs to be applied to the state. Determining the expression for such an operator is difficult, so we directly generate these states. The single domain wall excitation is prohibitively expensive in energy if _J_ 2 is deep in the Haldane or NNN Haldane phase as it would require part of the wavefunction given by the other phase’s groundstate but it is the lowest excited state at the phase transition point in the spin1 chain since the two types of VBS states have equal energies at that point (see Fig.7 b). If two such domain walls are placed adjacent to each other, one recovers the triplet-bond picture describing a magnon in the previous scenario. Therefore, these domain walls are fractionalized quasi-particles and will be referred to as spinons because they carry half the spin of the magnon, quite similar to the domain walls in spin-1/2 chains being referred to as spinons. The SMA study of the spinons will turn out to be instructive in understanding the spectrum close to the phase transition. "

[[blocks]]
sections = ["truth"]
lines = "183"
chars = "580-656"
text = "many features can be interpreted as magnons, spinons, or composite particles."

[[blocks]]
sections = ["truth"]
