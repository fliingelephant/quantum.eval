text = "## **Appendix B: Encoding the domain wall state as a MPS** "

[[blocks]]
sections = ["method"]
lines = "515"
text = "We revisit the procedure to encode an AKLT and NNN AKLT state as a MPS and describe the way to construct a domain wall state as a MPS [19, 22]. The spin-1 degrees of freedom at each site can be seen to be a symmetric combination of two spin-1 _/_ 2 states - _| ↑⟩_ and _| ↓⟩_ . The symmetrized combination of two spin-1 _/_ 2s leads to three triplet states with total magnetization 1 _,_ 0 _, −_ 1 at each site _P_ ˆ _T_ onandthethereforefull chainoneto canbe define a projection operator "

