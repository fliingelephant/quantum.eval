lines = "211"
text = "rated from the continuum in this momentum range. A similar observation can be made at _k_ = _π_ , where an increasing number of bound states of magnons separate out from the three-magnon continuum as _J_ 2 increases. "

[[blocks]]
sections = ["method", "truth"]
lines = "213"
text = "2. _Modes lying outside of continua generated from the lowest energy mode_ : The SMA tracks the dispersion of the magnon and, therefore, is unable to track the lowest-energy mode when its nature changes in the range 0 _≤ k ≤ k_ 0. We track the mode by following the maxima of the spectral peak in the DSF at the lowest energy and construct the multi-mode continua out of it. In Fig. 5(g-j), the continua are plotted on top of the DSF and as _J_ 2 is varied in the range 0 _._ 35 _≤ J_ 2 _/J_ 1 _≤_ 0 _._ 6, one sees a clear separation of the second lowest energy mode at _k_ = _π_ from the multi-mode continua. It is interpreted as a three-magnon bound state. We track the mode for different _J_ 2 values by plotting the section cuts of their corresponding DSF at _k_ = _π_ (see Fig. 6 b, c, d). The spectral peak corresponding to the lowest energy bound state mode is lower in energy than the lower bound of the multi-magnon continua. Since the other apparent higher-energy bound states of magnons lie within the multi-mode continua, these can be interpreted to be resonances in the DSF. In the same spirit, for small values of _k_ i.e. in the range of momenta 0 _< k < k_ 0, the DSF plots for _J_ 2 = 0 _._ 5 _J_ 1 _,_ 0 _._ 6 _J_ 1 ( Fig. 5 i,j) show another three-magnon bound state mode which pops out of the continua. Both bound states gain in binding energy as _J_ 2 increases. Note that for _J_ 2 = 0 _._ 6 _J_ 1, the lowest bound state for small _k_ has lost so much intensity that it is not possible any more to follow it down to _k_ = 0. As a consequence, we could not include it when plotting the multi- "

[[blocks]]
sections = ["truth"]
lines = "215"
text = "mode continuum, resulting in a smaller continuum close to _k_ = _π_ (see Fig.5j) than anticipated from the continua at smaller values of _J_ 2 (see Fig.5h,i). But this is an artefact because the mode still exists, and the intensity close to _k_ = _π_ above the main magnon branch and the lowest bound state (which nearly merges with the main magnon branch at _k_ = _π_ ) must be part of a continuum, as for _J_ 2 _/J_ 1 = 0 _._ 43 and 0 _._ 5. "

