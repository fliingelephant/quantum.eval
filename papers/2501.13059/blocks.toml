lines = "71"
text = "## **A. Time-dependent DMRG** "

[[blocks]]
sections = ["problem"]
lines = "76"
text = "![](.figures/arxiv__2501.13059/2501.13059.pdf-0002-06.png)"

[[blocks]]
sections = ["method"]
lines = "83"
chars = "269-272"
text = "DMRG"

[[blocks]]
sections = ["method", "method_params"]
lines = "83"
chars = "445-631"
text = "kept bond dimension of 250 states in the matrixproduct-states (MPS)-ansatz and sweeped through the system with one-site DMRG till the simulation reached a variance per site of 10 _[−]_[8]"

[[blocks]]
sections = ["method_params"]
lines = "83"
chars = "635-884"
text = "This variance was achieved in spin-1 chains for _J_ 2 _<_ 0 _._ 6 _J_ 1 but it became increasingly tough to converge with the variance for larger values of _J_ 2. Therefore, we relaxed the convergence criterion for variance to be 10 _[−]_[5] or less."

[[blocks]]
sections = ["method", "method_params"]
lines = "85"
text = "The time evolution of the state resulting from applying the spin-operator onto the ground state is then carried out by the t-DMRG method [23, 24]. The time evolution operator _U_ ( _t_ ) = exp( _−itH_ ) is exponential in dimension owing to the exponentially large Hilbert space of the Hamiltonian. The method proceeds by generating a set of Trotterized evolution gates. These gates evolve the system by a small time-step size when applied to a state. For the simulation results obtained on the _J_ 1 _− J_ 2 spin-1 chain, we employed first-order Trotter gates with very small time steps of 0 _._ 02 _/J_ 1 for values of _J_ 2 less than 0 _._ 8 _J_ 1. For larger _J_ 2 couplings, we used a smaller timestep of 0 _._ 01 _/J_ 1. The application of individual gates to the adjacent MPS increases the bond dimension which is then truncated to a target bond dimension so that one does not end up storing an exponential number of states. We fixed the target bond dimension during time evolution to be same as that used for the ground state, namely 250 states. "

[[blocks]]
sections = ["method", "method_params"]
lines = "87"
text = "Applying a local spin operator to the center of the chain leads to a state which is a superposition of some allowed excited eigenstates of the system. The timeevolution of the system effectively propagates this localized perturbation across the chain. Propagating the localized perturbation results in increasing the number of allowed states in the MPS-ansatz. A linear growth of entanglement entropy leads to exponentially large MPSs, which is taken care of by truncating the evolved MPS to the target bond dimension. The propagation of the perturbations in the chain also allows the spin-spin correlations to spread in the chain. While simulating on a finite chain, one should take care of not letting the correlations reach the boundaries of the chain. In order to avoid the artefacts from the boundaries influencing the correlation function, we performed the time evolution of the state until the time at which the correlations reached the lattice boundaries. We note that the velocity associated with the spread of correlations depends upon the "

[[blocks]]
sections = ["method_params"]
lines = "91"
chars = "83-182"
text = "evolve the system up to a final time that depends on the value of _J_ 2 (see Fig.12 in the appendix)"

[[blocks]]
sections = ["problem", "method"]
lines = "93"
chars = "159-241"
text = "groundstate and time-evolution calculations were done with open boundary conditions"

[[blocks]]
sections = ["method_params"]
lines = "93"
chars = "740-803"
text = "variance ( _σ_ ) to be 0 _._ 276 _tf_ in the current simulations"

[[blocks]]
sections = ["problem"]
lines = "96"
text = "![](.figures/arxiv__2501.13059/2501.13059.pdf-0003-03.png)"

[[blocks]]
sections = ["method", "truth", "method_params"]
lines = "99"
text = "where _N_ is the length of the chain and _ωα_ ( _k_ ) is the change in energy from the ground state _|ψ_ 0 _⟩_ to the final state _|ψα⟩_ . As the ground state is in the total spin-0 sector, the spin operator _S[z]_ only connects to excitations in the spin-sector with total spin 0 or 1. Thus, the spectral gap seen in the DSF is due to the excitation in the spin-1 sector. The gap can be exactly calculated using DMRG since the first excited state is the lowest energy state of the _S_ = 1 sector and therefore one can simply find the groundstate after screening the edge states from running the DMRG code only in this symmetry sector. We compare the spectral gap in the DSF with the DMRG determined gap taken from Refs [15, 19, 25] in Table I. We measured the spectral gap in the DSF to be the lowest energy spectral peak observed in the DSF. This was carried out on finite chains with varying lengths for selected _J_ 2 values and we obtain a nearly size independent gap (see Fig. 1 a). As _J_ 2 is tuned closer to the phase transition point, the correlation length increases and the spectral gap becomes too small to be accurately determined from the DSF data for finite chains. The Gaussian filter on the closely spaced excitation levels observed in the DSF, near the transition point, results in an overestimation of the spectral gap. We highlight the dependence of the spectral gap on _J_ 2 by plotting the spectral gap for a fixed-length chain against the gap in excitations determined by Kolezhuk _et.al._ [15] in Fig. 1 b. Apart from the immediate vicinity of the transition point, where our gap is larger than that of Ref. [15] due to finite size effects, the agreement is excellent. Note that the actual gap at the transition is even much smaller than that of Ref. [15] , as demonstrated by the spinon calculation of Ref.[18] (see discussion below). "

