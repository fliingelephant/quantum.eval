text = "Moreover, if we denote by _k_ min the wave-vector of the global minimum of the spinon dispersion, then one finds that the other local minima of spinon dispersion are located at (2 _n_ + 1) _k_ min where, _n_ is an integer. Similarly, the local minima energies lie above _ω ≈_ (2 _n_ +1)∆, where ∆is the spinon energy gap. Now, since the quasi-particle ansatz picks the lowest lying energy state for each momentum value in the spin-1/2 sector of the excitation spectrum, it captures the minima of (2 _n_ +1) spinon continua which lie in the total spin-1/2 sector (see Fig. 7 c). So, the curve for the spinon dispersion extracted from "

[[blocks]]
