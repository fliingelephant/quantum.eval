lines = "581"
text = "The spread of the spin-spin correlations with time follows a cone-like structure, and one can extract the velocity of the correlation spread wave-front by tracking the maximum of the spin-spin correlation function at a given "

[[blocks]]
sections = ["truth", "method_params"]
