[[blocks]]
sections = ["method"]
lines = "137"
text = "## **B. Single-Mode-Approximation** "

[[blocks]]
sections = ["method"]
lines = "139"
text = "The single mode approximation is used to find the dispersion of a localized excitation of the system [26–28]. The action of a single spin operator on the groundstate describes an excited state, and the energy expectation value of such a state gives the first magnetic moment of the system. Thus, the dispersion of a magnon mode is readily found by taking the expectation value of the energy of an excited state generated from the action of a single spin operator with well-defined momentum on the groundstate of the system. It is a useful tool to analyse the low-lying excitations of a Hamiltonian. An early successful use of the SMA in spin models was to describe the magnon dispersion in the AKLT model [14, 29]. Since the ground state obtained from the DMRG algorithm is very accurate and can be concisely described as an MPS, one can simply extend the SMA formalism to the MPS and obtain the dispersion relation of the magnon modes. "

