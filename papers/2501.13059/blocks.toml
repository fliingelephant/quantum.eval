text = "It demonstrates that a single mode is separated from the lower bound of the continuum, with a line-width that is only limited by the frequency resolution of the DSF."

[[blocks]]
sections = ["method", "truth"]
lines = "197"
text = "1. _Modes lying outside of multi-magnon continua_ : In Fig.5 (a-f), we plot the non-interacting _n_ - magnon continua on top of the computed DSF (n = 2 is shown in green and n = 3 is shown in red). It covers the full energy range of the observable spectral weights in the DSF. The modes which lie outside of the multi-magnon continua are the bound states of magnons. In general, a _n_ -magnon boundstate at wave-vector _K_ = �� _j[k][j]_ � mod 2 _π_ has an energy � _nj_ =1 _[ω][j]_[(] _[k][j]_[) +] _[ E][b]_[,][where] _[E][b]_[is][the][binding][energy] and is negative. We clearly demonstrate that the mode 0 _< k < k_ 0 is a bound state of two magnons and its binding energy increases with increasing _J_ 2. At _J_ 2 = 0 _._ 6 _J_ 1, one finds a second bound state sepa- "

