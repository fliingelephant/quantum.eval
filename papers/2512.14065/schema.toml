[method]
family = "Exact diagonalization (ED) over symmetry-resolved spin-1 blocks, with a bi-Lanczos Krylov reduction for dynamical diagnostics."
family_provenance = "Inferred from the complete eigenvalue/eigenvector spectra and stated Hilbert-space dimensions in Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:227-227, together with the explicit bi-Lanczos construction in Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:229-279"
algorithm = "Bi-Lanczos recursion constructs biorthogonal right/left Krylov bases and a tridiagonal effective Hamiltonian; the paper uses the resulting C_K(t) for Hermitian and non-Hermitian dynamics."
algorithm_provenance = "Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:229-279; Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:583-689"
valid_alternatives = ["dense ED", "sparse ED with Lanczos or Arnoldi", "Krylov time evolution"]
valid_alternatives_provenance = "Inferred from the ED targets and the method family; the paper’s stated route is Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:229-279"

[method_params]
