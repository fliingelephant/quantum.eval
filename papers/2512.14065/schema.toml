# Searcher notes; superseded by [problem]/[truth] sections after paper-to-schemas.
[candidate_notes]
model = "1D spin-1 chain with tunable long-range hopping (Hermitian core; non-Hermitian variant); full/sparse ED, level statistics, Krylov complexity, time evolution"
headline = "integrability->chaos crossover: <r> from Poisson (~0.386) to GOE (~0.530), while an exact scar tower survives with coherent revivals; analytic tower construction"
compute = "dim 3^L, L~10-14 (<=4.8e6): laptop ED. Core reproducible target = Hermitian Poisson->GOE + scar revivals"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "One-dimensional periodic spin-1 chain with H = J_h H_h + J_c H_c + J_z H_z + Σ_n J_n H_n: nearest-neighbor Heisenberg exchange, chiral three-spin coupling, Zeeman field, and antisymmetric long-range spin exchange."
model_provenance = "Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:55-61; Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:91-119"
convention = "Spin-1 local basis m_j ∈ {+1, 0, −1}; periodic boundary conditions; real couplings define the Hermitian limit and complex J_c/J_n define the non-Hermitian cases."
convention_provenance = "Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:67-85; Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:113-119; Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:195-195; Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:417-419"
instance = "Calculations use PBC, a single long-range distance n = 3 for the main numerical analysis, and the symmetry-resolved (M, k) = (0, 0) sector unless a caption gives a full Hilbert space (N = 8) or a different diagnostic size."
instance_provenance = "Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:175-175; Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:187-189; Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:227-227; Literal 2512.14065_integrability-breaking-and-coherent-dynamics-in-hermitian-an.md:293-305"
symmetry = "Total magnetization M and crystal momentum k are conserved; the numerical spectral diagnostics are taken in (M, k) = (0, 0)."
