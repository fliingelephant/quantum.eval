[[blocks]]
sections = ["anchors"]
lines = "163"
chars = "1-759"
text = "Because _Hh_ and _Hc_ are rotational scalars, they commute with _S[−]_ and thus act invariantly on the entire tower, yielding _Hh |ψ_ ( _N, N − p_ ) _⟩_ = _N |ψ_ ( _N, N − p_ ) _⟩_ and _Hc |ψ_ ( _N, N − p_ ) _⟩_ = 0 for all _p_ . The Zeeman term acts as _Hz |ψ_ ( _N, N − p_ ) _⟩_ = ( _N − p_ ) _|ψ_ ( _N, N − p_ ) _⟩_ , which follows from [ _S[z] ,_ ( _S[−]_ ) _[p]_ ] = _−p_ ( _S[−]_ ) _[p]_ . Finally, the nonlocal term _Hn_ annihilates every state in the tower, _Hn |ψ_ ( _N, N − p_ ) _⟩_ = 0. This arises because _|ψ_ ( _N, N − p_ ) _⟩_ is the _k_ = 0 (totally symmetric) _p_ -magnon state, and the antisymmetric structure of the _Hn_ operator [Eq. (11)] results in a vanishing eigenvalue for this uniform superposition (see Appendix A for more details)."

[[blocks]]
