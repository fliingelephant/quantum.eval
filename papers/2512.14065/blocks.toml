text = "We will often parametrize a sector by the number of spinlowering operations _p_ relative to the fully polarized state (see below), so that _M_ = _N − p_ , where _p_ = 0 _,_ 1 _,_ 2 _, ...,_ 2 _N_ . (ii) Lattice translation symmetry: Assuming uniform couplings and PBC, the Hamiltonian is invariant under the one-site translation operator _T_ . Hence, crystal momentum _k_ is a good quantum number, and each sector _HM_ further splits into _HM_ =[�] _k[H][M,k]_[,][where] _[T][|][ψ][M,k][⟩]_[=] _[e][ik][ |][ψ][M,k][⟩]_[.][(iii)] Global SU(2) symmetry: The Heisenberg term _Hh_ and the chiral term _Hc_ are rotational scalars, satisfying [ **S**[2] _, Hh/c_ ] = 0 and [ _S[α] , Hh/c_ ] = 0 ( _α_ = _x, y_ ) [15, 51]. However, the subgroup generated by _S[z]_ an term _Hz_ and the nonlocal term _Hn_ break the full SU(2) symmetry down to the _U_ (1) . Consequently, the total spin **S**[2] is not a conserved quantity for the generic Hamiltonian."

