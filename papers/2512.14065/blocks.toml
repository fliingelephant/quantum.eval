[[blocks]]
sections = ["anchors"]
lines = "171"
chars = "1-246"
text = "This tower of exact states spans all magnetization sectors _M_ = _N − p_ , featuring an energy spectrum that varies linearly with _M_ . Remarkably, these states remain robust even in the presence of the non-integrable interactions _Hc_ and _Hn_ ."

[[blocks]]
sections = ["anchors"]
lines = "173"
chars = "1-831"
text = "Here two points should be highlighted: 1. The crucial property that makes the states Eq. (16) exactly solvable is that they are the totally symmetric (zero-momentum) multiplet generated from the highest-weight state _|⇑⟩_ . Any Hamiltonian that (i) acts as a scalar on this multiplet (e.g. SU(2)-invariant twoand three-spin scalar operators) and (ii) annihilates the uniform magnon superposition (as _Hn_ does in the antisymmetric form above) will preserve the tower. 2. If one perturbs the model by terms that break translation invariance (disorder) or introduce momentum-dependent hopping that does not annihilate the _k_ = 0 magnon, the tower generically hybridizes with other states and ceases to be exact; nevertheless, for sufficiently weak perturbations the tower may survive as long-lived scarred eigenstates (quasi-exact)."

