lines = "581"
chars = "1-286"
text = "Therefore, the tower states _|ψ_ ( _N, N − p_ ) _⟩_ are eigenstates of _Hn_ with eigenvalue zero. Combined with their trivial eigenstate property under _Hh_ , _Hc_ , and _Hz_ , this completes the proof that all _|ψ_ ( _N, N − p_ ) _⟩_ are exact eigenstates of the full Hamiltonian _H_ ."

[[blocks]]
sections = ["method"]
lines = "583"
chars = "18-63"
text = "Bi-Lanczos Algorithm for Non-Hermitian Systems"

[[blocks]]
sections = ["method"]
lines = "585"
chars = "1-369"
text = "In order to analyze the Krylov complexity in non-Hermitian quantum systems, we employ the bi-Lanczos algorithm, which generalizes the conventional Lanczos recursion to handle non-Hermitian Hamiltonians. The method constructs two biorthogonal Krylov bases, _{|pn⟩}_ and _{|qn⟩}_ , corresponding to the right and left subspaces of the Liouvillian or Hamiltonian operator."

[[blocks]]
sections = ["method"]
lines = "589"
chars = "1-137"
text = "We start from an arbitrary normalized initial state _|ψ_ 0 _⟩_ , and define the initial vectors of the right and left Krylov subspaces as"

[[blocks]]
sections = ["method"]
lines = "592"
text = "![](.figures/arxiv__2512.14065/2512.14065.pdf-0011-33.png)"

[[blocks]]
sections = ["method"]
lines = "595"
chars = "1-55"
text = "with the normalization condition _⟨q_ 0 _|p_ 0 _⟩_ = 1."

[[blocks]]
sections = ["method"]
lines = "597"
chars = "1-119"
text = "At each recursion step _n_ , we apply both the Hamiltonian _H_ and its Hermitian conjugate _H[†]_ to the basis vectors:"

[[blocks]]
sections = ["method"]
lines = "600"
text = "![](.figures/arxiv__2512.14065/2512.14065.pdf-0011-36.png)"

[[blocks]]
sections = ["method"]
lines = "603"
chars = "1-65"
text = "To enforce biorthogonality, we define the Lanczos coefficients as"

[[blocks]]
sections = ["method"]
lines = "606"
text = "![](.figures/arxiv__2512.14065/2512.14065.pdf-0011-38.png)"

[[blocks]]
sections = ["method"]
lines = "611"
chars = "1-64"
text = "and remove the components along the previous two Krylov vectors,"

[[blocks]]
sections = ["method"]
lines = "614"
text = "![](.figures/arxiv__2512.14065/2512.14065.pdf-0012-02.png)"

[[blocks]]
sections = ["method"]
lines = "618"
text = "![](.figures/arxiv__2512.14065/2512.14065.pdf-0012-03.png)"

[[blocks]]
sections = ["method"]
lines = "621"
chars = "1-109"
text = "where _bn_ and _cn_ are the normalization coefficients ensuring that _⟨qn_ +1 _|pn_ +1 _⟩_ = 1. Specifically,"

[[blocks]]
sections = ["method"]
lines = "624"
text = "![](.figures/arxiv__2512.14065/2512.14065.pdf-0012-05.png)"

[[blocks]]
sections = ["method"]
lines = "627"
chars = "1-34"
text = "The vectors are then normalized as"

[[blocks]]
sections = ["method"]
lines = "630"
text = "![](.figures/arxiv__2512.14065/2512.14065.pdf-0012-07.png)"

[[blocks]]
sections = ["method"]
lines = "633"
chars = "1-243"
text = "In practice, due to the non-unitary evolution in nonHermitian systems, small numerical errors can accumulate, breaking the biorthogonality condition. To mitigate this, a reorthogonalization procedure is performed after each iteration, ensuring"

[[blocks]]
sections = ["method"]
lines = "636"
text = "![](.figures/arxiv__2512.14065/2512.14065.pdf-0012-09.png)"

[[blocks]]
sections = ["method"]
lines = "641"
chars = "1-125"
text = "The bi-Lanczos recursion leads to a tridiagonal effective representation of the Hamiltonian in the biorthogonal Krylov basis:"

[[blocks]]
sections = ["method"]
lines = "644"
text = "![](.figures/arxiv__2512.14065/2512.14065.pdf-0012-12.png)"

[[blocks]]
sections = ["method"]
lines = "663"
