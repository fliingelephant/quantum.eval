valid_alternatives = "Other tensor-network renormalization routes, including standard TNR, LoopTNR, and TNR+; thermodynamic/transition targets can also be approached by Monte Carlo methods, while the conformal-data targets require a valid transfer-matrix or equivalent finite-size-spectrum route."
