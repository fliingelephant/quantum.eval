model = "AFM 6-state clock model on the Union-Jack lattice; TRG (nuclear-norm-regularized) contraction of the classical partition function"
headline = "phase diagram: BKT + Z6-breaking + chiral transitions; central charge, scaling dimensions, OPE coefficients vs compactified-boson / Ising CFT"
compute = "classical clock TRG at modest bond dimension, laptop. CAVEAT: method-forward framing (regularized TRG showcased) -- judged physics-leaning, decide at extraction"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "Two-dimensional antiferromagnetic 6-state clock model on the Union Jack lattice, with H = J sum_<i,j> cos(theta_i - theta_j)."
model_provenance = "Literal 2403.17309_tensor-network-renormalization-approach-to-antiferromagnetic.md:55-61"
convention = "theta_i = 2 pi n_i / 6 with n_i in {0,1,...,5}; beta = 1/T; the coupling is antiferromagnetic and the reduced Hamiltonian uses J as the energy scale."
convention_provenance = "Literal 2403.17309_tensor-network-renormalization-approach-to-antiferromagnetic.md:58-61,89-95"
instance = "2D Union Jack lattice with triangular subplaquettes, original and Kramers-Wannier dual representations, sublattices A_8 and B_4, and periodic-boundary expectation values. No finite lattice size or filling/sector is reported."
instance_provenance = "Literal 2403.17309_tensor-network-renormalization-approach-to-antiferromagnetic.md:121,141-169,173,477"
symmetry_and_phases = "The clock model has six discrete spin states and a frustrated 12-fold ground-state degeneracy; the dual variables live on the dual lattice and exchange the phase labels shown in Fig. 1."
symmetry_and_phases_provenance = "Literal 2403.17309_tensor-network-renormalization-approach-to-antiferromagnetic.md:61,73,141-169"
reported_temperature_axis = "The plotted temperature axis is approximately T/J = 0.35 to 0.75 in Fig. 4; the reported transition points are T_c1, T_c2, T_c3 and the self-dual point T_sd."
reported_temperature_axis_provenance = "Literal 2403.17309_tensor-network-renormalization-approach-to-antiferromagnetic.md:250,267,309"
non_target_numerical_intermediates = "Internal energies E_A8 and E_B4 are measured as intermediates for the specific heat, but no paper-stated value at a gradeable instance is given, so they are not separate targets."
non_target_numerical_intermediates_provenance = "Literal 2403.17309_tensor-network-renormalization-approach-to-antiferromagnetic.md:175-181; Inferred from the absence of a stated E value or E panel in the rendered paper"

