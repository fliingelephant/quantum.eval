[method]
paper_route = "The numerical route is sparse exact diagonalization within particle-number sectors, numerical basis enumeration/root identification for fragment connectivity, transfer-matrix enumeration for fragment and frozen-state counts, and dynamical quantum typicality for PBC infinite-temperature transport; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:89-91, 121-157, 177-199, 535-557."
algorithm = "Root representatives are found by successive local substitutions to the most dilute binary string; ED then resolves spectra and time dynamics, while QDT replaces a trace by evolution of a random typical state; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:95-103, 121-147, 549-555."
valid_alternatives = "Valid alternatives are any exact-diagonalization implementation for static sectors and OBC dynamics, any transfer-matrix implementation for the combinatorial counts, and any random-state typicality implementation for the PBC transport correlator; Inferred from the route descriptions at Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:177-199 and 549-555."

[method_params]
reported = "No convergence cutoff, Krylov dimension, time-step, or number of random typical states is reported. The method-specific transfer matrices are 8 × 8 for q = 2 and 16 × 16 for q = 3; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:177-181 and 707-731."
transfer_matrix_sizes = "q = 2: 8 × 8; q = 3: 16 × 16; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:179-181 and 745-799."

[software]
named = "No software package, programming language, or code repository is named in the paper; the valid tool set is therefore implementation-agnostic ED, transfer-matrix, and QDT software. Inferred from the absence of a named package in the rendered paper and the explicit method descriptions at Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:177-199 and 535-557."

[software_params]
reported = "No solver tolerance, threading setting, API toggle, or named software parameter is reported. The only implementation-level perturbation is a small diagonal disorder w = 0.01 used in the level-spacing plots to remove accidental degeneracies while preserving fragmentation; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:970-994."
diagonal_disorder = "w = 0.01 for the level-spacing analysis; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:994-994."

[anchors]
hamiltonian = "The displayed range-q Hamiltonian and kinetic-projector construction are the model definition/cross-check; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:69-87."
tight_binding_dispersion = "For the simple integrable fragments, E_p = -2 cos(πp/(N_A+2)); Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:207-223."
catalan_triangle = "The Catalan-triangle count C_1(n,k) and its recursion/formula are given in Appendix D; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:803-821."
frey_sellers = "The Frey-Sellers recurrence and closed form are the analytic counting cross-check for the FS root class; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:823-865."
transport_definitions = "The definitions of C̃(r,t), its scaling form, and the QDT estimator are displayed in Eqs. (21)-(23); Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:537-555."

