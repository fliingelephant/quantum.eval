[candidate_notes]
model = "1D spinless-fermion chains with East-constrained (facilitated) hopping of range q; symmetry-resolved sparse ED in the fragmented space + transfer-matrix enumeration"
headline = "freezing (strong->weak fragmentation) transition at critical filling n_c = 1/(q+1); anomalous transport subdiffusive->superdiffusive; generalized-Catalan / transfer-matrix analytic backbone"
compute = "constrained space << 2^L: L~24-30 (dims 1e5-1e6), sparse ED minutes-to-hours on laptop"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "One-dimensional spinless-fermion quantum East models with particle-number-conserving facilitated hoppings of range q; the range-q Hamiltonian and kinetic projectors are given in Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:67-87."
convention = "Fermion occupation n_j is the binary basis convention; the model conserves total particle number, breaks inversion symmetry, has a sublattice symmetry sending H to -H, and uses t_l = 1 unless explicitly varied; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:81-87."
instance = "The numerics use particle-number sectors N_f on chains of length L, with OBC for fragmentation, ground-state, and autocorrelator studies and PBC for transport; q = 1, 2, 3 are treated numerically and q is treated analytically; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:177-181 and 535-557."
sizes = "Reported sizes include ED/enumeration data through L = 24 or 26 for longer-range models, transfer-matrix sequences through L = 15, static spectra at L = 18 or 24, and QDT transport through L = 28; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:287-327, 485-491, 549-579, 803-865."
boundary_conditions = ["OBC: Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:81-87", "PBC: Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:535-557"]
sectors = "Filling sectors N_f, with n_f = N_f/L where plotted; ranges q = 1, 2, 3 and selected q = 7, 14, 20 analytical checks; Literal papers/2503.09452/2503.09452_diagnostics-of-hilbert-space-fragmentation-freezing-transiti.md:271-287, 331-385."
observables = ["fragment dimensions D_frag and D_sum", "number of fragments N_frag and frozen states N_froz", "ground-state energy, density profile, entanglement entropy, gap, and dispersion", "bulk/boundary autocorrelation C_j(t) and Mazur lower bound C_j^M", "infinite-temperature transport correlator C̃(r,t) and its decay/spreading"]

