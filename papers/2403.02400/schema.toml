[method]
route = "Exact continuous-time diagrammatic quantum Monte Carlo for retarded interactions, with the bosonic baths traced out analytically; the expansion is sampled in the spin degrees of freedom using diagonal Metropolis updates and global directed-loop wormhole moves."
route_provenance = "Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:89-103"
implementation = "Interaction representation; retarded vertices are handled with inverse-transform sampling, and wormhole moves convert retarded diagonal vertices into spin-flip vertices for nonlocal loop-head tunneling."
implementation_provenance = "Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:89-103"

