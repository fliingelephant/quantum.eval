# Searcher notes; superseded by [problem]/[truth] sections after paper-to-schemas.
[candidate_notes]
model = "anisotropic Bose-Kondo / spin-boson: one S=1/2 spin, x/y/z components coupled to independent sub-Ohmic baths; wormhole world-line QMC (retarded interactions), sign-free"
headline = "phase diagram + exponents: continuous order-to-order (beyond-Landau) transitions, symmetry-enhanced first-order, tunable pseudocriticality (walking RG); fixed-point-annihilation / complex-fixed-point RG backbone"
compute = "single impurity spin, imaginary-time-only problem; seconds-to-minutes per point on a laptop. Strongest laptop QMC candidate"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "An anisotropic spin-boson (Bose-Kondo) impurity: one S=1/2 spin with each spin component coupled to an independent bosonic bath. Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:81"
convention = "The bath spectrum is power-law with cutoff omega_c set to the energy unit, and the dissipation strengths alpha_i are dimensionless. Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:84,87"
instance = "A single (0+1)-dimensional impurity, with no spatial lattice size; simulations use imaginary-time extent beta=1/T. Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:103,127"
couplings = "The main numerical manifold has alpha_x=alpha_y=alpha_xy and tunes alpha_z; Delta=1-alpha_z/alpha_xy parameterizes the anisotropy. Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:87"
symmetry = "alpha_z=0 is U(1)-symmetric and alpha_z=alpha_xy is SU(2)-symmetric. Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:87"
parameter_ranges = "The paper scans subohmic, ohmic, and superohmic bath exponents s, with the principal numerical phase diagrams covering 0<s<1 and selected s=1.5 data. Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:141,233,431"

