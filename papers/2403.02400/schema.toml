[candidate_notes]
model = "anisotropic Bose-Kondo / spin-boson: one S=1/2 spin, x/y/z components coupled to independent sub-Ohmic baths; wormhole world-line QMC (retarded interactions), sign-free"
headline = "phase diagram + exponents: continuous order-to-order (beyond-Landau) transitions, symmetry-enhanced first-order, tunable pseudocriticality (walking RG); fixed-point-annihilation / complex-fixed-point RG backbone"
compute = "single impurity spin, imaginary-time-only problem; seconds-to-minutes per point on a laptop. Strongest laptop QMC candidate"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "An anisotropic spin-boson (Bose-Kondo) impurity: one S=1/2 spin with each component coupled to an independent bosonic bath; the Hamiltonian and spectral density are given in Eqs. (1)–(2)."
model_provenance = "Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:75-87"
convention = "The cutoff frequency omega_c is the energy unit, J_i(omega)=0 above omega_c, alpha_i are dimensionless dissipation strengths, alpha_x=alpha_y=alpha_xy in the principal U(1)-symmetric scans, alpha_z=alpha_xy is SU(2) symmetry, and Delta=1-alpha_z/alpha_xy."
convention_provenance = "Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:81-87"
instance = "A (0+1)-dimensional single-impurity problem sampled in imaginary time of extent beta=1/T; controls are bath exponent s, alpha_xy, and alpha_z/alpha_xy, with the principal study covering subohmic 0<s<1, the superohmic check s>1, and temperature ranges spanning at least three orders of magnitude."
instance_provenance = "Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:103,127,281,705"
observables = "Spin susceptibilities chi_i, local-moment estimators m_i^2, normalized correlation lengths xi_i/beta, correlation ratios R_i, fixed-point couplings, phase boundaries, and finite-size/sliding critical exponents."
observables_provenance = "Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:105-133,245-277"

