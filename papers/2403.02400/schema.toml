exponent_crossings = "Use crossings of data pairs (beta,r beta), with r=sqrt(10) in Appendix C, then tune the inverse exponent for collapse; derivatives near crossings are fit cubically and errors are bootstrapped. Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:269,277,877"
scaling_protocol = "Use RG-invariant xi_i/beta and R_i for finite-size scaling, and use m_i^2 with its magnetization exponent when needed. Literal 2403.02400_tunable-quantum-criticality-and-pseudocriticality-across-the.md:267,477,527"
