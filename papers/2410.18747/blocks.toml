[[blocks]]
sections = ["method"]
lines = "141"
chars = "1-701"
text = "Whenever the unprojected wave function is a singlet, reversing the fluxes through upward and downward triangles does not change the Gutzwiller-projected state. In fact, the particle-hole transformation _Ph_ (i.e., _cj,σ → c[†] j,σ_[)][changes] sign to the auxiliary Hamiltonian, thus reversing the flux pattern; then, if _|_ Φ _⟩_ is an eigenstate corresponding to one choice of fluxes, then _Ph |_ Φ _⟩_ is an eigenstate for the reversed one (and identical boundary condtions). Moreover, _PGPh |_ Φ _⟩_ coincides with _PG |_ Φ _⟩_ , because _PG_ commutes with _Ph_ and the effect of the latter one is simply to reverse all the spins; but, in a singlet state, the spin flip leaves the state unaltered."

[[blocks]]
sections = ["method"]
lines = "143"
chars = "1-1224"
text = "Let us now discuss the conditions under which the previous wave function is unique. The inversion symmetry _I_ swaps up and down triangles, leaving the boundary conditions unchanged. Then, the composite transformation _I_[˜] = _GI I_ , defined as the inversion followed by a suitable gauge transformation _GI_ , changes _H_ aux _→−H_ aux, i.e., it anticommutes with the auxiliary Hamiltonian. As a consequence, for every single-particle level _ϵ_ , an energy level _−ϵ_ is also present and˜ _I_[˜] brings one eigenstate˜ _|ϕ⟩_ into the other. Furthermore, _I_[2] = 1, implying that _I_ has eigenvalues _±_ 1. For _ϵ_ = 0, it is possible to define two states _|ϕ⟩± I_[˜] _|ϕ⟩_ with opposite eigenvalues of _I_[˜] ; therefore, a different number of +1 and _−_ 1 eigenvalues implies the existence of zero-energy particle states. Then, we focus on the inversion operator _I_[˜] , whose eigenstates can be constructed from states in which electrons are localized on sites of the lattice (and have a definite spin value), _|_ **R** _, σ⟩_ . Let us consider a _L × L_ cluster, where the hopping pattern is shown in Fig. 1 and the coordinates of the sites are denoted by **R** = _n_ 1 **a** 1 + _n_ 2 **a** 2. Here, the gauge trans-"

