[[blocks]]
sections = ["method", "problem"]
lines = "157"
chars = "1-1170"
text = "Although the fermionic Hamiltonian breaks the translational symmetry of the lattice, translational invariance is restored after Gutzwiller projection, because both elementary translations along the primitive vectors **a** 1 and **a** 2 leave all the fluxes unchanged and do not modify the boundary conditions. This means that, after a translation, it is possible to recover the original hopping pattern via a suitable gauge transformation. Therefore, we define the magnetic translation operators _T_[˜] _j_ = _GTj Tj_ . These symmetry operators commute with _H_ aux (although they do not commute with each other) implying that, whenever the many particle ground state of _H_ aux is unique, it must also be an eigenstate of both _T_[˜] _j_ . Since the gauge transformation commutes with the Gutzwiller projection and can be always chosen to act as the identity on _|_ Ψ _⟩_ , the Gutzwiller-projected states are then zero-momentum eigenstates of the translation operators _Tj_ . This is actually the case for three out of four possible boundary conditions for which no zero-energy modes are present, showing that we can find three linearly independent variational states."

[[blocks]]
sections = ["method"]
lines = "159"
chars = "1-120"
text = "Finally, we consider the elementary rotation _R_ by 26 _π_ around the origin. This symmetry operation changes by _π_ all"

[[blocks]]
sections = ["method"]
lines = "161"
chars = "170-770"
text = "At half filling, if we combine the rotation with the previously defined particle-hole transformation _Ph_ , the Hamiltonian acquires a further global minus sign and then the fluxes through the elementary triangles go back to their original value without affecting the boundary conditions. This means that, by performing a suitable gauge transformation _GR_ , the combined symmetry _PhRGR_ acts as a permutator on the three states. Therefore, in order to build a variational state that is eigenstate of the rotation operator, an appropriate linear combination of these three states must be constructed."

[[blocks]]
sections = ["problem"]
lines = "163"
chars = "1-46"
text = "## **B. The** _Q_ = 1 **monopole excitations**"

[[blocks]]
sections = ["method", "problem"]
lines = "165"
chars = "1-1542"
text = "The _Q_ = 1 monopole excitations are constructed by inserting a 2 _π_ flux on top of the Dirac state, spreading it uniformly through all the elementary plaquettes of the lattice [34, 35, 39]. Inserting a _−_ 2 _π_ flux would yield an antimonopole, whose wave function is the complex conjugate of the monopole one. One possible choice for the fermionic hoppings is shown in Fig. 2, where the additional flux is equally distributed in the two triangles within each unit cell. It should be noted that, on a closed manifold such as the torus, the existence of a monopole with total flux 2 _π_ is always accompanied by a _−_ 2 _π_ flux, which is effectively hidden (modulo 2 _π_ ) in a single plaquette (e.g., in our setup, at the top-right corner). Most importantly, the pattern of the hopping amplitudes is not translationally invariant and it is not possible to restore the symmetry by using a gauge transformation (unlike for the Dirac state discussed above). Indeed, the (gauge invariant) fluxes along the loops wrapping around the torus are not uniform, which are not left invariant upon translation (in addition, different choices for the boundary conditions do not lead to different states). The Gutzwiller-projected states are also not translationally invariant. Still, it is possible to find a gauge transformation _GT[m] j_[for which the hopping amplitudes] that determine the symmetry breaking are confined along lines or columns of _O_ ( _L_ ) bonds [34]. As a result, translational symmetries are restored in the thermodynamic limit."

