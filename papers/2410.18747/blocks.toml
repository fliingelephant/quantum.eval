lines = "99"
chars = "1-333"
text = "Hamiltonian (1) is quartic in the fermionic operators and cannot be solved in general; still, in the spirit of a mean-field decoupling, a quadratic (auxiliary) Hamiltonian can be defined, whose eigenstates determine the variational wave functions. In the simplest case, the auxiliary model includes only (spindiagonal) hopping terms:"

[[blocks]]
sections = ["method"]
lines = "102"
text = "![](.figures/arxiv__2410.18747/2410.18747.pdf-0003-02.png)"

[[blocks]]
sections = ["method"]
lines = "105"
chars = "1-588"
text = "where _χij_ is the hopping amplitude that, in the general case, can be complex, implying the presence of a magnetic field in the auxiliary Hamiltonian. The magnetic flux through a given plaquette is determined by the argument of the product of hoppings around it. Notice that the unitary (gauge) transformation _cj,σ → e[iθ][j] cj,σ_ on the site _j_ modifies the phase of the hopping amplitude of the six bonds emanating from _j_ , without changing the magnetic flux through each of the 2 _N_ elementary (triangular) plaquettes, and the paths around the cluster along **a** 1 and **a** 2."

[[blocks]]
sections = ["method"]
lines = "107"
chars = "1-452"
text = "In general, eigenstates are easily obtained by a matrix diagonalization; then, a many-body state _|_ Φ _⟩_ with _N_ fermions is attained by filling suitable single-particle states, e.g., the lowest-energy ones. Since the hopping amplitudes _χij_ do not depend on the spin, the spatial part of the eigenvectors can be chosen to be the same for _σ_ = _↑_ and _↓_ . Then, whenever both levels are occupied, the resulting many-body state is a spin singlet."

[[blocks]]
