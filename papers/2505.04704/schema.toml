[candidate_notes]
model = "(1+1)D SU(2) lattice gauge theory with dynamical matter, PBC; sparse ED in the gauge-invariant qudit basis (ed-lgt), quench evolution"
headline = "three-regime dynamical phase diagram: ergodic vs fragmented (nonthermal, delocalized) vs disorder-free MBL from quenching superselection-sector superpositions; degenerate PT + superselection fragmentation argument"
compute = "local dim 13; N=6 (~4.8e6) laptop-comfortable, headline mechanism visible at N<=6-7 (paper's N=8 is near-ceiling)"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "(1+1)D hardcore-gluon SU(2) Yang-Mills lattice gauge theory coupled to flavorless dynamical staggered matter, with the Kogut-Susskind Hamiltonian of Eq. (1)."
model_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:89"
convention = "Natural units c = hbar = 1; the Hamiltonian is rescaled to dimensionless mass m and gauge coupling g^2."
convention_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:89,659"
instance = "N = 8 dressed sites with periodic boundary conditions; 13-dimensional local dressed-site Hilbert space, six zero-background-charge states and seven finite-background-charge states."
instance_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:85,613,653"
gauge_truncation = "Hardcore-gluon and background-charge truncations retain j and j_b in {0, 1/2}; gauge links use the chromoelectric irrep basis."
gauge_truncation_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:75,101,607"
sectors = "GI means the zero-background-charge SU(2) gauge-invariant sector; SS is an equal superposition over background-charge superselection sectors with b_n^k in {0, 1/2}."
sectors_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:82,96,117"
filling = "Half-filling, selected as the zero-baryon-number-density sector N_b = p_1 + 2 p_2 = 0."
filling_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:875"
initial_state = "The SS state is a superposition of all background-charge configurations, each with a two-site charge-density-wave matter pattern (two empty sites alternating with two doubly occupied sites) and gauge irreps j in {0, 1/2}; the GI comparison state has the same matter pattern with no active gauge fields."
initial_state_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:93,99,103"
observables = "Matter imbalance I(t), single- and double-occupancy populations p_1(t) and p_2(t), half-chain bipartite von Neumann entropy S(t), eigenstate overlap/fidelity, and DE/ME comparisons."
observables_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:123,141,151,177"

