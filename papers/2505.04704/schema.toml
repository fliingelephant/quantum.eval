[method]
family = "Exact diagonalization"
algorithm = "Full-spectrum exact diagonalization with symmetry-resolved Hamiltonian blocks and spectral DE/ME postprocessing."
provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:873,875"
valid_alternatives = "Inferred target-compatible routes are full-spectrum ED implementations and, for time-series-only targets at smaller accessible sizes, Krylov/Lanczos or tensor-network time evolution; the paper explicitly discusses MPS, TEBD, and TDVP as alternatives with different size/time limitations."
valid_alternatives_provenance = "Inferred from the target definitions at 123,151,177 and the alternative-method discussion at 891-893"

[method_params]
symmetry_resolution = "For the ED block structure, Z2-link symmetries are resolved; momentum is left unresolved; the +1 inversion-parity sector is projected to remove momentum degeneracies. The physical half-filling choice is recorded under problem.filling."
symmetry_resolution_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:875"

[software]
name = "ed-lgt"
description = "Library for Exact Diagonalization of Lattice Gauge Theories; simulation data and code are deposited on Zenodo."
provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:203,545,547"
valid_tools = "Inferred: any full-spectrum ED implementation that supports the dressed-site Hamiltonian and the stated symmetry sectors can produce the targets."
valid_tools_provenance = "Inferred from the ED route and symmetry requirements at 873-875"

[software_params]
notes = "No implementation-specific eigensolver tolerances, threading settings, noise tricks, or API toggles are stated."
provenance = "Inferred from the rendered paper; the only implementation details reported are the method and symmetry choices at 875."

[anchors]
su2_casimir = "E^2 |j, m_L, m_R> = j(j+1) |j, m_L, m_R>, the exact chromoelectric Casimir relation."
su2_casimir_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:75,585"
effective_model = "At strong coupling in the zero-background-charge sector, the two-state effective Hamiltonian is H_eff = 4/(g^2 + m) sum_n sigma_n . sigma_(n+1) + m sum_n (-1)^n sigma_n^z."
effective_model_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:745,759,762"
initial_entropy = "The exact SS initial MPS has bond dimension chi = 4, so its initial entropy is log chi."
initial_entropy_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:189,723"
max_entropy = "The maximal half-chain entropy is log N_subsys when all allowed subsystem configurations are equally probable."
max_entropy_provenance = "Literal 2505.04704_disorder-free-localization-and-fragmentation-in-a-non-abelia.md:887"

