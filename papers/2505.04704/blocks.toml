lines = "873"
chars = "6-34"
text = "EXACT DIAGONALIZATION METHODS"

[[blocks]]
sections = ["method", "software"]
lines = "875"
chars = "1-98"
text = "All numerical simulations presented in this work are performed using an Exact Diagonalization code"

[[blocks]]
sections = ["method_params", "software_params"]
lines = "875"
chars = "234-412"
text = "Z2-link symmetries (related to Eq. (S10) and resulting from the previously discussed dressed-site formalism [75, 135, 136]), which we resolve everywhere to satisfy SU(2) Gauss law"

[[blocks]]
sections = ["problem", "method_params"]
lines = "875"
chars = "415-497"
text = "particle-number conservation, which we resolve by selecting the half-filling sector"

[[blocks]]
sections = ["method_params", "software_params"]
lines = "875"
chars = "578-623"
text = "the momentum-symmetry, which we do not resolve"

[[blocks]]
sections = ["method_params", "software_params"]
lines = "875"
chars = "881-993"
text = "If left unresolved, this invariance introduces degeneracy between positive- _k_ and negative- _k_ momentum states"

[[blocks]]
sections = ["method_params", "software_params"]
lines = "875"
chars = "1079-1218"
text = "projecting the Hamiltonian onto this sector guarantees no degeneracy in the spectrum and allows us to compute the DE average using Eq. (S25)"

[[blocks]]
sections = ["problem", "method_params"]
lines = "875"
chars = "1265-1311"
text = "independently access each superselection sector"

[[blocks]]
sections = ["method_params"]
lines = "875"
chars = "1379-1480"
text = "the expectation values of the observables in Eq.(8) by averaging over the sectors as done in Eq. (S30)"

[[blocks]]
sections = ["method_params"]
lines = "875"
chars = "1483-1540"
text = "This is impossible when measuring the entanglement entropy"

