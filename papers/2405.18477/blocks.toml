chars = "1-16"
text = "## **I. METHOD**"

[[blocks]]
sections = ["method"]
lines = "70"
chars = "1-752"
text = "In order to construct an efficient numerical algorithm for studying finite-temperature physics, it is important to choose an appropriate representation of the density matrix. Since the TTO representation is well-suited for the extraction of the otherwise hardly accessible mixed-state properties in a low-temperature regime, here we develop the algorithm for constructing the TTO density matrix for quantum many-body systems at thermal equilibrium. In this section, we first provide a recap of TTOs and their advantages in representing and compressing the density matrix. Then, we provide the definitions of two mixed state entanglement measures and clarify how to extract them from a TTO. Finally, we present the main steps of our numerical algorithm."

[[blocks]]
sections = ["method"]
lines = "72"
chars = "1-30"
text = "## **A. Tree Tensor Operator**"

[[blocks]]
sections = ["method"]
lines = "74"
chars = "1-357"
text = "A TTO (Fig. 1a) is a natural tensor network ansatz for encoding a mixed state density matrix; by construction, it is loopless, guarantees positivity of the corresponding density matrix and, by performing isometrisation [46], allows us to compress all information about the mixed state probabilities and bipartite entanglement into a single tensor (Fig. 1b)."

