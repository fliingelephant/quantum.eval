chars = "1-35"
text = "## **II. RYDBERG ATOM HAMILTONIAN**"

[[blocks]]
sections = ["problem"]
lines = "138"
chars = "1-203"
text = "We consider a system of two-level Rydberg atoms pinned by optical tweezers. Such system realizes a spin1 _/_ 2 model by associating the two spin states with the ground state _|g⟩_ and Rydberg state _|r⟩_"

[[blocks]]
