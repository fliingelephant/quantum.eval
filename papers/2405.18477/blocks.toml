chars = "164-438"
text = "The Rabi frequency Ω and detuning ∆ are the laser-atom coupling parameters. The units are chosen such that the reduced Planck constant is ℏ = 1. It is convenient to express the long-range Rydberg interactions in terms of the Rydberg blockade radius per lattice spacing _RB/a_"

[[blocks]]
