[[blocks]]
sections = ["method", "method_params"]
lines = "156"
chars = "1-766"
text = "FIG. 3. **An algorithm for obtaining the thermal density matrix in the TTO form** . An infinite-temperature density matrix is always proportional to an identity matrix, and it is therefore straightforward to write in the LPTN form. We take this infinite-temperature density matrix as an initial state and evolve it via the imaginary time evolution, i.e., consecutively applying the operator _e[−]_[d] _[β] H/_[ˆ] 2 on both sides of the LPTN. Here, d _β/_ 2 is an imaginary time step which, in terms of physical interpretation, represents a small decrease in temperature. This way, we can reach a density matrix at an arbitrarily low temperature. Once we reach the desired temperature, we convert the LPTN into the TTO form with the procedure described in Appendix A."

[[blocks]]
sections = ["problem"]
lines = "158"
chars = "1-194"
text = "in which the interaction is much larger than the Rabi frequency, so the state with more than one excited atom within that radius is shifted far from resonance and thus dynamically decoupled [1]."

[[blocks]]
sections = ["problem"]
lines = "160"
chars = "1-318"
text = "We study a chain of _N_ Rydberg atoms described by the Hamiltonian in Eq. (5) with open boundary conditions. In numerical simulations, we set to zero all the interactions that are more than four lattice spacings apart. We choose the lattice spacing _a_ as the unit of length and Rabi frequency Ω as the unit of energy."

[[blocks]]
sections = ["problem"]
lines = "162"
chars = "1-1193"
text = "As thoroughly analyzed in the literature, ground states of many-body Rydberg chains are known to exhibit a rich phase diagram [19, 58–62]. In the regime of small detuning ∆ _/_ Ω, the leading contribution comes from the Rabi term, resulting in a low occupancy of the Rydberg state throughout a system and a disordered phase without any excitation pattern. Increasing the detuning ∆ _/_ Ω, the system starts to favor excitations of the atoms, however, the Rydberg interaction contribution tends to suppress nearby excitations. The interplay between these two contributions results in different excitation patterns, depending on the blockade radius _RB/a_ . The emergent phases turn out to be the crystalline phases of Z _p_ symmetry-breaking order (period- _p_ ), starting from Z2 in the low _RB/a_ region, and going towards the higher orders as _RB/a_ increases [19, 61]. Accordingly, the transitions between these phases belong to variety of different criticality classes. Moreover, it was shown that the Rydberg phase diagram hosts as well the incommensurate floating phases between disordered and crystalline phases [24, 58, 60–62], located in the regions from above the Z3 lobe and higher."

