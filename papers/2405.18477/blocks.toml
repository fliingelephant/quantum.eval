text = "Our algorithm represents an efficient way of obtaining the density matrix and provides adaptability to convert from LPTN geometry, suitable for imaginary time evolution, to TTO geometry, suitable for characterization of the mixed state properties"

[[blocks]]
sections = ["method"]
lines = "272"
chars = "603-777"
text = "The procedure is flexible to use beyond Rydberg systems and therefore can be employed as a toolbox for studying finite temperature physics of a general quantum many-body model"

[[blocks]]
sections = ["software"]
lines = "276"
chars = "1-120"
text = "The simulations were performed using the Quantum Green Tea software version 0.3.23 and Quantum Tea Leaves version 0.4.46"

[[blocks]]
sections = ["software_params"]
