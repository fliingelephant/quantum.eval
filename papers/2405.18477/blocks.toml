text = "Recall that the accuracy of our method is limited by the number of excited states we keep in a density matrix, _K_ 0. This means that, when the state becomes more mixed, the state truncation error becomes larger at fixed _K_ 0. An easy way of estimating the error induced by discarding the excited states is by tracking the norm loss during the LPTN to TTO conversion. The blue lines in Fig. 5 indicate the temperatures after which the preserved norm falls under a certain factor. As expected, the error increases with the system size for a fixed temperature value. This is because the number of excited states in the spectrum grows exponentially with the system size, and thus, increasing the system size, the number"

