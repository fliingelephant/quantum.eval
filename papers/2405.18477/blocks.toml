lines = "156"
chars = "1-766"
text = "FIG. 3. **An algorithm for obtaining the thermal density matrix in the TTO form** . An infinite-temperature density matrix is always proportional to an identity matrix, and it is therefore straightforward to write in the LPTN form. We take this infinite-temperature density matrix as an initial state and evolve it via the imaginary time evolution, i.e., consecutively applying the operator _e[−]_[d] _[β] H/_[ˆ] 2 on both sides of the LPTN. Here, d _β/_ 2 is an imaginary time step which, in terms of physical interpretation, represents a small decrease in temperature. This way, we can reach a density matrix at an arbitrarily low temperature. Once we reach the desired temperature, we convert the LPTN into the TTO form with the procedure described in Appendix A."

