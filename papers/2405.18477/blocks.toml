text = "## **B. Extracting the mixed-state entanglement**"

[[blocks]]
sections = ["method"]
lines = "98"
chars = "1-272"
text = "As described in Fig. 1b, the complete information about the bipartite entanglement between the system’s halves is contained in the TTO’s root tensor _R_ . Thus, _RR[†]_ represents a compressed density matrix from which we can compute the mixed-state entanglement measures."

