text = "Potts transition point"

[[blocks]]
sections = ["truth"]
lines = "248"
chars = "466-571"
text = "The curves show a good agreement in scaling with respect to the order of magnitude of entanglement values."

[[blocks]]
sections = ["truth"]
lines = "248"
chars = "573-676"
text = "The shape of the rescaled curves correspond to the functions _gN_ ( _·_ ) and _gF_ ( _·_ ) from Eq. (7)."

[[blocks]]
sections = ["truth"]
lines = "250"
chars = "80-417"
text = "From both entanglement measures, we observe that entanglement is approximately constant up to a certain temperature, after which it starts to decrease. Following the analysis from Section III, the temperature region in which the entanglement is constant corresponds to the temperature region in which the state remains approximately pure."

[[blocks]]
sections = ["problem", "anchors"]
lines = "255"
text = "![](.figures/arxiv__2405.18477/2405.18477.pdf-0007-05.png)"

[[blocks]]
sections = ["truth"]
lines = "260"
chars = "103-556"
text = "Rescaling both entanglement measure curves, the results in Fig. 7 show a good agreement with Eq. (7). The slight discrepancy in the scaling of _N_ = 13 entanglement negativity at the Ising critical point is most likely due to the finite system size. Altogether, Eq. (7) represents a tool for estimating the many-body mixed-state entanglement measures in the low-temperature region of conformal critical points, based on the results for small system size."

[[blocks]]
sections = ["method", "truth"]
lines = "264"
chars = "1-767"
text = "We have presented a tensor network algorithm for obtaining a thermal many-body density matrix and exploited our approach to study the finite-temperature effects on one-dimensional Rydberg atom systems of up to 31 particles. By computing the purity for different Hamiltonian parameters, we have studied the transition from the low-temperature pure state to the finite-temperature mixed state and demonstrated how the system’s response to the temperature depends strongly on the structure of the low-energy part of the spectrum. Indeed, the transition from the gapped to the gapless point in the phase diagram is characterized by sudden drops in the property’s resilience to the temperature. By plotting the temperature resilience of the system’s purity over the Hamil-"

[[blocks]]
sections = ["truth"]
lines = "268"
chars = "1-428"
text = "tonian parameters, we have identified the crystalline Z2 and Z3 - symmetry-breaking phases and clearly observed how they shrink when increasing the temperature. We have recognized the ground state phase transition curves as the curves where the system’s properties are the most sensitive to temperature. Moreover, as expected, larger systems have shown higher sensitivity to temperature effects in comparison to smaller systems."

[[blocks]]
sections = ["truth"]
lines = "270"
chars = "1-880"
text = "The Rydberg chain ground state phase diagram hosts a variety of different criticality classes, and we have analyzed the temperature effects on the entanglement at the Ising and the three-state Potts quantum critical points using the mixed-state entanglement monotones negativity and entanglement of formation. Both monotones have shown the same behavior where entanglement stays unaltered up to a certain temperature and then decreases towards higher temperatures. By performing a finitesize scaling analysis of both entanglement monotones, we have provided numerical evidence that the entanglement scaling law at conformal critical points extends from the zero temperature point to the low-temperature region. Therefore, this scaling law can be used to estimate the many-body mixed-state entanglement for large system sizes, based on the results obtained for a small system size."

[[blocks]]
sections = ["method"]
lines = "272"
chars = "355-601"
text = "Our algorithm represents an efficient way of obtaining the density matrix and provides adaptability to convert from LPTN geometry, suitable for imaginary time evolution, to TTO geometry, suitable for characterization of the mixed state properties."

[[blocks]]
sections = ["method"]
lines = "272"
chars = "1106-1115"
text = "into a TTO"

