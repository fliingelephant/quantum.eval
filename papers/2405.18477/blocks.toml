text = "computational resources by Cineca on the Leonardo machine"

[[blocks]]
sections = ["method"]
lines = "282"
chars = "1-41"
text = "## **Appendix A: LPTN to TTO conversion**"

[[blocks]]
sections = ["method", "method_params"]
lines = "284"
chars = "1-83"
text = "Here, we explain the algorithm for converting the LPTN density matrix into TTO form"

[[blocks]]
sections = ["method", "method_params"]
lines = "289"
text = "![](.figures/arxiv__2405.18477/2405.18477.pdf-0009-01.png)"

[[blocks]]
sections = ["method", "method_params"]
lines = "293"
chars = "1-271"
text = "a) one side of N-site LPTN b)<br>SVD SVD<br>contract singular values to<br>upper tensors<br>c) d)<br>SVD SVD<br>contract singular values to<br>an it<br>lower tensors<br>e)<br>LPTN of N/2 sites, repeat the<br>steps a) - d)<br>!<br>TTO tensors of log(N)-th<br>layer<br>corn"

[[blocks]]
sections = ["method"]
lines = "296"
chars = "1-408"
text = "FIG. 8. **Conversion from Locally Purified Tensor Network to Tree Tensor Operator** . Black dotted rectangles denote the contraction of the enclosed tensors. The purple dashed line defines the bipartition of links for singular value decomposition (SVD). Moreover, the gray color of a tensor denotes that the tensor is unitary with respect to the appropriate bipartition of links defined by the preceding SVD."

[[blocks]]
sections = ["method", "method_params"]
lines = "298"
chars = "80-291"
text = "the isometry center is installed to the uppermost tensor. Moreover, to increase the accuracy of our method we make sure that at each singular value truncation, the isometry center of LPTN is placed at that tensor"

[[blocks]]
sections = ["method", "method_params", "problem"]
lines = "300"
chars = "243-390"
text = "we run the imaginary time evolution on the odd-sited LPTN, and then insert the dummy sites decoupled from the rest of the system on the LPTN’s edges"

[[blocks]]
sections = ["method"]
lines = "302"
chars = "1-57"
text = "## **Appendix B: Entanglement of formation minimization**"

[[blocks]]
sections = ["method"]
lines = "304"
chars = "1-124"
text = "To minimize entanglement of formation in Eq. (3), we need to find the optimal pure state decomposition of the density matrix"

[[blocks]]
sections = ["method"]
lines = "306"
chars = "1-141"
text = "by a unitary matrix applied to TTO’s uppermost tensor. Therefore, the optimization time depends heavily on how we sample the unitary matrices"

[[blocks]]
sections = ["method"]
lines = "308"
chars = "1-140"
text = "Here, we improve the method proposed in Ref. [40], which relied on constructing the unitary matrix as an exponential of the Hermitian matrix"

[[blocks]]
sections = ["method"]
lines = "310"
chars = "1-100"
text = "We solve this issue by using the Nelder-Mead algorithm, which is a simplex-based optimization method"

[[blocks]]
sections = ["method", "method_params"]
lines = "310"
chars = "145-241"
text = "multiplying the initial guess for the unitary matrix with _squashed_ Haar-random unitary matrices"

[[blocks]]
sections = ["method", "method_params"]
lines = "313"
text = "![](.figures/arxiv__2405.18477/2405.18477.pdf-0009-10.png)"

[[blocks]]
sections = ["method_params"]
lines = "316"
chars = "1-117"
text = "where _U_ Haar = _U[†] DU_ is an eigenvalue decomposition of the Haar-random unitary matrix [70], and _α ∈_ [0 _,_ 1]"

[[blocks]]
sections = ["method", "method_params"]
lines = "318"
chars = "342-448"
text = "we can choose the initial guess of every new point to be the optimized unitary matrix from a previous point"

[[blocks]]
sections = ["method_params"]
lines = "320"
chars = "1-39"
text = "## **Appendix C: Convergence analysis**"

[[blocks]]
sections = ["problem", "method", "method_params"]
lines = "322"
chars = "1-118"
text = "In this section, we show how the convergence of the LPTN to TTO conversion algorithm depends on the bond dimension _m_"

[[blocks]]
sections = ["problem", "method_params"]
lines = "322"
chars = "139-218"
text = "we study the system of _N_ = 31 sites at the Ising and the Potts critical points"

[[blocks]]
sections = ["method_params"]
lines = "322"
chars = "366-502"
text = "We generate LPTN states with imaginary time evolution timestep _dt_ = 0 _._ 025, in the temperature regime _T/_ Ω= [0 _._ 02 _,_ 0 _._ 4]"

[[blocks]]
sections = ["method_params"]
lines = "324"
chars = "1-109"
text = "In the LPTN to TTO conversion, we fix the bond dimension _K_ 0 = 100, i.e., we keep the first 100 states in a"

[[blocks]]
sections = ["method", "method_params", "truth"]
lines = "328"
chars = "1-498"
text = "density matrix. We compare the data for bond dimensions _m_ = [30, 40, 50, 60]. To measure the accuracy of the conversion, we track the state’s norm loss due to singular value truncations during the conversion (Fig. 9a) and compare the energy of the resulting TTO with the corresponding energy of the LPTN (Fig. 9b). To give an intuition on how this reflects on the convergence of entanglement results, we show the convergence of entanglement negativity for different bond dimensions _m_ (Fig. 9c)."

[[blocks]]
sections = ["method", "method_params"]
lines = "330"
chars = "149-272"
text = "Interpretation of _K_ 0 is straightforward, as _K_ 0 is simply the final number of pure states we keep in the density matrix"

[[blocks]]
sections = ["method_params", "truth"]
lines = "332"
chars = "1-1092"
text = "Back to convergence, as already discussed in Sec. III, increasing the temperature means increasing the number of excited states that contribute to the density matrix. Therefore, the accuracy of results decreases as the number of states _K_ 0 becomes insufficient to describe a physical state. This reflects directly on the norm loss in Fig. 9a. As we can see, the norm loss curves do not significantly vary with the bond dimension _m_ , thus for these bond dimensions it is the choice of _K_ 0 that sets the limit to the overall accuracy of the results. Note that the norm loss would be influenced by _m_ for smaller values of _m_ . We denote the regime in which the norm loss is smaller than 1% with a black vertical line, physically representing an approximate temperature at which _K_ 0 = 100 states are enough to describe a thermal density matrix. Therefore, we expect our results to be accurate below this threshold temperature. Since the norm loss and the threshold temperature depend on the system size and the point in the phase diagram, we show the norm loss lines as well in Fig. 5."

[[blocks]]
sections = ["method_params", "truth"]
lines = "334"
chars = "1-780"
text = "By looking at the energy curves in Fig. 9b, the TTO results in the region below the threshold temperature coincide with the LPTN reference values. Also, the entanglement negativity in Fig. 9c is well-converged with _m_ within this region. The energy and the negativity at the Potts point and the negativity at the Ising point appear not to be converged with _m_ in the temperature regions above the threshold temperature. We attribute this to the above-discussed effect where larger mixedness of the system requires a larger bond dimension. Nevertheless, this region is not of interest because the accuracy is limited by _K_ 0 and not _m_ , therefore we do not expect accurate results there. An additional remark regarding the convergence results is that, even though the _m_ = 30"

[[blocks]]
sections = ["method_params", "truth"]
lines = "337"
text = "![](.figures/arxiv__2405.18477/2405.18477.pdf-0010-05.png)"

