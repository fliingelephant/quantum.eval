[[blocks]]
sections = ["method"]
lines = "282"
chars = "1-41"
text = "## **Appendix A: LPTN to TTO conversion**"

[[blocks]]
sections = ["method", "method_params"]
lines = "284"
chars = "1-1574"
text = "Here, we explain the algorithm for converting the LPTN density matrix into TTO form. Since both LPTN and TTO contain two sides of the network that are Hermitian conjugated to each other, referred to as _X_ and _X[†]_ in Fig. 1, it is enough to discard one of them and perform all the computations on only one of the sides. The procedure follows the steps in Fig. 8. Starting from the _N_ -site LPTN, where _N_ = 2 _[n]_ , _n_ being an integer, we first contract pairs of tensors (Fig. 8a). Then, we apply a truncated singular value decomposition (SVD) to the obtained tensors over a bipartition of links as indicated with purple dashed lines in Fig. 8b. The singular values are contracted to the upper tensors, and the lower tensors will remain unitary with respect to the corresponding bipartition of links. These lower tensors represent the log( _N_ )-th layer of the TTO. To create a base for building the next layer, we again apply a truncated SVD to the yellow tensors according to the specified bipartition (Fig. 8c), and this time contract the singular values to the lower tensors. In this case, the upper tensors stay unitary. Since the total density matrix contains as well the Hermitian conjugate part contracted over the upper bonds, we can ignore these upper unitary tensors because they contract with their Hermitian conjugates to an identity (Fig. 8d). We obtain the tensor network form as in Fig. 8e. The upper layer of tensors in Fig. 8e has the LPTN-like form of half as many particles. Therefore, we can iterate the described procedure to build the rest of"

[[blocks]]
sections = ["method", "method_params"]
lines = "289"
text = "![](.figures/arxiv__2405.18477/2405.18477.pdf-0009-01.png)"

[[blocks]]
sections = ["method", "method_params"]
lines = "293"
text = "a) one side of N-site LPTN b)<br>SVD SVD<br>contract singular values to<br>upper tensors<br>c) d)<br>SVD SVD<br>contract singular values to<br>an it<br>lower tensors<br>e)<br>LPTN of N/2 sites, repeat the<br>steps a) - d)<br>!<br>TTO tensors of log(N)-th<br>layer<br>corn<br>**----- End of picture text -----**<br>"

[[blocks]]
sections = ["method"]
lines = "296"
chars = "1-408"
text = "FIG. 8. **Conversion from Locally Purified Tensor Network to Tree Tensor Operator** . Black dotted rectangles denote the contraction of the enclosed tensors. The purple dashed line defines the bipartition of links for singular value decomposition (SVD). Moreover, the gray color of a tensor denotes that the tensor is unitary with respect to the appropriate bipartition of links defined by the preceding SVD."

[[blocks]]
sections = ["method"]
lines = "298"
chars = "1-292"
text = "the TTO layers. Notice that this procedure by its construction guarantees that the isometry center is installed to the uppermost tensor. Moreover, to increase the accuracy of our method we make sure that at each singular value truncation, the isometry center of LPTN is placed at that tensor."

[[blocks]]
sections = ["method", "method_params", "problem"]
lines = "300"
chars = "1-576"
text = "As noted above, TTOs are compatible only with the number of sites that are powers of two, however, the system sizes needed to realize the period-2 and period3 phases in the Rydberg phase diagram are not powers of two. To overcome this issue, we run the imaginary time evolution on the odd-sited LPTN, and then insert the dummy sites decoupled from the rest of the system on the LPTN’s edges. This way, the sites are artificially padded on both ends of the LPTN such that the new total number of sites is a power of two, without affecting any of the properties that we measure."

[[blocks]]
sections = ["method"]
lines = "302"
chars = "1-57"
text = "## **Appendix B: Entanglement of formation minimization**"

[[blocks]]
sections = ["method"]
lines = "304"
chars = "1-223"
text = "To minimize entanglement of formation in Eq. (3), we need to find the optimal pure state decomposition of the density matrix. As explained in Ref. [40], a certain pure state decomposition of a density matrix is parametrized"

[[blocks]]
sections = ["method"]
lines = "306"
chars = "1-142"
text = "by a unitary matrix applied to TTO’s uppermost tensor. Therefore, the optimization time depends heavily on how we sample the unitary matrices."

[[blocks]]
sections = ["method"]
lines = "308"
chars = "1-331"
text = "Here, we improve the method proposed in Ref. [40], which relied on constructing the unitary matrix as an exponential of the Hermitian matrix. The drawback of such an approach is that a small change in a parameter of the Hermitian matrix can, in general, result in a large change in the elements of the corresponding unitary matrix."

[[blocks]]
sections = ["method", "software_params"]
lines = "310"
chars = "1-253"
text = "We solve this issue by using the Nelder-Mead algorithm, which is a simplex-based optimization method. We construct each point of the simplex by multiplying the initial guess for the unitary matrix with _squashed_ Haar-random unitary matrices, defined as"

[[blocks]]
sections = ["method", "software_params"]
lines = "313"
text = "![](.figures/arxiv__2405.18477/2405.18477.pdf-0009-10.png)"

[[blocks]]
sections = ["method", "software_params"]
lines = "316"
chars = "1-333"
text = "where _U_ Haar = _U[†] DU_ is an eigenvalue decomposition of the Haar-random unitary matrix [70], and _α ∈_ [0 _,_ 1]. This way, we ensure that in every iteration of the search algorithm, the elements of a new guess for the unitary matrix are arbitrarily close to the elements of a previous guess, controlled with the parameter _α_ ."

[[blocks]]
sections = ["software_params"]
lines = "318"
chars = "1-503"
text = "Moreover, using physical intuition we can pick a convenient initial guess for the unitary matrix based on the following reasoning. The properties of the density matrix change continuously with increasing temperature. Therefore, if we run the entanglement of formation computation for temperature points starting from the lowest temperature, we can choose the initial guess of every new point to be the optimized unitary matrix from a previous point. Such a choice additionally speeds up the computation."

[[blocks]]
sections = ["method_params"]
lines = "320"
chars = "1-39"
text = "## **Appendix C: Convergence analysis**"

[[blocks]]
sections = ["method"]
lines = "322"
chars = "53-84"
text = "LPTN to TTO conversion algorithm"

[[blocks]]
sections = ["method"]
lines = "322"
chars = "86-118"
text = "depends on the bond dimension _m_"

[[blocks]]
sections = ["method", "method_params", "problem", "truth"]
lines = "322"
chars = "366-503"
text = "We generate LPTN states with imaginary time evolution timestep _dt_ = 0 _._ 025, in the temperature regime _T/_ Ω= [0 _._ 02 _,_ 0 _._ 4]."

[[blocks]]
sections = ["method"]
lines = "322"
chars = "505-592"
text = "To provide a meaningful analysis of the convergence of the LPTN to TTO conversion scheme"

[[blocks]]
sections = ["method"]
lines = "322"
chars = "617-661"
text = "LPTN state from which we start the conversion"

[[blocks]]
sections = ["method", "method_params"]
lines = "322"
chars = "663-696"
text = "is converged in the bond dimension"

[[blocks]]
sections = ["method", "method_params"]
lines = "322"
chars = "699-843"
text = "By increasing the bond dimension from _m_ = 30 to _m_ = 60, values of LPTN energy remain unchanged up to 8[th] digit for every temperature point."

[[blocks]]
sections = ["method", "method_params"]
lines = "322"
chars = "885-905"
text = "these bond dimensions"

[[blocks]]
sections = ["method", "method_params"]
lines = "324"
chars = "1-109"
text = "In the LPTN to TTO conversion, we fix the bond dimension _K_ 0 = 100, i.e., we keep the first 100 states in a"

[[blocks]]
sections = ["method", "method_params", "problem", "truth"]
lines = "328"
chars = "1-498"
text = "density matrix. We compare the data for bond dimensions _m_ = [30, 40, 50, 60]. To measure the accuracy of the conversion, we track the state’s norm loss due to singular value truncations during the conversion (Fig. 9a) and compare the energy of the resulting TTO with the corresponding energy of the LPTN (Fig. 9b). To give an intuition on how this reflects on the convergence of entanglement results, we show the convergence of entanglement negativity for different bond dimensions _m_ (Fig. 9c)."

[[blocks]]
sections = ["method", "method_params"]
lines = "330"
chars = "1-803"
text = "Before continuing to the convergence analysis results, it is useful to highlight the different roles of the bond dimensions _m_ and _K_ 0 in a TTO. Interpretation of _K_ 0 is straightforward, as _K_ 0 is simply the final number of pure states we keep in the density matrix. Interpretation of _m_ is, however, much more subtle: if one thinks of a TTO as multiple pure TTN states stacked together, TTO’s _m_ contains entanglement distributed over many pure states. Thus, a required _m_ depends on the amount of entanglement of each pure state and overall mixedness of a state - more entanglement in each pure state requires larger _m_ , but also larger mixedness requires larger _m_ as there are more pure states to be covered. The distribution between the two contributions within _m_ is not transparent."

[[blocks]]
sections = ["method", "method_params", "truth"]
lines = "332"
chars = "1-1092"
text = "Back to convergence, as already discussed in Sec. III, increasing the temperature means increasing the number of excited states that contribute to the density matrix. Therefore, the accuracy of results decreases as the number of states _K_ 0 becomes insufficient to describe a physical state. This reflects directly on the norm loss in Fig. 9a. As we can see, the norm loss curves do not significantly vary with the bond dimension _m_ , thus for these bond dimensions it is the choice of _K_ 0 that sets the limit to the overall accuracy of the results. Note that the norm loss would be influenced by _m_ for smaller values of _m_ . We denote the regime in which the norm loss is smaller than 1% with a black vertical line, physically representing an approximate temperature at which _K_ 0 = 100 states are enough to describe a thermal density matrix. Therefore, we expect our results to be accurate below this threshold temperature. Since the norm loss and the threshold temperature depend on the system size and the point in the phase diagram, we show the norm loss lines as well in Fig. 5."

[[blocks]]
sections = ["method", "method_params", "truth"]
lines = "334"
chars = "1-780"
text = "By looking at the energy curves in Fig. 9b, the TTO results in the region below the threshold temperature coincide with the LPTN reference values. Also, the entanglement negativity in Fig. 9c is well-converged with _m_ within this region. The energy and the negativity at the Potts point and the negativity at the Ising point appear not to be converged with _m_ in the temperature regions above the threshold temperature. We attribute this to the above-discussed effect where larger mixedness of the system requires a larger bond dimension. Nevertheless, this region is not of interest because the accuracy is limited by _K_ 0 and not _m_ , therefore we do not expect accurate results there. An additional remark regarding the convergence results is that, even though the _m_ = 30"

[[blocks]]
sections = ["problem", "method_params", "truth"]
lines = "337"
text = "![](.figures/arxiv__2405.18477/2405.18477.pdf-0010-05.png)"

[[blocks]]
sections = ["method", "method_params", "truth"]
lines = "341"
text = "Ising transition point Potts transition point<br>TTO data: m = 30 m = 40 m = 50 m = 60<br>a)<br>b) LPTN data LPTN data<br>c)<br>Norm loss<br>Energy<br>Entanglement negativity<br>**----- End of picture text -----**<br>"

[[blocks]]
sections = ["method", "method_params", "truth"]
lines = "344"
chars = "1-638"
text = "FIG. 9. **Convergence of LPTN to TTO conversion algorithm with the bond dimension** _m_ . Norm loss during the conversion (a), energy (b), and entanglement negativity (c) are computed at the Ising and the Potts critical points of the Rydberg model for _N_ = 31 sites. The bond dimension _m_ of the TTO and the corresponding LPTN state are the same. The bond dimension _K_ 0 is fixed to _K_ 0 = 100. The vertical line in all plots denotes a threshold temperature below which the norm loss during the LPTN to TTO conversion is smaller than 1%. The LPTN energy curve (blue curve) in (b) represents the reference values computed for _m_ = 60."

[[blocks]]
sections = ["method", "truth"]
lines = "346"
chars = "1-155"
text = "energy curve for the Potts point coincides with the reference LPTN curve in the plot, we expect this to be an accidental artifact of unconvergence in _m_ ."

[[blocks]]
sections = ["method", "method_params"]
lines = "348"
chars = "1-319"
text = "In this analysis, we keep the bond dimension _m_ the same for both LPTN and TTO states, but in general, they do not have to be the same. A good choice is that _m_ TTO is larger or equal to _m_ LPTN. Overall, we suggest the following strategy for picking the bond dimensions for LPTN to TTO conversion of thermal states:"

[[blocks]]
sections = ["method", "method_params"]
lines = "350"
chars = "1-55"
text = "1. Choose _m_ LPTN such that LPTN states are converged."

[[blocks]]
sections = ["method", "method_params"]
lines = "352"
chars = "1-80"
text = "2. Pick _K_ 0 and tune _m_ TTO such that the norm loss has converged in _m_ TTO."

[[blocks]]
sections = ["method_params"]
lines = "354"
chars = "1-102"
text = "3. Read out the threshold temperature below which the norm loss is smaller than the desired precision."

[[blocks]]
sections = ["method_params"]
lines = "356"
chars = "1-129"
text = "4. If the threshold temperature is too low for the purpose of the simulation, repeat the steps 1 _. −_ 3 _._ with a larger _K_ 0."

[[blocks]]
sections = ["method", "method_params"]
lines = "360"
chars = "1-104"
text = "5. Double-check if the properties have converged with _m_ TTO in region below the threshold temperature."

