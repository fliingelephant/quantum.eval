lines = "120"
chars = "361-416"
text = "**C. Obtaining the Tree Tensor Operator density matrix**"

[[blocks]]
sections = ["method", "anchors"]
lines = "122"
chars = "1-314"
text = "To access the system’s properties at an arbitrary temperature, we evolve the infinite-temperature density matrix according to the imaginary time evolution [51– 53]. This is possible due to the fact that an infinitetemperature density matrix, _ρ_ ˆ _∞_ , is proportional to an identity matrix, allowing us to write:"

[[blocks]]
sections = ["method", "anchors"]
lines = "125"
text = "![](.figures/arxiv__2405.18477/2405.18477.pdf-0003-10.png)"

[[blocks]]
sections = ["method"]
lines = "128"
chars = "1-107"
text = "In the last expression from Eq. (4) we recognize the form of a unitary time evolution of the density matrix"

[[blocks]]
sections = ["method", "method_params"]
lines = "130"
chars = "1-418"
text = "However, we cannot perform imaginary time evolution directly on a TTO: the representation of an identity matrix as a TTO would require the _K_ 0 dimension to scale exponentially with system size which prohibits the simulation in terms of computational resources. For this reason, we take a deviation via the matrix product state’s mixed state counterpart - the LPTN, which encodes the identity matrix in a trivial way."

[[blocks]]
sections = ["method"]
lines = "132"
chars = "1-381"
text = "We evolve LPTN in imaginary time using the timedependent variational principle (TDVP) [54, 55] algorithm. For details on the TDVP algorithm see Ref. [56, 57]. Once we obtain the finite-temperature LPTN density matrix, we convert it to a TTO with an iterative procedure described in Appendix A. The whole procedure for obtaining a TTO thermal density matrix is summarized in Fig. 3."

[[blocks]]
sections = ["method", "method_params", "truth"]
lines = "134"
chars = "1-668"
text = "The timestep we use in imaginary time evolution is _dβ/_ 2 = 0 _._ 05 for obtaining the finite temperature phase diagrams in Section III. The value is chosen based on the convergence study, showing that eventual errors are the largest in the vicinity of quantum critical transitions. The value of _dβ/_ 2 taken for the analysis at critical regions carried out in Section IV is thus further reduced to _dβ/_ 2 = 0 _._ 025. The maximal entanglement bond dimension in LPTN and TTO is _m_ = 50, and the maximal number of pure states we keep in the TTO density matrix is _K_ 0 = 100. The error resulting from truncation in LPTN to TTO conversion is analyzed in Section III."

[[blocks]]
sections = ["problem"]
