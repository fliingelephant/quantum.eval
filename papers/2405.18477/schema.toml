[problem]

[[problem.entries]]
name = "model"
value = "One-dimensional open Rydberg atom chain with two-level atoms, laser-driven Rabi coupling, detuning, and van der Waals interactions."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:136-160"

[[problem.entries]]
name = "Hamiltonian"
value = "H = (Omega/2) sum_i sigma_x^i - Delta sum_i n_z^i + sum_{i != j} C_6/R_ij^6 n_z^i n_z^j."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:138-144"

[[problem.entries]]
name = "convention"
value = "hbar = 1; lattice spacing a is the length unit; Rabi frequency Omega is the energy unit; interactions beyond four lattice spacings are set to zero."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:144,160"

[[problem.entries]]
name = "boundary_conditions_and_sizes"
value = "Open boundary conditions; N = 13, 25, and 31 sites, all of the form 6n+1."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:160,194"

[[problem.entries]]
name = "parameterization"
value = "Hamiltonian parameter plane (R_B/a, Delta/Omega), with period-2 Z2 and period-3 Z3 crystalline regimes and a disordered regime in the simulated range."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:162-176"

[[problem.entries]]
