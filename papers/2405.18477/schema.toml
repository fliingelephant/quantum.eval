[software_params]

[[software_params.entries]]
name = "entanglement_of_formation_optimizer"
value = "Nelder-Mead simplex; simplex points use squashed Haar-random unitary matrices U_squash = U^dagger D^alpha U with alpha in [0,1]."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:304-316"

[[software_params.entries]]
name = "optimizer_initialization"
value = "Warm-start each temperature point from the optimized unitary at the preceding temperature."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:318"

[[software_params.entries]]
name = "execution_context"
value = "The paper acknowledges Cineca resources on the Leonardo machine."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:278-280"

[anchors]

[[anchors.entries]]
name = "Gibbs_state"
value = "rho_hat = sum_j p_j |psi_j><psi_j|, p_j = exp(-beta E_j)/Z, beta = 1/T."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:76-82"

[[anchors.entries]]
name = "negativity_definition"
value = "E_N = (||rho_hat^(T_N/2)||_1 - 1)/2."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:106-112"

[[anchors.entries]]
name = "formation_definition"
value = "E_F is the infimum of the average half-system entanglement entropy over pure-state decompositions of rho_hat."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:114-120"

[[anchors.entries]]
name = "purity_definition"
value = "gamma = Tr(rho_hat^2) = sum_{j=1}^{K_0} p_j^2."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:198-204"

[[anchors.entries]]
name = "conformal_scaling"
value = "E_F(T,N) = (c/6) log(N) + g_F(T N^z); Ising uses c = 1/2, z = 1 and Potts uses c = 4/5, z = 1."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:252-260"

