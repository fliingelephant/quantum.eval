[method]

[[method.entries]]
name = "chosen_route"
value = "Thermal tensor-network route: initialize an LPTN at infinite temperature, evolve it in imaginary time with TDVP, then iteratively convert the finite-temperature LPTN into a Tree Tensor Operator."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:60,122-134"

[[method.entries]]
name = "TTO_ansatz"
value = "Loopless positive density-matrix ansatz rho = X X^dagger; isometrization concentrates mixed-state probabilities and bipartite entanglement in the root tensor."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:74,92-98"

[[method.entries]]
name = "mixed_state_estimators"
value = "Negativity is obtained from the partial transpose of the root-tensor compressed density matrix; entanglement of formation is minimized over pure-state decompositions parameterized by a unitary on the TTO root."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:98-120,304-316"

[[method.entries]]
name = "LPTN_to_TTO_conversion"
value = "The conversion contracts tensor pairs layer by layer and applies truncated SVDs over prescribed bipartitions, retaining singular values in alternating upper/lower tensors and discarding Hermitian-conjugate unitary factors."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:282-300"

[[method.entries]]
name = "valid_alternative_routes"
value = ["finite-temperature purification MPS/LPTN with TEBD or TDVP", "matrix-product density operator or MPO imaginary-time evolution", "exact diagonalization for the small-size targets"]
provenance = "Inferred Each alternative can represent the stated Gibbs state and compute the listed observables; the paper's target definitions are Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:76-120,198-204"

[method_params]

[[method_params.entries]]
name = "imaginary_time_step"
value = "d_beta/2 = 0.05 for phase diagrams and d_beta/2 = 0.025 near critical points."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:132-134"

[[method_params.entries]]
name = "entanglement_bond_dimension"
value = "m = 50 maximum for the LPTN and TTO main calculations; convergence study compares m = 30, 40, 50, 60."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:134,322-328,344"

[[method_params.entries]]
name = "mixing_bond_dimension"
value = "K_0 = 100 in the main calculations and convergence analysis; K_0 = 10 for the entanglement-of-formation analysis."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:92,134,236,324"

[[method_params.entries]]
name = "conversion_accuracy"
value = "The accepted low-temperature region is the region where norm loss is below 1%; the convergence strategy tunes m_TTO and K_0 against this threshold."
provenance = "Literal 2405.18477_finite-temperature-rydberg-arrays-quantum-phases-and-entangl.md:210,324-332,348-360"

