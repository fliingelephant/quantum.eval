[problem]
model = "Spin-1/2 anisotropic Heisenberg model on an equilateral triangular ladder with nearest-neighbor exchange and Ising interactions, reduced in the highly anisotropic regime to the kinetically constrained effective Hamiltonian H_eff."
model_provenance = "Literal 2506.10806_constructing-quantum-many-body-scars-from-hilbert-space-frag.md:43-57"
convention = "Spin-up is the magnon state |•⟩, spin-down is the hole state |◦⟩, n_i=(σ_i^z+I)/2, J is the exchange coupling, V is the Ising coupling, and the conserved charges are the magnon number N_I and, for V≫J, the magnon-bond number N_II."
convention_provenance = "Literal 2506.10806_constructing-quantum-many-body-scars-from-hilbert-space-frag.md:49-57"
instance = "Open boundary conditions with L physical sites; two virtual |◦⟩ sites are included at each edge. Symmetry sectors are labelled by (N_I,N_II), and the headline sectors include L=11,17,19 and the size sweeps reported in the figures."
instance_provenance = "Literal 2506.10806_constructing-quantum-many-body-scars-from-hilbert-space-frag.md:69-71; 291"

