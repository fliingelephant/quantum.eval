[problem]
model = { value = "Spin-1/2 anisotropic Heisenberg model on an equilateral triangular ladder with nearest-neighbor exchange and Ising interactions; in the highly anisotropic regime its constrained effective Hamiltonian governs the dynamics.", provenance = "Literal 2506.10806_constructing-quantum-many-body-scars-from-hilbert-space-frag.md:43-57" }
convention = { value = "J is the spin-exchange interaction, V is the Ising interaction, magnon occupation is n_i = (σ_i^z + I)/2, and the conserved quantities are total magnon number N_I and magnon-bond number N_II.", provenance = "Literal 2506.10806_constructing-quantum-many-body-scars-from-hilbert-space-frag.md:49-51" }
instance = { value = "Open boundary conditions with L physical sites; kinetic constraints are imposed by the quasilocal projectors, with virtual down-spin sites at both edges.", provenance = "Literal 2506.10806_constructing-quantum-many-body-scars-from-hilbert-space-frag.md:57-71,291" }
