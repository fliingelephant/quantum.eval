[paper]
id = "2601.18229"
title = "Breakdown of bosonic Thouless pump due to interaction in a quasiperiodic lattice"
authors = "S. Mondal, E. Gottlob, F. Heidrich-Meisner, U. Schneider"
journal = "Phys. Rev. B (2026), DOI 10.1103/6gdw-nmjk (accepted)"
family = "mps"
tier = "light"
kind = "physics"
status = "rendered"
