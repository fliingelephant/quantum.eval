# Searcher notes; superseded by [problem]/[truth] sections after paper-to-schemas.
[candidate_notes]
model = "interacting bosonic Aubry-Andre (quasiperiodic) chain, boson cutoff 3-4; iTEBD real-time adiabatic pumping"
headline = "pumped charge vs U: quantization breaks at weak U (doublon-channel closing), revives in hardcore limit; topological-pump quantization theory"
compute = "heaviest of the light set: full pump cycles across U values, still a few hours on laptop; journal status accepted -- re-verify at render"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "One-dimensional interacting bosonic Aubry-André (quasiperiodic) chain with onsite two-body interactions."
model_provenance = "Literal 2601.18229_breakdown-of-bosonic-thouless-pump-due-to-interaction-in-a-q.md:93"
hamiltonian = "H = H_kin + H_qp + H_int, with nearest-neighbor hopping -J, quasiperiodic onsite potential Δ cos(2πβl + γ(t)), and onsite interaction U n_l(n_l−1)/2."
hamiltonian_provenance = "Literal 2601.18229_breakdown-of-bosonic-thouless-pump-due-to-interaction-in-a-q.md:77-93"
convention = "J = 1 sets the energy unit; β = √2/2; U is the onsite two-body interaction energy; γ is the sliding pump phase."
convention_provenance = "Literal 2601.18229_breakdown-of-bosonic-thouless-pump-due-to-interaction-in-a-q.md:93-98"
pump_protocol = "The quasiperiodic phase is ramped linearly, γ(t) = γ(0) + 2πt/T, with a fixed period T = 0.205πJ."
pump_protocol_provenance = "Literal 2601.18229_breakdown-of-bosonic-thouless-pump-due-to-interaction-in-a-q.md:95-98,115"
instance = "Finite open one-dimensional chain, normally L = 40, with the initial N-particle product state occupying the central sites singly; two-particle minimal setups are used for the channel and isolated-doublon panels."
instance_provenance = "Literal 2601.18229_breakdown-of-bosonic-thouless-pump-due-to-interaction-in-a-q.md:113,117,186,209,239"
initial_state = "|ψ_N(0)⟩ is a central contiguous product state with one boson per occupied site; the isolated-doublon study starts with two particles on the central site."
initial_state_provenance = "Literal 2601.18229_breakdown-of-bosonic-thouless-pump-due-to-interaction-in-a-q.md:117,126,209"
ensemble = "Many-body results average over 40 independently sampled initial phases γ(0) from [0,2π]."
ensemble_provenance = "Literal 2601.18229_breakdown-of-bosonic-thouless-pump-due-to-interaction-in-a-q.md:119,131,165,239"
observables = ["local density n_j", "doublon density d_j = ⟨n_j(n_j−1)⟩/2", "bond current and pumped charge", "energy per particle E/N", "total doublon number D"]
observables_provenance = "Literal 2601.18229_breakdown-of-bosonic-thouless-pump-due-to-interaction-in-a-q.md:132,151,163,171,239"

