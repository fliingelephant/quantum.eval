valid_alternatives = ["MPS real-time TDVP", "another MPS implementation of TEBD", "sparse exact time evolution for the two-particle targets"]
valid_alternatives_provenance = "Inferred the finite-chain density, charge, and energy targets can be generated by other real-time MPS routes, while the two-particle panels also admit sparse exact evolution."

