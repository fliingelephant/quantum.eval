chars = "169-302"
text = "see the Fig. 5(h). Therefore, the transition is not a sequence of two single-particle transitions but a direct two-particle transition"

[[blocks]]
sections = ["truth"]
lines = "227"
chars = "305-337"
text = "Since this is not fully adiabatic"

[[blocks]]
sections = ["truth"]
lines = "227"
chars = "340-414"
text = "a fraction of the doublon initially remains at site _j_ = 0 and then subse-"

