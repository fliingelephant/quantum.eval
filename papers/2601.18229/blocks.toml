[[blocks]]
sections = ["problem", "truth"]
lines = "239"
chars = "11-103"
text = "Time evolution of (a) total energy and (b) total doublon number starting from a product state"

[[blocks]]
sections = ["problem"]
lines = "239"
chars = "119-186"
text = "with _N_ = 7 particles and ∆= 15 _J_ , averaged over 40 realizations"

[[blocks]]
sections = ["problem", "truth"]
lines = "239"
chars = "189-265"
text = "For the non-interacting ( _U_ = 0) and hardcore boson( _U/J_ = 50) cases, the"

[[blocks]]
sections = ["truth"]
lines = "239"
chars = "267-301"
text = "energy remains essentially constant"

[[blocks]]
sections = ["truth"]
lines = "239"
chars = "304-422"
text = "while it initially increases in the presence of finite repulsive interactions. Interestingly, for all interactions, the"

[[blocks]]
sections = ["truth"]
lines = "239"
chars = "424-465"
text = "total energy eventually starts to decrease"

[[blocks]]
sections = ["truth"]
lines = "239"
chars = "467-529"
text = "and, for weaker interactions ( _U_ = 2 _J_ , 4 _J_ and 6 _J_ ),"

[[blocks]]
sections = ["truth"]
lines = "239"
chars = "531-598"
text = "decreases below the initial energy already during the simulated time"

[[blocks]]
sections = ["truth"]
lines = "241"
chars = "9-50"
text = "dissociates into two neighboring particles"

[[blocks]]
sections = ["truth"]
lines = "241"
chars = "83-123"
text = "one now belongs to the lower _C_ = 1 band"

[[blocks]]
sections = ["truth"]
lines = "241"
chars = "126-235"
text = "This changes the total energy and, since the lower band is pumped in the opposite direction, gives rise to the"

[[blocks]]
sections = ["truth"]
lines = "241"
chars = "237-259"
text = "observed backscattering"

[[blocks]]
sections = ["truth"]
lines = "241"
chars = "262-501"
text = "The same mechanism applies to the upper band (right column). Based on our data and analysis, we expect that in a many-body system this process of dissociation of doublons continues until there are no doublons left in higher bands, see below"

[[blocks]]
sections = ["truth", "anchors"]
lines = "243"
chars = "1-249"
text = "We note that for attractive interactions, _U <_ 0, the situation changes as the doublon states are shifted downwards in energy instead of upwards. This changes the order of the level crossings in the Fig. 5(d), (h) and (l). As a consequence, now the"

[[blocks]]
sections = ["truth"]
lines = "243"
chars = "251-360"
text = "doublon pump in the upper band becomes stable while isolated doublons in the middle and lower bands dissociate"

[[blocks]]
sections = ["truth"]
lines = "243"
chars = "362-418"
text = "during the pump, transmitting particles to the band above"

[[blocks]]
sections = ["truth", "anchors"]
lines = "243"
chars = "421-572"
text = "This occurs because for interaction _U →−U_ and phase _γ_ ( _t_ ) _→ γ_ ( _t_ ) + _π_ , the energy channels become mirror reflections about zero _E →−E_"

[[blocks]]
sections = ["truth"]
lines = "245"
chars = "9-20"
text = "ENERGY DECAY"

[[blocks]]
sections = ["anchors", "truth"]
lines = "247"
chars = "1-71"
text = "In a periodically driven isolated many-body system one normally expects"

[[blocks]]
sections = ["truth"]
lines = "247"
chars = "73-87"
text = "Floquet heating"

[[blocks]]
sections = ["anchors", "truth"]
lines = "247"
chars = "88-150"
text = ", meaning that its total energy will generically rise with time"

[[blocks]]
sections = ["anchors", "truth"]
lines = "247"
chars = "161-216"
text = "as the system absorbs energy from the drive and heats up"

[[blocks]]
sections = ["truth"]
lines = "249"
chars = "1-23"
text = "contrast, we observe an"

[[blocks]]
sections = ["truth"]
lines = "249"
chars = "25-44"
text = "unusual energy decay"

[[blocks]]
sections = ["truth"]
lines = "249"
chars = "47-194"
text = "Examples of this energy decay are shown in Fig. 6(a) and highlight that for intermediate interaction strength, _U_ = 2 _J_ , 4 _J_ , and 8 _J_ , the"

[[blocks]]
sections = ["truth"]
lines = "249"
chars = "196-232"
text = "energy drops below the initial energy"

[[blocks]]
sections = ["truth"]
lines = "249"
chars = "234-268"
text = "already on the simulated timescales"

[[blocks]]
sections = ["truth"]
lines = "249"
chars = "271-503"
text = "These timescales match the times for the decay of the initially created doublons shown in Fig. 6(b), demonstrating that the underlying microscopic mechanism is directly related to the decay of individual doublons discussed in Sec. IV"

[[blocks]]
sections = ["truth"]
lines = "251"
chars = "1-40"
text = "Starting from the initial product state,"

[[blocks]]
sections = ["truth"]
lines = "251"
chars = "42-79"
text = "bare tunneling generates some doublons"

[[blocks]]
sections = ["truth"]
lines = "251"
chars = "81-196"
text = "during the first tunneling times [63], as shown in Fig. 6(b), accompanied by an initial increase in the total energy"

[[blocks]]
sections = ["truth"]
lines = "251"
chars = "266-320"
text = "doublons in higher bands are unstable under the pumping"

[[blocks]]
sections = ["truth"]
lines = "251"
chars = "323-385"
text = "and will dissociate with one particle ending up in a lower band"

[[blocks]]
sections = ["truth"]
lines = "251"
chars = "405-436"
text = "total energy gradually decreases"

[[blocks]]
sections = ["truth"]
lines = "251"
chars = "438-476"
text = "until no doubons remain in higher bands"

[[blocks]]
sections = ["problem", "anchors"]
lines = "255"
chars = "1-105"
text = "In conclusion, we explored the effect of interactions on the Thouless pump in a quasiperiodic system, the"

[[blocks]]
sections = ["problem", "anchors"]
lines = "255"
chars = "107-155"
text = "AubryAndr´e model with on-site interacting bosons"

[[blocks]]
sections = ["problem", "anchors"]
lines = "255"
chars = "158-445"
text = "The time period and the strength of the quasiperiodic potential were chosen such that the two first-order gaps in the single-particle spectrum constitute the relevant energy scale. In the non-interacting limit, this leads to quantized charge pumping in the three first-order subbands with"

[[blocks]]
sections = ["anchors"]
lines = "255"
chars = "447-481"
text = "Chern numbers _C_ = 1, _−_ 2, and 1"

[[blocks]]
sections = ["truth"]
lines = "257"
chars = "1-16"
text = "We find that the"

[[blocks]]
sections = ["truth"]
lines = "257"
chars = "18-103"
text = "pumped charge starts to deviate from the quantized value already for weak interactions"

[[blocks]]
sections = ["truth", "anchors"]
lines = "257"
chars = "106-252"
text = "This result is in sharp contrast with studies of the noninteracting pump in the presence of disorder, where the pump is extraordinarily robust [12]"

[[blocks]]
sections = ["truth"]
lines = "257"
chars = "255-382"
text = "For intermediate interactions we identified discrete doublon channels that significantly influence the pumped charge, leading to"

[[blocks]]
sections = ["truth"]
lines = "257"
chars = "384-437"
text = "sharp changes at the points where these channels close"

[[blocks]]
sections = ["truth", "anchors"]
lines = "257"
chars = "440-585"
text = "At very large interaction strengths, where doublon formation is strongly suppressed, the system enters into the regime of hard-core bosons and the"

[[blocks]]
sections = ["truth"]
lines = "257"
chars = "587-613"
text = "quantized pump is recovered"

[[blocks]]
sections = ["truth"]
lines = "259"
chars = "1-197"
text = "Finally, we demonstrated an interesting asymmetry where the dynamics of an isolated doublon under the pump depends on its initial energy and the sign of the interaction. For repulsive interactions,"

[[blocks]]
sections = ["truth"]
lines = "259"
chars = "199-243"
text = "doublons in the lowest band are pumped stably"

[[blocks]]
sections = ["truth"]
lines = "259"
chars = "246-286"
text = "In the higher two bands, in contrast, the"

[[blocks]]
sections = ["truth"]
lines = "259"
chars = "288-353"
text = "doublon pump breaks down in the presence of repulsive interactions"

[[blocks]]
sections = ["truth"]
lines = "259"
chars = "364-423"
text = "doublon dissociates by emitting a particle into a lower band"

[[blocks]]
sections = ["truth"]
lines = "259"
chars = "426-456"
text = "This gives rise to a surprising"

[[blocks]]
sections = ["truth"]
lines = "259"
chars = "458-481"
text = "decrease in total energy"

[[blocks]]
sections = ["truth"]
lines = "259"
chars = "484-605"
text = "contrary to the typical expectation of Floquet heating. For attractive interactions, the role of the bands is reversed and"

[[blocks]]
sections = ["truth"]
lines = "259"
chars = "607-652"
text = "particles get transferred towards higher bands"

