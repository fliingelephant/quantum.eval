text = "closing of those channels does not give rise to significant signatures in the manybody case"

[[blocks]]
sections = ["problem", "truth"]
lines = "217"
chars = "10-36"
text = "PUMPING OF A SINGLE DOUBLON"

[[blocks]]
sections = ["problem"]
lines = "219"
chars = "1-89"
text = "In order to further analyze the differences between the different bands, we now move to a"

[[blocks]]
sections = ["problem"]
lines = "219"
chars = "91-147"
text = "minimal model and explore the pumping of a single doublon"

[[blocks]]
sections = ["anchors", "truth"]
lines = "219"
chars = "150-217"
text = "While the singleparticle band structure is fully symmetric in energy"

[[blocks]]
sections = ["anchors", "truth"]
lines = "219"
chars = "220-278"
text = "with the top and bottom _C_ = 1 bands behaving identically,"

[[blocks]]
sections = ["truth"]
lines = "219"
chars = "280-395"
text = "finite interactions break this symmetry and give rise to different behaviors for a doublon in the top or bottom band"

[[blocks]]
sections = ["problem"]
lines = "219"
chars = "401-496"
text = "initialize a doublon on a site corresponding to the desired band by tuning the initial phase _γ_"

[[blocks]]
sections = ["problem"]
lines = "219"
chars = "498-541"
text = "and study the resulting pumping dynamics for"

[[blocks]]
sections = ["problem"]
lines = "219"
chars = "543-582"
text = "different repulsive interactions _U ≥_ 0"

[[blocks]]
sections = ["problem"]
lines = "219"
chars = "585-700"
text = "see Fig. 5, where the left, middle, and right columns correspond to the lower, middle, and upper bands, respectively"

[[blocks]]
sections = ["truth"]
lines = "221"
chars = "1-49"
text = "In the non-interacting case [Fig. 5 (a,e,i)], the"

[[blocks]]
sections = ["truth"]
lines = "221"
chars = "51-163"
text = "two particles are always pumped independently but identically and hence naturally remain together during the pump"

[[blocks]]
sections = ["truth"]
lines = "221"
chars = "166-189"
text = "irrespective of the band"

[[blocks]]
sections = ["truth"]
lines = "221"
chars = "192-305"
text = "The very slight broadening of the left moving cloud stems from the bare tunneling and is also visible in Fig. 2(a)"

[[blocks]]
sections = ["truth"]
lines = "223"
chars = "1-143"
text = "In the interacting cases, in contrast, there is a significant difference between the lowest band [Fig. 5 (b,c)] and the other two bands. In the"

[[blocks]]
sections = ["truth"]
lines = "223"
chars = "145-283"
text = "lowest band, the interactions have, for the chosen pump speed, no influence on the pumping and the two particles are always pumped together"

[[blocks]]
sections = ["truth"]
lines = "223"
chars = "293-410"
text = "middle and higher bands, in contrast, the interactions can lead to a dissociation of the doublon and to backscattering"

[[blocks]]
sections = ["truth"]
lines = "223"
chars = "419-518"
text = "one particle gets scattered into a lower band and subsequently is pumped into the opposite direction"

[[blocks]]
sections = ["truth"]
lines = "223"
chars = "521-655"
text = "Interestingly, this asymmetry can lead to a decrease in total energy in this pumped many-body system and is discussed further in Sec. V"

[[blocks]]
sections = ["problem", "anchors"]
lines = "225"
chars = "1-104"
text = "Similar to the previous discussion, this difference between the bands can be understood by analyzing the"

[[blocks]]
sections = ["problem"]
lines = "225"
chars = "106-169"
text = "energy channels utilized by the two particles during the pumping"

[[blocks]]
sections = ["problem", "anchors"]
lines = "225"
chars = "172-205"
text = "shown at the bottom of Fig. 5. The"

[[blocks]]
sections = ["problem"]
lines = "225"
chars = "207-252"
text = "initial state, i.e., a doublon on site _j_ = 0"

[[blocks]]
sections = ["truth", "anchors"]
lines = "225"
chars = "255-582"
text = "is denoted by the green line. For the lowest band [Fig. 5(d)], the doublon state first becomes resonant with the state of two neighboring single particles at sites _j_ = 0 and 1, plotted as the red dotted line. This state subsequently becomes resonant with the doublon state at site _j_ = 1 (blue). For that given pumping speed,"

[[blocks]]
sections = ["truth"]
lines = "225"
chars = "584-655"
text = "these two transitions are adiabatic and hence the doublon remains intact"

[[blocks]]
sections = ["truth"]
lines = "227"
chars = "1-105"
text = "For a doublon in the middle band, in contrast, the situation is reversed, and the doublon on site _j_ = 0"

[[blocks]]
sections = ["truth"]
lines = "227"
chars = "107-166"
text = "directly becomes resonant with a doublon on site _j_ = _−_ 1"

[[blocks]]
sections = ["truth", "anchors"]
