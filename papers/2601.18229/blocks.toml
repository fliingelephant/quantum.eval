text = "lower ( _C_ = 1) middle ( _C_ = _−_ 2), and upper ( _C_ = 1) bands"

[[blocks]]
sections = ["truth"]
lines = "209"
chars = "499-574"
text = "respectively, for _U_ = 0. We see that, in the presence of interactions, the"

[[blocks]]
sections = ["truth"]
lines = "209"
chars = "576-682"
text = "pumping of doublons in the lowest band remains stable, whereas it is unstable for the middle and upper band"

[[blocks]]
sections = ["problem", "anchors"]
lines = "209"
chars = "685-1048"
text = "To explain the presence or absence of stability in each case, we plot the energy channels formed by local doublon (solid lines) and singlon (dotted lines) states in (d), (h), and (l) for the parameters considered in (c), (g) and (k) respectively. The arrows represent the path followed by the initial state during the evolution. In the first case (lower band), the"

[[blocks]]
sections = ["truth"]
lines = "209"
chars = "1050-1120"
text = "doublon successfully adiabatically moves from one site to the next site"

[[blocks]]
sections = ["truth"]
lines = "209"
chars = "1122-1193"
text = "via a singlon state. In the other two cases (middle and upper band), the"

[[blocks]]
sections = ["truth"]
