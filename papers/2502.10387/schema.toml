valid_families = ["mps", "ed"]
valid_algorithms = ["TDVP or another real-time MPS integrator for the correlator targets", "TEBD plus TDVP for the PBC correlator cross-check", "sparse or dense exact diagonalization for the L = 10 matrix-element target"]
