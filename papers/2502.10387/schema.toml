[candidate_notes]
model = "spin-1 chain hosting an equally-spaced scar tower (ladder-operator generated); sparse/symmetry-resolved ED + autocorrelators/time evolution"
headline = "anomalous non-decaying autocorrelation / finite stiffness carried by the scar subspace; dynamical symmetry restricted to scars + generalized-ETH backbone"
compute = "dim 3^L; L~12-16 with symmetry (up to ~5e6): sparse ED, minutes-to-hours on laptop"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "Spin-1 chain with Hamiltonian H = J Σ_j(S_j^x S_{j+1}^x + S_j^y S_{j+1}^y) + h Σ_j(S_j^z + 1) + D Σ_j((S_j^z)^2 - 1) + J_3 Σ_j(S_j^x S_{j+3}^x + S_j^y S_{j+3}^y)."
model_provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:64-70"
convention = "Spin operators are spin-1 operators and ℏ = 1; the conserved magnetization is along z."
convention_provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:70"
instance = "Main calculation: even open chain L = 60, O = (S_{L/2}^+)^2, coherent state |ζ⟩ at ζ = −i, J = 1, D = 0.1, J_3 = 0.5, h = 0.5, times through t = 8; the state has zero magnetization density and energy density corresponding to infinite temperature. Auxiliary ED uses L = 10, N = L/2, j = L/2. Appendix-B comparison uses L = 60 with PBC and OBC."
instance_provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:124,134,170,226,238,504-564"

