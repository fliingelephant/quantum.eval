[paper]
id = "2502.10387"
title = "Transport in a system with a tower of quantum many-body scars"
authors = "G. Morettini, L. Capizzi, M. Fagotti, L. Mazza"
journal = "Phys. Rev. B 112, 134314 (2025)"
family = "ed"
tier = "light"
kind = "physics"
status = "rendered"
doi = "10.1103/821h-8yjz"
arxiv_version = "2502.10387v2"
md_sha256 = "a3070495b93f91c9be7b7fe20255806adf486572d39deadeb1e88c04cd8f4eaa"

[candidate_notes]
model = "spin-1 chain hosting an equally-spaced scar tower (ladder-operator generated); sparse/symmetry-resolved ED + autocorrelators/time evolution"
headline = "anomalous non-decaying autocorrelation / finite stiffness carried by the scar subspace; dynamical symmetry restricted to scars + generalized-ETH backbone"
compute = "dim 3^L; L~12-16 with symmetry (up to ~5e6): sparse ED, minutes-to-hours on laptop"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = 'Spin-1 chain with H = J sum_j(S^x_j S^x_{j+1} + S^y_j S^y_{j+1}) + h sum_j(S^z_j + 1) + D sum_j((S^z_j)^2 - 1) + J_3 sum_j(S^x_j S^x_{j+3} + S^y_j S^y_{j+3}).'
model_provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:64-70"
convention = "S_j^a are spin-1 operators; hbar = 1; the Hamiltonian conserves total z-magnetization."
convention_provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:70"
instance = "Main campaign: even open chain L = 60, O = (S^+_{L/2})^2 at the chain center, coherent state |zeta = -i>, J = 1, D = 0.1, J_3 = 0.5, h = 0.5, and times through t = 8."
instance_provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:124,134"
secondary_instances = "The matrix-element panel uses exact diagonalization at L = 10; the Appendix B cross-check uses PBC at L = 60 and compares it with the OBC campaign."
secondary_instances_provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:226,504-508"
ensemble = "Coherent scar-subspace product state for Figs. 1-3 and 6; infinite-temperature state for Fig. 4; scar/eigenstate matrix elements for Fig. 5."
ensemble_provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:124,134,148,170,226,506"

[[problem.targets]]
panel = "fig1"
quantity = "Real part of the connected autocorrelator C(x,t) for O = (S^+_{L/2})^2"
observable = "Re <O†(x,t) O(0,0)>_c"
axes = "x and t, with t from 0 to 8"
state = "coherent state |zeta = -i> in the scarred subspace W"
tier = "light"
provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:124,134"

[[problem.targets]]
panel = "fig2"
quantity = "Dynamical critical exponent z inferred from the rescaled autocorrelator and eta(t)"
observable = "eta(t) = sum_x |Re[e^(i omega t) C(x,t)]|^2"
axes = "rescaled spatial profile and eta(t) for t from 2 to 8"
state = "coherent state |zeta = -i>"
supporting_panels = ["fig3"]
tier = "light"
provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:136-150"

[[problem.targets]]
panel = "fig4"
quantity = "Infinite-temperature absolute autocorrelator at the same local operator"
observable = "|<O†(x,t) O(0,0)>_{0,c}|"
axes = "x and t from 0 to 5"
state = "infinite-temperature state"
tier = "light"
provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:148,170"

[[problem.targets]]
panel = "fig5"
quantity = "Off-diagonal matrix-element anomaly between a scar and nearby eigenstates"
observable = "|<E_i|(S^+_{L/2})^2|N>|^2 versus E_i - N omega"
axes = "energy difference E_i - N omega, with N = L/2 and L = 10"
state = "exact-eigenstate matrix elements"
tier = "light"
provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:226,238"

[[problem.targets]]
panel = "fig6"
quantity = "eta(t) comparison between the OBC campaign and the PBC algorithm"
observable = "eta(t)"
axes = "t, with the comparison reliable through approximately t = 8"
state = "coherent state; PBC and OBC implementations"
tier = "light"
provenance = "Literal 2502.10387_transport-in-a-system-with-a-tower-of-quantum-many-body-scar.md:504-508,564"

