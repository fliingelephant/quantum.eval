text = "We now describe the technique employed for the unitary evolution, that allows to represent efficiently ( _Sj_[+] _[′]_[)][2][(] _[−][t/]_[2)] _[ |][ζ][⟩]_[as][an][MPS.][We][combine][Time-evolving] block decimation (TEBD) and TDVP [52, 73, 74]. We remark that TEBD is well-suited for evolving initial product states, but it struggles with periodic boundary conditions. To overcome these limitations, we use TEBD with high accuracy up to a fixed time, ensuring that the MPS reaches a sufficiently large bond dimension. At this point, we switch to two-site TDVP. Finally, once the bond dimension reaches a given threshold Dmax, we perform the one-site TDVP [75, 76]. The parameters used for the TEBD are [ _δt, ϵ, tf_ ] = �0 _._ 02 _,_ 10 _[−]_[14] _,_ 0 _._ 2�, where _tf_ is the time after which we apply TDVP. For the TDVP we use [ _δt, ϵ, nsweeps_ ] = �0 _._ 1 _,_ 10 _[−]_[12] _,_ 1�. We compare the algorithm described above, for periodic boundary conditions (PBC), and that of the main text with open boundary conditions (OBC); in particular, we have kept the same values for the parameters _J, h, D, J_ 3 and the size is _L_ = 60. In Fig. 6 we plot the quantity _η_ ( _t_ ) for different bond dimensions: an inset highlights the discrepancies that are negligible for _t_ ≲ 8. "

