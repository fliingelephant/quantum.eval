[problem]
model = """
Interacting Kitaev chain with explicit microscopic N=1 quantum-mechanical
supersymmetry (the Miura-Shimomura-Totsuka model, introduced in Phys. Rev. B
109, 085141 (2024), ref. [36]). L Majorana fermions beta_j, gamma_j per site
(one qubit per site) on a 1D ring. Real supercharge
R(alpha) = sum_j [ (1-alpha) beta_j + i*alpha beta_j beta_{j+1} gamma_j ],
fermion parity (-1)^F = prod_j (i beta_j gamma_j); the Hamiltonian is the
square of the supercharge, H(alpha) := (1/2) R(alpha)^2 = (1-alpha)^2 H_0
+ alpha(1-alpha) H_CKC + alpha^2 H_Fen, with H_0 := L/2 (constant, sets the
SUSY energy origin to zero), H_CKC := sum_j (i beta_{j+1} gamma_j - i
beta_{j-1} gamma_j) (the noninteracting critical Kitaev chain, free
Majorana CFT), and H_Fen := (1/2)(sum_j i beta_j beta_{j+1} gamma_j)^2 =
L/2 - sum_j beta_{j-1} beta_{j+1} gamma_{j-1} gamma_j (Fendley's integrable
interacting/superfrustrated model). alpha in [0,1] is the single
dimensionless interaction parameter interpolating H_0 -> H_CKC -> H_Fen.
An equivalent spin-1/2 (Jordan-Wigner-transformed) representation of H_CKC
and H_Fen is given in Appendix A and is the representation actually
diagonalized for the entanglement-entropy runs.
"""
model_provenance = "Literal md:126 (H(alpha):=(1/2)R(alpha)^2, Eq. 4); see also md:94,116,132,136,389,395"

convention = """
Majorana normalization {beta_i,beta_j} = {gamma_i,gamma_j} = 2 delta_ij,
{beta_i,gamma_j} = 0 (i.e. beta_j^2 = gamma_j^2 = 1). SUSY-breaking
criterion: the system is SUSY-broken iff e_gs(alpha) := lim_{L->infinity}
E_gs(alpha;L)/L > 0, and SUSY-restored iff e_gs(alpha) = 0 (Eqs. 8-9); this
is the order parameter the paper locates numerically. Energy origin fixed
by H_0 = L/2 so that H(alpha) >= 0 (supersymmetric spectrum).
"""
convention_provenance = "Literal md:103 (Eq. 2); md:156,162 (Eqs. 8-9)"

instance = """
1D ring of L sites, fermionic periodic boundary conditions (PBC) assumed
throughout unless stated otherwise (beta_{L+j}:=beta_j, gamma_{L+j}:=gamma_j);
anti-periodic boundary conditions (APBC) are additionally used, together
with both fermion-parity (even/odd) sectors, for the CFT-spectroscopy
comparison in Sec. IV C / Appendix B. The paper restricts its numerics to
the window 0 <= alpha <= 1/2 (the frustration-free point sits at
alpha=1/2). System sizes actually simulated: DMRG L = 14,16,18,...,50
(stated general range, Sec. III); the entanglement-entropy run (Fig. 5)
uses a size subsample read off its legend as L = 20,24,28,32,36,40,44,48,52
(Inferred from the figure's OCR'd legend, md:308); the gap-ratio run
(Sec. IV C) states L = 16,18,...,48,50 for the alpha_c(L) extrapolation
and plots the subsample L=20,30,40,50 (md:339,351). Exact diagonalization
uses L = 4,5,...,15 (periodic) for the excitation gap (Sec. III B) and is
also used (size unspecified beyond that range) for the ground-state
degeneracy check in Sec. IV A.
"""
instance_provenance = "Literal md:193 (general DMRG size range + PBC); md:223 (ED size range)"

[[problem.targets]]
panel = "energy_density_alpha_c"
quantity = "SUSY-restoration transition point alpha_c, located from the L->infinity-extrapolated ground-state energy density e_gs(alpha) (fit E_gs(alpha;L)/L = e_gs(alpha) + a/L^b per size, Eq. 9) vanishing under a fixed power-law form e_gs(alpha) = a(alpha_c-alpha)^(5/2) for alpha<alpha_c (Eq. 12)"
sizes = "L = 14,16,18,...,50; PBC; finite DMRG, fermionic representation"
tier = "light"
provenance = "Literal md:207"

[[problem.targets]]
panel = "energy_gap_crossover"
quantity = "interaction-strength window alpha'_c where the L->infinity-extrapolated excitation gap Delta_infinity(alpha) (fit Delta(L;alpha) = Delta_infinity(alpha) + a/L^b per size; finite-size gap = E_3rd-lowest - E_lowest, per md:223 (ground state doubly degenerate)) becomes significantly nonzero"
sizes = "L = 4,5,...,15; PBC; exact diagonalization"
tier = "light"
provenance = "Literal md:239"

[[problem.targets]]
panel = "central_charge_alpha_c"
quantity = "SUSY-restoration transition point alpha_c, located from the peak (over alpha) of the finite-size central-charge estimator Delta_S(L) := S(L/2;L) - S(L/4;L) built from the von Neumann entanglement entropy of the DMRG ground state (Eq. 16), extrapolated in L; central charge approaches 1/2 well below the peak and 7/10 at the peak"
sizes = "L = 20,24,28,32,36,40,44,48,52 (Inferred from Fig. 5 legend); PBC; finite DMRG, Jordan-Wigner spin representation (Appendix A)"
tier = "light"
provenance = "Literal md:301"

[[problem.targets]]
panel = "gap_ratio_alpha_c"
quantity = "SUSY-restoration transition point alpha_c, located from three independent universal gap ratios R1,R2,R3 (Eq. 18, built from the lowest two energies in each of four fermion-parity x boundary-condition sectors) each matched, per size, to their tricritical-Ising CFT prediction and extrapolated in L"
sizes = "L = 16,18,...,48,50 (curves plotted for L=20,30,40,50); PBC and APBC, both fermion-parity sectors; finite DMRG"
tier = "light"
provenance = "Literal md:339"

[[problem.targets]]
panel = "ground_state_degeneracy"
quantity = "ground-state degeneracy under fermionic PBC, as a function of alpha across 0 < alpha <= 1/2"
sizes = "same finite range as the exact-diagonalization gap calculation (L unspecified beyond that in this passage)"
tier = "light"
provenance = "Literal md:277"

[method]

[[method.routes]]
family = "mps"
algorithm = "finite DMRG, PBC, finite-size extrapolation to L->infinity; fermionic representation for the energies, Jordan-Wigner spin representation (Appendix A) for the entanglement-entropy runs"
used_for = ["energy_density_alpha_c", "central_charge_alpha_c", "gap_ratio_alpha_c"]
provenance = "Literal md:193"

[[method.routes]]
family = "ed"
algorithm = "exact diagonalization of finite periodic chains, L<=15; low-lying spectrum (ground + higher excited levels) in both fermion-parity sectors and both PBC/APBC"
used_for = ["energy_gap_crossover", "ground_state_degeneracy"]
provenance = "Literal md:193"

[[method.valid_alternatives]]
family = "mps"
algorithm = "infinite DMRG / VUMPS (uniform ansatz, L->infinity directly)"
basis = "Inferred: translation-invariant PBC chain; an infinite-MPS route reaches e_gs(alpha), the entanglement entropy and the low-lying spectrum without finite-size extrapolation"

[[method.valid_alternatives]]
family = "mps"
algorithm = "TEBD / iTEBD (imaginary-time ground-state projection)"
basis = "Inferred: any ground-state projection method supplying the same finite-size energies and entanglement spectra is target-equivalent to finite DMRG here"

[[method.valid_alternatives]]
family = "ed"
algorithm = "sparse Lanczos/Arnoldi diagonalization"
basis = "Inferred: dense and sparse ED are both routine at L<=15 (Hilbert-space dimension 2^15=32768); the paper does not state which was used"

