[paper]
id = "2410.01460"
title = "First-order transition and marginal critical behavior in a 2D frustrated Ising model"
authors = "C. Chatelain"
journal = "Phys. Rev. E 111, 024109 (2025)"
family = "peps"
tier = "light"
kind = "physics"
