bond_weight_exponent = {chosen = -0.5, TRG_value = 0.5, meaning = "exponent k in the inserted bond weight", provenance = "Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:213"}
lattice_growth = {factor = "√2", largest_reported_width = "√2^33 ≃ 92,680", provenance = "Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:179,253"}
free_energy_fit = {form = "quadratic in 1/L^2 with a 1/L^4 correction", discard_threshold = 1e-12, provenance = "Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:245,250,253"}
critical_line_search = {initial_states = 16, refined_states = [24, 32, 48], dichotomy_accuracy = 1e-5, provenance = "Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:255-257"}

