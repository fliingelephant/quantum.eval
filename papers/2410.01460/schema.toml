[candidate_notes]
model = "two AFM Ising replicas coupled by non-local interactions, square lattice; TRG contraction of the classical partition function"
headline = "transition lines (first- vs second-order regimes); central charge / exponents establishing Ashkin-Teller marginal criticality; resolves MC-vs-TN tension for J1-J2 Ising universality"
compute = "classical Ising TRG, minutes-scale on laptop"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"
[problem]
model = "Two anti-ferromagnetic Ising replicas, A and B, on square lattices coupled by a non-local spin-spin interaction. The intra-replica couplings are anti-ferromagnetic and the inter-replica coupling is ferromagnetic on horizontal edges and anti-ferromagnetic on vertical edges. Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:105,111,141"
convention = "The dimensionless Hamiltonian is written as -βH with couplings J1 and J2; the two intra-replica terms carry -J2 and the inter-replica terms carry ±J1. Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:108,111"
lattice = "Two replicas on the same two-dimensional square lattice; the paper also describes a half-step shift as an equivalent representation. Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:105,111"
symmetry = "The phase diagram is symmetric under J1 → -J1 and under exchange J1 ↔ J2, with the latter implemented by replica exchanges and line flips. Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:111-129"
boundary_conditions = "Not stated explicitly in the rendered paper; the numerical targets use stripe widths L and a transfer matrix. Inferred from the setup and estimator descriptions in Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:225-227,245"
phase_context = "The relevant phases are paramagnetic and anti-ferromagnetic, with two symmetry-related transition lines and both first- and second-order regimes. The order parameter is a staggered magnetization of either replica. Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:229-233,239-241"

