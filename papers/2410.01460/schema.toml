[method]
family = "Tensor-network renormalization for a two-dimensional classical partition function"
algorithm = "Bond-Weighted Tensor Renormalization Group (BTRG), derived from square-lattice TRG"
representation = "The partition function is represented as a product of rank-4 tensors; each tensor is decomposed by SVD on odd and even sites, the resulting rank-3 tensors are contracted, and bond weights are inserted between the factors. Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:153-179,181-213"
transfer_matrix_route = "A χ × χ transfer matrix is formed by contracting the tensor; its largest eigenvalue gives the free-energy density, and eigenvalue gaps give scaling dimensions. Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:218-227,264-268"
estimators = [
  "Staggered magnetization from a finite difference of the free-energy density. Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:231-241",
  "Central charge from finite-size scaling of f(L) at the maximum along the critical line. Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:245-257",
  "Scaling dimensions from the transfer-matrix gap relation. Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:268,273"
]
valid_alternatives = [
  "Tensor-network renormalization: TRG, HOTRG, or CTMRG routes can produce the same partition-function and transfer-matrix targets. Inferred from the tensor-network route and the paper's comparison to TRG-family studies in Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:91-97,151-213.",
  "Transfer-matrix finite-size methods can produce free energies, transition indicators, and conformal data for the same classical model. Inferred from the target definitions and transfer-matrix estimator in Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:93,225-227.",
  "Monte Carlo finite-size scaling can produce the phase-boundary and critical-behavior targets, although not through the paper's transfer-matrix gap estimator. Inferred from the paper's discussion of Monte Carlo studies and the target observables in Literal papers/2410.01460/2410.01460_first-order-transition-and-marginal-critical-behavior-in-a-t.md:65,91-93,218-291."
]

