text = "with σi,j ∈{−1; +1}. The ferromagnetic Ising model is recovered when J2 = 0. The system undergoes therefore a ferromagnetic-paramagnetic second-order phase transition at the self-dual coupling J1 =[1] 2[ln(1 +] √2) [1, 2]. The critical behavior belongs to the Ising universality class with magnetic and thermal critical exponents β = 1/8 and ν = 1 and a central charge c = 1/2. When J1 = 0, the system decouples into two sublattices, at 45[◦] of the original lattice and with a lattice step √2 (Fig. 1). Each one of these sublattices undergoes a transition from an anti-ferromagnetic phase to the paramagnetic phase at J2 = 12[ln(1][+] √2). The associated critical behavior also belongs to the Ising universality class. The central charge of the model is c = 2 × 2[1][= 1.] "

