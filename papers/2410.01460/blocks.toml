[[blocks]]
sections = ["method", "method_params"]
lines = "213"
text = "The main difference lies in the way the rank 4 tensors T are decomposed after the SVD of Eq. 14. Each tensor T is replaced by the contraction of either the two rank 3 tensors Usisj sn (Λsn )[k] and (Λsn )[k] Vskslsn on even sites or Uslsisn (Λsn )[k] and (Λsn )[k] Vsj sksn on odd sites. Between these two rank 3 tensors, a new weight (Λsn )[1][−][2][k] is introduced. k is a free parameter. The TRG algorithm is recovered when k = 1/2. It was suggested that the optimal choice is k = −1/2 [27]. The algorithm is depicted on Fig. 4. "

