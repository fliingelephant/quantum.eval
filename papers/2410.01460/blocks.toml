lines = "151"
text = "## B. The BTRG algorithm "

[[blocks]]
sections = ["method"]
lines = "153"
text = "The BTRG algorithm derives from the Tensor Renormalization Group (TRG) algorithm introduced by Levin and Nave [24, 25]. The original TRG algorithm was proposed first for the triangular lattice before being extended to the square lattice [26]. The starting point is a decomposition of the partition function as a product of rank 4 tensors: "

[[blocks]]
sections = ["method"]
lines = "156"
text = "![](.figures/arxiv__2410.01460/2410.01460.pdf-0003-21.png)"

[[blocks]]
sections = ["method"]
lines = "159"
text = "A tensor T is located at each vertex α of the lattice. Eα denotes the subset of edges of the lattice connecting the vertex α to its neighbors. Bond variables si are carried by the edges of the lattice. The bond variable si appears among the indices of the two tensors located at the vertices that are connected by the bond i. In the simple case of the Ising model, a possible decomposition of the partition function consists in identifying the bond variables si with the Ising spins σi (or with (σi + 3)/2 ∈{1, 2} in the numerical implementation). The tensors T are then located at the center of the plaquettes of the square lattice and correspond to the Boltzmann weight of this plaquette: "

[[blocks]]
sections = ["method"]
lines = "162"
text = "![](.figures/arxiv__2410.01460/2410.01460.pdf-0003-23.png)"

[[blocks]]
sections = ["method"]
lines = "167"
text = "This formulation makes it easy to construct the effective statistical weight T[eff] resulting from the decimation of a spin σi. T[eff] is given by the contraction of the two tensors at the two edges of the bond carrying the spin σi "

[[blocks]]
sections = ["method"]
lines = "170"
text = "![](.figures/arxiv__2410.01460/2410.01460.pdf-0004-02.png)"

[[blocks]]
sections = ["method"]
lines = "173"
text = "It is a rank 6 tensor. Iterating this procedure leads to a partition function with fewer and fewer spins but with tensors of larger and larger ranks that rapidly become unmanageable by a computer. The solution proposed by Levin and Nave relies on a Singular Value Decomposition (SVD) of each tensor before any decimation. The SVD is performed in two different ways: "

[[blocks]]
sections = ["method"]
lines = "176"
text = "![](.figures/arxiv__2410.01460/2410.01460.pdf-0004-04.png)"

[[blocks]]
sections = ["method", "method_params"]
lines = "179"
text = "for odd and even lattice sites (Fig. 3). U and V are unitary matrices that are reshaped into rank 3 tensors. Each rank 4 tensor T is replaced by the contraction of either the two rank 3 tensors Usisj sn �Λsn and �Λsn Vskslsn on even sites or Uslsisn �Λsn and �Λsn Vsj sksn on odd sites. As can be seen on Fig. 3, the new tensors form a lattice with two kinds of plaquettes with either 4 or 8 sites. The 4 tensors of the plaquettes with 4 sites can be contracted, leaving a single rank 4 tensor. Performing this operation in all such plaquettes leads to a new lattice of rank 4 tensors with a lattice step larger by a factor √2 and oriented at 45[◦] of the initial one. The above-detailed procedure is exact. However, if the dimension of the tensors is initially χ[4] , the dimension of the rank 3 tensors after the SVD of Eq. 14 is χ × χ × χ[2] . After contraction, the final tensors have a dimension (χ[2] )[4] . Again, after a few iterations of this algorithm, the tensors become exponentially large. To circumvent this problem, the SVD Eq. 14 can be limited to the χ largest singular values. This truncation ensures that the dimension of the rank 3 tensors U and V are χ[3] , leading to a tensor T of dimension χ[4] after contraction. This algorithm belongs to the class of variational methods. Indeed, the truncation minimizes the error defined as the Hilbert-Schmidt norm ||T − Ttrunc|| where Ttrunc is the result of the truncation of T . "

[[blocks]]
sections = ["method", "method_params"]
lines = "181"
text = "The accuracy of the TRG algorithm can be improved by introducing a weight w on each bond of the lattice [27]. The decomposition Eq. 11 of the partition function is replaced by "

[[blocks]]
sections = ["method"]
lines = "184"
text = "![](.figures/arxiv__2410.01460/2410.01460.pdf-0004-07.png)"

[[blocks]]
sections = ["method"]
lines = "187"
text = "The Bond-Weighted Tensor Renormalization Group algorithm (BTRG) is very similar to the TRG algorithm. "

[[blocks]]
sections = ["method"]
lines = "190"
text = "![](.figures/arxiv__2410.01460/2410.01460.pdf-0004-09.png)"

[[blocks]]
sections = ["method"]
lines = "197"
text = "FIG. 3. TRG algorithm on the square lattice. Tensors are represented as disks with different colors on even and odd sites. The bonds between them carry the variables si that have to be integrated out to compute the partition function. Each variable si appears among the indices of the two tensors at both edges of the bond i. Above and below, the Singular Value Decomposition of the tensor T on odd and even sites allows to write the tensor T as the contraction of two rank 3 tensors U √Λ and √ΛV . In the center, the new lattice obtained after the decomposition of all tensors T . On the right, the bonds of the square plaquettes have been integrated out, leaving a square lattice of new effective tensors represented in orange color. "

[[blocks]]
sections = ["method"]
lines = "200"
text = "![](.figures/arxiv__2410.01460/2410.01460.pdf-0004-11.png)"

[[blocks]]
sections = ["method"]
lines = "208"
