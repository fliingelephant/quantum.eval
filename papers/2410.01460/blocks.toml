text = "A cubic fit does not yield significantly different results. Two difficulties were however encountered: the lattice size is multiplied by a factor √2 at each iteration of the BTRG algorithm. As a consequence, our lattice sizes are distributed exponentially, and not linearly, as would be the case with a more traditional transfer matrix calculation. We have checked for the Ising model and the Ashkin-Teller model along its critical line that the fit gives nevertheless the expected central charge. We assume that it is also the case for our J1 − J2 model. The second difficulty is that the free energy does not behave as 1/L[2] at large lattice sizes (our largest lattice size is 33 √2 ≃ 92, 680) but tends towards a plateau, due to the finite number of states χ kept in the BTRG calculation and to the finite accuracy in the estimation of the largest eigenvalue λ0 with the Arpack library. To circumvent this problem, we discarded all free energies f (Ln) such that |f (Ln) − f (Ln−1)| < 10[−][12] where {Ln} are the set of lattices sizes given by the BTRG algorithm. Examples of fits of the free energy density are shown on Fig. 6 for three different points on the critical line. Because the lattice sizes are distributed exponentially, logarithms are plotted. One clearly sees on Fig. 6 the plateau reached by the free energy at large lattice sizes. "

[[blocks]]
sections = ["problem", "method", "method_params", "truth"]
lines = "257"
text = "(J1, J2)J1, J2)1, J2), J2)2)) while keeping only χ = 16 states in the BTRG algorithm. The location of the maxima was then refined by dichotomy until reaching an accuracy of 10[−][5] . A few points around the maxima were selected and used to initiate a new search by dichotomy with χ = 24 states. The procedure was repeated for 32 and 48 states. The central charge is plotted for χ = 16 in Fig. 7. Two branches are clearly observed. As expected (Sec. II A), they are images of each other under the exchange J1 ↔ J2. The two branches seem to merge at J1 = J2 ≃ 0.6. Beyond this point, i.e. for J1 ≳ 0.6, the free energy density f (L) reaches a plateau already for small lattice sizes L so that no fit can be performed. For χ = 24, the free energy density f (L) can be fitted only for J1 ≲ 0.40 (first branch) or J2 ≲ 0.40 (second branch). For χ = 32 and 48, the fit is reliable only for J1 ≲ 0.33 (first branch) or J2 ≲ 0.33 (second branch). In contrast to the case χ = 16, the two branches do not merge anymore. This does not imply that there is no phase transition for J1 ≳ 0.33. A phase transition was indeed observed in Sec. III A. However, the relation Eq. 17 holds only for second-order phase transitions when the RG fixed point is conformally invariant. The phase transition beyond J1 ≳ 0.33 is therefore probably of first order. "

[[blocks]]
