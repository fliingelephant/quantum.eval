headline = "iDMRG phase diagram with robust Haldane region: string order + doubly-degenerate entanglement spectrum; SPT classification backbone"
compute = "spin-1 (dim 3), modest chi; long-range couplings need MPO sum-of-exponentials -- slightly heavier than NN chain; laptop"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = { value = "One-dimensional spin-1 chain with dipole-dipole XY couplings proportional to 1/r_ij^3, single-ion anisotropy D, and van der Waals terms proportional to 1/r_ij^6, as written in eq. (2).", provenance = "Literal papers/2410.21424/2410.21424_spin-1-haldane-phase-in-a-chain-of-rydberg-atoms.md:70-90" }
convention = { value = "The three local states are |+>, |0>, and |->; energies are expressed as frequencies in h·MHz; J^xy is the energy scale, and the simplified Hamiltonian preserves D2 and time-reversal symmetry while conserving M_tot.", provenance = "Literal papers/2410.21424/2410.21424_spin-1-haldane-phase-in-a-chain-of-rydberg-atoms.md:72-92,106" }
instance = { value = "Thermodynamic-limit phase diagram in D/J^xy and V/J^xy, plus an experimentally proposed finite chain of L=10 Rb atoms with r=11.6 μm, B=60.7 G, θ=35.1°, and zero electric field; the full finite-chain Hamiltonian retains interactions through fifth neighbors.", provenance = "Literal papers/2410.21424/2410.21424_spin-1-haldane-phase-in-a-chain-of-rydberg-atoms.md:176-178,214-220,230,314-316" }

