# Searcher notes; superseded by [problem]/[truth] sections after paper-to-schemas.
[candidate_notes]
model = "effective spin-1 chain from three Rydberg states (dipole-dipole 1/r^3 + vdW 1/r^6); iDMRG. Theory proposal, no experimental data"
headline = "iDMRG phase diagram with robust Haldane region: string order + doubly-degenerate entanglement spectrum; SPT classification backbone"
compute = "spin-1 (dim 3), modest chi; long-range couplings need MPO sum-of-exponentials -- slightly heavier than NN chain; laptop"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "Effective spin-1 chain with long-range XY exchange Jxy, single-ion anisotropy D, and van der Waals interaction V, as given by the Hamiltonian in the paper."
model_provenance = "Literal 2410.21424_spin-1-haldane-phase-in-a-chain-of-rydberg-atoms.md:80-90"
convention = "Energies are frequencies in h·MHz; Jxy is the energy scale, and the phase diagram is parameterized by D/Jxy and V/Jxy. The three local states are labeled |+>, |0>, and |-> and conserve total z magnetization."
convention_provenance = "Literal 2410.21424_spin-1-haldane-phase-in-a-chain-of-rydberg-atoms.md:72-90,106,178"
instance = "One-dimensional chain of three-level Rydberg atoms. The experimental point uses 87Rb states near n=80, r=11.6 µm, B=60.7 G, θ=35.1°, and zero electric field; the finite chain has L=10 sites and the thermodynamic calculations use an infinite MPS."
instance_provenance = "Literal 2410.21424_spin-1-haldane-phase-in-a-chain-of-rydberg-atoms.md:72,108,206,214-220,230"
boundary_conditions = "Infinite-MPS calculations for the phase diagram; finite-chain calculations for L=10."
