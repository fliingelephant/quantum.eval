[method]
route = { value = "Infinite DMRG/iDMRG for the thermodynamic-limit phase diagram; finite DMRG and tensor-network time evolution for the L=10 ground-state, preparation, and dynamics results.", provenance = "Literal papers/2410.21424/2410.21424_spin-1-haldane-phase-in-a-chain-of-rydberg-atoms.md:166-178,230" }
algorithm = { value = "Matrix-product-state ground-state optimization with infinite DMRG for the phase map, finite-chain DMRG for the four ground states, and tensor-network time evolution for the driven edge-state target.", provenance = "Literal papers/2410.21424/2410.21424_spin-1-haldane-phase-in-a-chain-of-rydberg-atoms.md:166,178,230,244-248" }
valid_alternatives = { value = "VUMPS or another MPS ground-state solver for the infinite-chain targets; finite DMRG or exact diagonalization for L=10; TEBD or TDVP for the time-dependent target.", provenance = "Inferred from the one-dimensional spin-1 ground-state and local-dynamics targets identified in papers/2410.21424/2410.21424_spin-1-haldane-phase-in-a-chain-of-rydberg-atoms.md:166-178,230,246" }

