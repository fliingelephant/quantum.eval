# Searcher notes; superseded by [problem]/[truth] sections after paper-to-schemas.
[candidate_notes]
model = "spin-1/2 chain with engineered PST couplings + projected chaotic perturbation (and spin-1 analog); full ED, level statistics, unitary evolution"
headline = "transfer fidelity -> 1 at revival time despite GOE bulk spectrum; transfer subspace = the N+1 scar eigenstates; exact su(2) spectrum-generating algebra"
compute = "N=12 spin-1/2 (4096) and N=8 spin-1 (6561): full ED in seconds on laptop"
verification = "candidate (searcher-verified journal ref; re-confirm at download-ref time)"

[problem]
model = "Two related open one-dimensional spin-chain models: a spin-1/2 chain with engineered nearest-neighbour PST couplings and a spin-1 chain embedding of the same PST dynamics; each is studied with generic and projector-protected interactions."
model_provenance = "Literal 2506.22114_perfect-quantum-state-transfer-through-a-chaotic-spin-chain.md:66, 120-126, 168-196"
convention = "For spin-1/2, X, Y, and Z are Pauli operators in the |0>,|1> basis; for spin-1, X^(1), Y^(1), and Z^(1) act on the |->,|0>,|+> local basis. The field is along z and the engineered coupling is lambda_n = lambda sqrt(n(N-n)); the numerical examples use omega = 0 and lambda = 1."
convention_provenance = "Literal 2506.22114_perfect-quantum-state-transfer-through-a-chaotic-spin-chain.md:66, 72, 118, 172-184"
instance = "Spin-1/2 targets use N = 12, local dimension d = 2, all-up or all-down background, and |psi> = (|0> + |1>)/sqrt(2). Spin-1 targets use N = 8, local dimension d = 3, all-plus or all-minus background, and |psi> = (|+> + |->)/sqrt(2). The base chain is one-dimensional; the spin-1 generic interaction is an arbitrary two-body Hermitian operator, while the spin-1/2 generic example is a local three-spin Hermitian operator."
instance_provenance = "Literal 2506.22114_perfect-quantum-state-transfer-through-a-chaotic-spin-chain.md:118, 126, 152, 170-198, 176"
initial_state = "The transferred state starts at site 1 and is read out at site N after time-independent Hamiltonian evolution, with a local unitary correction on the final spin."
initial_state_provenance = "Literal 2506.22114_perfect-quantum-state-transfer-through-a-chaotic-spin-chain.md:50, 66, 84, 90"

