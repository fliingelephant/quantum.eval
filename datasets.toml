# Named dataset selections: predicates over [paper] fields, evaluated by
# scripts/select.py over papers/*/schema.toml at a pinned repo commit.
# Experiments reference (dataset name, commit) — never copies.

[light-physics]
where = "tier == 'light' and kind == 'physics'"

[medium-physics]
where = "tier == 'medium' and kind == 'physics'"

[all-physics]
where = "kind == 'physics'"
